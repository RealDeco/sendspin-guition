### other
  - platform: file
    file: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/${imagemodel1}/${screenwidth}x${screenheight}/playing.png
    id: fallback_playing_image
    resize: ${screenwidth}x${screenheight}
    type: RGB565
    dither: NONE

### wallpaper

  - platform: online_image
    id: standby_background_image
    url: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/Other/${screenwidth}x${screenheight}/clock.png
    format: PNG
    type: RGB565
    resize: ${screenwidth}x${screenheight}
    update_interval: never
    on_download_finished:
      - if:
          condition:
            switch.is_on: standby_background_enabled
          then:
            - lvgl.image.update:
                id: standby_background_widget
                src: standby_background_image
            - lambda: |-
                lv_obj_clear_flag(id(standby_background_widget), LV_OBJ_FLAG_HIDDEN);
    
### sendspin album art

  - platform: sendspin
    id: album_slot
    format: JPEG
    type: RGB565
    resize: ${screenwidth}x${screenheight}
    display_offset: 1s
    source: ALBUM
    current_image:
      id: sendspin_album_art
    transition_image:
      id: sendspin_album_art_transition
    on_image_display:
      - logger.log:
          format: "Album art displayed (late by %u ms)"
          args: ["(unsigned) lateness_ms"]
          level: WARN
      - lambda: |-
          id(last_album_art_valid) = id(sendspin_album_art_valid);
          id(sendspin_album_art_valid) = true;
          id(album_art_awaiting_swipe_art) = false;
          id(confirmed_art_album_name) = id(sendspin_album).get_state();
      - if:
          condition:
            lambda: 'return !id(album_art_slide_active);'
          then:
            - script.execute: album_art_crossfade_apply
          else:
            - sendspin.image.transition_finished: album_slot
      - lvgl.image.update:
          id: controls_album_art_widget
          src: sendspin_album_art
      - lvgl.image.update:
          id: playlist_album_art_widget
          src: sendspin_album_art
    on_image_clear:
      - lambda: |-
          ESP_LOGW("imagecheck", "Album art cleared: %s", id(sendspin_album).get_state().c_str());
          id(last_album_art_valid) = id(sendspin_album_art_valid);
          id(sendspin_album_art_valid) = false;
      - script.execute: album_art_show_fallback
    on_image_error:
      - lambda: |-
          id(last_album_art_valid) = id(sendspin_album_art_valid);
          id(sendspin_album_art_valid) = false;
      - script.execute: album_art_show_fallback

  - platform: sendspin
    id: artist_slot
    format: PNG
    type: RGB565
    resize: ${screenwidth}x${screenheight}
    source: artist
    current_image:
      id: artist_art
    on_image_display:
      - logger.log:
          format: "Artist art available (late by %u ms)"
          args: ["(unsigned) lateness_ms"]
          level: INFO
      - lambda: |-
          id(artist_art_valid) = true;
          id(refresh_artist_art_dot)->execute();
    on_image_clear:
      - logger.log:
          format: "No artist art for this song"
          level: INFO
      - lambda: |-
          id(artist_art_valid) = false;
          id(refresh_artist_art_dot)->execute();
    on_image_error:
      - lambda: |-
          ESP_LOGW("artist_art", "failed to decode artist art");
          id(artist_art_valid) = false;
          id(refresh_artist_art_dot)->execute();


sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

audio_file:
  - id: timer_finished_sound
    file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
  - id: ready_sound
    file: https://github.com/RealDeco/xiaozhi-esphome/raw/main/sounds/${startup_sound_file}.flac
  - id: wake_word_sound
    file: https://github.com/RealDeco/xiaozhi-esphome/raw/main/sounds/${wakeup_sound}.flac

http_request:

button:
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    icon: "mdi:restart"

spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO38
  data_pins: [GPIO4, GPIO5, GPIO6, GPIO7]

i2c:
  id: bus_a
  sda: GPIO15
  scl: GPIO14

i2c_device:
  - id: axp2101_dev
    i2c_id: bus_a
    address: 0x34

audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000

audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO42
    full_duplex: true

microphone:
  - platform: i2s_audio
    id: raw_microphone
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO10
    adc_type: external
    channel: stereo
    pdm: false
    sample_rate: ${media_sample_rate}
    bits_per_sample: 16bit
  - platform: resampler
    id: voice_microphone
    microphone:
      microphone: raw_microphone
      channels: [0]
    sample_rate: 16000
    buffer_duration: 500ms

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: ${media_sample_rate}
    bits_per_sample: 16bit
    channel: mono

  - platform: mixer
    id: mixing_speaker
    output_speaker: box_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
      - id: media_mixing_input

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: ${media_sample_rate}
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: ${media_sample_rate}
    bits_per_sample: 16

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
  - platform: audio_http
    id: http_media_source
  - platform: sendspin
    id: sendspin_media_source

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    name: Sendspin Group Media Player
    on_idle:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: 'return id(ui_phase) != ${ui_phase_player_controls};'
          then:
            - script.execute:
                id: set_ui_phase
                phase: ${ui_phase_standby}

  - platform: speaker_source
    id: external_media_player
    name: Media Player

    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: ${media_sample_rate}
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source

    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: ${media_sample_rate}
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85

    on_play:
      then:
        - if:
            condition:
              and:
                - lambda: 'return id(va_phase) == ${va_phase_idle};'
                - lambda: 'return !id(va_reply_active);'
                - not:
                    media_player.is_announcing:
                      id: external_media_player
            then:
              - lambda: |-
                  ESP_LOGW("va", "stopping wake word for media playback");
              - script.execute: stop_wake_word
        - script.execute: led_ring_apply_state
        - if:
            condition:
              lambda: 'return id(va_phase) == ${va_phase_idle};'
            then:
              - if:
                  condition:
                    lambda: 'return id(ui_phase) == ${ui_phase_player_controls};'
                  then:
                    - script.execute:
                        id: set_ui_phase
                        phase: ${ui_phase_player_controls}
                  else:
                    - script.execute:
                        id: set_ui_phase
                        phase: ${ui_phase_now_playing}

    on_idle:
      then:
        - if:
            condition:
              lambda: 'return id(va_reply_active);'
            then:
              - lambda: |-
                  id(va_reply_active) = false;
              - script.execute: finish_va_reply
            else:
              - if:
                  condition:
                    and:
                      - lambda: 'return id(va_phase) == ${va_phase_idle};'
                      - not:
                          media_player.is_announcing:
                            id: external_media_player
                  then:
                    - script.execute: start_wake_word
              - script.execute: led_ring_apply_state

    on_pause:
      then:
        - script.execute: led_ring_apply_state
        - if:
            condition:
              lambda: 'return id(va_phase) == ${va_phase_idle};'
            then:
              - script.execute: start_wake_word
              - script.execute:
                  id: set_ui_phase
                  phase: ${ui_phase_player_controls}

touchscreen:
  - platform: cst9220
    id: my_touchscreen
    interrupt_pin: GPIO11
    reset_pin: GPIO40
    display: main_display
    i2c_id: bus_a
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true
    on_touch:
      then:
        - script.execute: standby_screen_activity
        - lambda: |-
            id(touch_active) = true;
            id(touch_start_x) = touch.x;
            id(touch_start_y) = touch.y;
            id(touch_last_x) = touch.x;
            id(touch_last_y) = touch.y;
            id(touch_start_ms) = millis();
            id(touch_swipe_detected) = false;
    on_update:
      then:
        - lambda: |-
            if (!id(touch_active)) return;
            for (auto &touch : touches) {
              if (touch.state >= 1 && touch.state <= 2) {
                id(touch_last_x) = touch.x;
                id(touch_last_y) = touch.y;
                const int min_dim = std::min(id(main_display).get_width(), id(main_display).get_height());
                const int swipe_min_dist = std::max(16, min_dim / 8);
                if (std::abs(id(touch_last_x) - id(touch_start_x)) >= swipe_min_dist ||
                    std::abs(id(touch_last_y) - id(touch_start_y)) >= swipe_min_dist) {
                  id(touch_swipe_detected) = true;
                  lv_obj_remove_state(id(controls_mute_button), LV_STATE_PRESSED);
                  lv_obj_remove_state(id(controls_repeat_button), LV_STATE_PRESSED);
                  lv_obj_remove_state(id(controls_toggle_button), LV_STATE_PRESSED);
                  lv_obj_remove_state(id(controls_shuffle_button), LV_STATE_PRESSED);
                  lv_obj_remove_state(id(controls_volume_down_button), LV_STATE_PRESSED);
                  lv_obj_remove_state(id(controls_volume_up_button), LV_STATE_PRESSED);
                }
                break;
              }
            }
    on_release:
      then:
        - lambda: |-
            if (!id(touch_active)) return;
            id(touch_active) = false;

            const int dx = id(touch_last_x) - id(touch_start_x);
            const int dy = id(touch_last_y) - id(touch_start_y);
            const int abs_x = std::abs(dx);
            const int abs_y = std::abs(dy);
            const uint32_t elapsed = millis() - id(touch_start_ms);
            const int min_dim = std::min(id(main_display).get_width(), id(main_display).get_height());
            const int swipe_min_dist = std::max(16, min_dim / 8);
            const int tap_max_dist = std::max(14, min_dim / 12);

            if (id(va_phase) != ${va_phase_idle}) {
              id(stop_active_va)->execute();
              return;
            }

            if (elapsed <= 1500 && (abs_x >= swipe_min_dist || abs_y >= swipe_min_dist)) {
              if (id(ui_phase) == ${ui_phase_now_playing}) {
                if (abs_x >= abs_y) {
                  if (dx < 0) {
                    id(now_playing_swipe_left)->execute();
                  } else {
                    id(now_playing_swipe_right)->execute();
                  }
                } else if (dy < 0) {
                  if (id(now_playing_art_mode)) {
                    id(now_playing_show_album_art)->execute();
                  }
                } else {
                  if (id(artist_art_valid) && !id(now_playing_art_mode)) {
                    id(now_playing_show_artist_art)->execute();
                  }
                }
              } else if (id(ui_phase) == ${ui_phase_player_controls}) {
                if (abs_x >= abs_y) {
                  if (dx < 0) {
                    id(player_controls_swipe_next)->execute();
                  } else {
                    id(player_controls_swipe_previous)->execute();
                  }
                } else if (dy < 0) {
                  id(start_manual_va)->execute();
                } else {
                  id(open_playlist_menu)->execute();
                }
              } else if (id(ui_phase) == ${ui_phase_playlist_menu}) {
                if (abs_x >= abs_y) {
                  if (dx < 0) {
                    id(player_controls_swipe_next)->execute();
                  } else {
                    id(player_controls_swipe_previous)->execute();
                  }
                } else if (dy < 0) {
                  id(close_playlist_menu)->execute();
                }
              } else if (id(ui_phase) == ${ui_phase_standby}) {
                if (abs_x >= abs_y) {
                  if (dx < 0) {
                    id(clock_style_choice).make_call().select_next(true).perform();
                  } else {
                    id(clock_style_choice).make_call().select_previous(true).perform();
                  }
                } else if (dy < 0) {
                  id(start_manual_va)->execute();
                }
              }
              return;
            }

            if (elapsed <= 700 && abs_x <= tap_max_dist && abs_y <= tap_max_dist) {
              id(set_ui_phase)->execute(${ui_phase_player_controls});
            }

