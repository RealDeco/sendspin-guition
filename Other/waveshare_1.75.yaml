      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis

### other wakewords to use at own risk.
#    - model: https://raw.githubusercontent.com/TaterTotterson/microWakeWords/refs/heads/main/microWakeWordsV3/hey_gwen.json
