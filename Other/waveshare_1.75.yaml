#      id: okay_nabu
#    - model: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/refs/heads/main/microwakeword/models/v2/kenobi.json
#      id: kenobi
#    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/refs/heads/main/models/v2/experiments/choo_choo_homie.json
#      id: choo_choo_homie
#    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/refs/heads/main/models/v2/experiments/hey_home_assistant.json
#      id: hey_home_assistant
#    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/refs/heads/main/models/v2/experiments/hey_peppa_pig.json
#      id: hey_peppa_pig
#    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/refs/heads/main/models/v2/experiments/okay_computer.json
#      id: okay_computer

    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  on_wake_word_detected:
    - lambda: |-
        ESP_LOGW("va", "micro wake word detected: %s", wake_word.c_str());
        if (wake_word == id(wake_word_1_label).state) {
          id(active_image_set) = 1;
        } else if (wake_word == id(wake_word_2_label).state) {
          id(active_image_set) = 2;
        } else {
          id(active_image_set) = 1;
          ESP_LOGW("va", "wake word did not match configured labels, falling back to image set 1");
        }
        ESP_LOGW("va", "using image set %d for wake word: %s", id(active_image_set), wake_word.c_str());
    - if:
        condition:
          switch.is_on: wake_word_sound_switch
        then:
          - lambda: 'id(play_sound)->execute(false, std::string("wake_word_sound"));'
    - if:
        condition:
          switch.is_off: mute
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      - voice_assistant.stop:
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                              id: external_media_player
                          then:
                            - media_player.stop:
                                announcement: true
                                id: external_media_player
                          else:
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: voice_microphone
  media_player: external_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_start:
    - lambda: |-
        ESP_LOGW("va", "assist pipeline started");
    - text_sensor.template.publish:
        id: text_request
        state: "..."
    - text_sensor.template.publish:
        id: text_response
        state: "..."
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_waiting_for_command}
  on_listening:
    - lambda: |-
        ESP_LOGW("va", "listening");
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_waiting_for_command}
  on_stt_vad_start:
    - lambda: |-
        ESP_LOGW("va", "speech detected");
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_listening}
  on_stt_vad_end:
    - lambda: |-
        ESP_LOGW("va", "speech ended, sending to STT");
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_thinking}
  on_stt_end:
    - lambda: |-
        ESP_LOGW("va", "STT result: %s", x.c_str());
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
  on_tts_start:
    - lambda: |-
        ESP_LOGW("va", "TTS text: %s", x.c_str());
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_replying}
    - script.execute: activate_stop_word_once
  on_tts_end:
    - lambda: |-
        ESP_LOGW("va", "TTS URL: %s", x.c_str());
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_replying}
    - lambda: |-
        id(va_reply_active) = true;
  on_end:
    - lambda: |-
        ESP_LOGW("va", "assist pipeline ended");
    - if:
        condition:
          lambda: return !id(va_reply_active);
        then:
          - script.execute: finish_va_reply
  on_idle:
    - lambda: |-
        ESP_LOGW("va", "idle");
  on_error:
    - lambda: |-
        ESP_LOGW("va", "error: %s - %s", code.c_str(), message.c_str());
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_error}
    - delay: 3s
    - if:
        condition:
          lambda: return id(va_phase) == ${va_phase_error};
        then:
          - script.execute:
              id: set_va_phase
              phase: ${va_phase_idle}
          - if:
              condition:
                switch.is_off: mute
              then:
                - script.execute: start_wake_word
  on_client_connected:
    - script.execute: start_wake_word
  on_client_disconnected:
    - script.execute: stop_wake_word
  on_timer_started:
    - delay: 250ms
    - script.execute: refresh_timer_display
    - script.execute: standby_screen_activity
  on_timer_updated:
    - script.execute: refresh_timer_display
    - script.execute: standby_screen_activity
  on_timer_tick:
    - script.execute: refresh_timer_display
    - script.execute: standby_screen_activity
  on_timer_cancelled:
    - script.execute: refresh_timer_display
    - script.execute: standby_screen_activity
  on_timer_finished:
    - script.execute: refresh_timer_display
    - switch.turn_on: timer_ringing

text_sensor:
  - platform: template
    id: text_request
    name: Last Voice Request
    icon: "mdi:account-voice"

  - platform: template
    id: text_response
    name: Last Voice Response
    icon: "mdi:assistant"
    on_value:
      lambda: |-
        if (x.length() > 255) {
          id(text_response).publish_state(x.substr(0, 253) + "..");
        }

  - platform: template
    id: va_phase_text
    name: Voice assistant phase
    icon: "mdi:account-voice"
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      switch (id(va_phase)) {
        case ${va_phase_waiting_for_command}: return std::string("waiting_for_command");
        case ${va_phase_listening}: return std::string("listening");
        case ${va_phase_thinking}: return std::string("thinking");
        case ${va_phase_replying}: return std::string("replying");
        case ${va_phase_error}: return std::string("error");
        case ${va_phase_timer_ringing}: return std::string("timer_ringing");
        default: return std::string("idle");
      }

  - platform: homeassistant
    id: ha_weather_condition
    entity_id: ${ha_weather_entity}
    on_value:
      - lambda: |-
          const char* icon = "\U000F0590";
          auto c = id(ha_weather_condition).state;
          if (c == "sunny" || c == "clear") {
            icon = "\U000F0599";
          } else if (c == "partlycloudy") {
            icon = "\U000F0595";
          } else if (c == "cloudy") {
            icon = "\U000F0590";
          } else if (c == "rainy") {
            icon = "\U000F0597";
          } else if (c == "pouring") {
            icon = "\U000F0596";
          } else if (c == "snowy") {
            icon = "\U000F0598";
          } else if (c == "lightning") {
            icon = "\U000F0593";
          } else if (c == "hail") {
            icon = "\U000F0592";
          }
          lv_label_set_text(id(weather_icon_glow), icon);
          lv_label_set_text(id(weather_icon), icon);
          lv_label_set_text(id(analog_weather_icon), icon);
  - platform: homeassistant
    id: ha_weather_temperature_unit
    entity_id: ${ha_weather_entity}
    attribute: temperature_unit

  - platform: homeassistant
    id: ha_weather_wind_speed_unit
    entity_id: ${ha_weather_entity}
    attribute: wind_speed_unit

  - platform: sendspin
    id: sendspin_title
    name: "Song Title"
    type: title
    on_value:
      - component.update: now_playing_text
      - lambda: |-
          id(artist_art_valid) = false;
          id(now_playing_art_mode) = false;
          id(refresh_artist_art_dot)->execute();
      - lambda: |-
          id(previous_album_name) = id(sendspin_album).get_state();
      - delay: 100ms
      - lambda: |-
          id(current_album_name) = id(sendspin_album).get_state();
      - lambda: |-
          ESP_LOGW("albumcheck", "title-fired | current_album='%s' | previous_album='%s' | art_valid_before=%d",
                    id(current_album_name).c_str(),
                    id(previous_album_name).c_str(),
                    id(sendspin_album_art_valid));
      - if:
          condition:
            and:
              - lambda: 'return id(album_art_awaiting_swipe_art);'
              - lambda: 'return id(current_album_name) == id(previous_album_name);'
              - lambda: 'return id(current_album_name) == id(confirmed_art_album_name);'
          then:
            - lambda: |-
                id(sendspin_album_art_valid) = true;
                id(album_art_awaiting_swipe_art) = false;
            - script.execute: album_art_crossfade_apply
          else:
            - lambda: |-
                id(album_art_awaiting_swipe_art) = false;
      - lvgl.label.update:
          id: controls_title_label
          text: !lambda return x;

  - platform: sendspin
    id: sendspin_artist
    name: "Song Artist"
    type: artist
    on_value:
      - component.update: now_playing_text
      - lvgl.label.update:
          id: controls_artist_label
          text: !lambda return x;

  - platform: sendspin
    id: sendspin_album
    name: "Album Name"
    type: album
    on_value:
      - component.update: now_playing_text
      - lvgl.label.update:
          id: controls_album_label
          text: !lambda return x;

  - platform: template
    id: now_playing_text
    update_interval: never
    lambda: |-
      std::string s = id(sendspin_title).get_state();
      auto a = id(sendspin_artist).get_state();
      if (!a.empty()) {
        if (!s.empty()) s += " - ";
        s += a;
      }
      return s;
    on_value:
      - lvgl.label.update:
          id: now_playing_label
          text: !lambda return x;

  - platform: template
    id: clock_hms
    update_interval: 1s
    lambda: |-
      auto t = id(homeassistant_time).now();
      if (!t.is_valid()) return std::string("--:--:--");
      bool show_seconds = id(clock_show_seconds).state;
      int hour_disp = t.hour;
      if (id(clock_12h_format).state) {
        hour_disp = t.hour % 12;
        if (hour_disp == 0) hour_disp = 12;
      }
      bool hide_colons = ((t.second % 2) == 0);
      char buf[16];
      if (show_seconds) {
        if (hide_colons) snprintf(buf, sizeof(buf), "%02d %02d %02d", hour_disp, t.minute, t.second);
        else snprintf(buf, sizeof(buf), "%02d:%02d:%02d", hour_disp, t.minute, t.second);
      } else {
        if (hide_colons) snprintf(buf, sizeof(buf), "%02d %02d", hour_disp, t.minute);
        else snprintf(buf, sizeof(buf), "%02d:%02d", hour_disp, t.minute);
      }
      return std::string(buf);
    on_value:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return !id(clock_style_is_analog);'
          then:
            - lvgl.label.update:
                id: clock_label
                text: !lambda return x;
            - lambda: |-
                if (!id(clock_12h_format).state) {
                  lv_obj_add_flag(id(clock_ampm_label), LV_OBJ_FLAG_HIDDEN);
                  return;
                }
                auto t = id(homeassistant_time).now();
                lv_label_set_text(id(clock_ampm_label), (t.is_valid() && t.hour >= 12) ? "P" : "A");
                lv_point_t txt_size;
                lv_text_get_size(&txt_size, x.c_str(), id(font_7seg)->get_lv_font(), 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
                lv_area_t clock_area;
                lv_obj_get_coords(id(clock_label), &clock_area);
                int32_t label_cx = (clock_area.x1 + clock_area.x2) / 2;
                int32_t label_bottom = clock_area.y2;
                lv_obj_set_pos(id(clock_ampm_label), label_cx + txt_size.x / 2 + 5, label_bottom - 34);
                lv_obj_clear_flag(id(clock_ampm_label), LV_OBJ_FLAG_HIDDEN);

  - platform: template
    id: clock_date
    update_interval: 30s
    lambda: |-
      auto t = id(homeassistant_time).now();
      if (!t.is_valid()) return std::string("------");
      static const char* months[] = {
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
      };
      const char* mon = (t.month >= 1 && t.month <= 12) ? months[t.month - 1] : "???";
      char buf[32];
      snprintf(buf, sizeof(buf), "%d %s", t.day_of_month, mon);
      return std::string(buf);
    on_value:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return !id(clock_style_is_analog);'
          then:
            - lvgl.label.update:
                id: date_label
                text: !lambda return x;

  - platform: template
    id: weather_temp_big
    update_interval: 15s
    lambda: |-
      if (!id(ha_weather_temperature).has_state()) return std::string("--");
      std::string tunit = id(ha_weather_temperature_unit).state.c_str();
      if (tunit.empty()) tunit = "\u00B0C";
      lv_label_set_text(id(weather_big_temp_unit), tunit.c_str());
      int ti = (int) lroundf(id(ha_weather_temperature).state);
      char buf[8];
      snprintf(buf, sizeof(buf), "%d", ti);
      char abuf[16];
      snprintf(abuf, sizeof(abuf), "%d%s", ti, tunit.c_str());
      lv_label_set_text(id(analog_weather_temp), abuf);
      return std::string(buf);
    on_value:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return !id(clock_style_is_analog);'
          then:
            - lvgl.label.update:
                id: weather_big_temp
                text: !lambda return x;

  - platform: template
    id: weather_line
    update_interval: 15s
    lambda: |-
      if (!id(ha_weather_temperature).has_state() || !id(ha_weather_wind_speed).has_state()) {
        return std::string("Weather unavailable");
      }
      std::string tunit = id(ha_weather_temperature_unit).state.c_str();
      if (tunit.empty()) tunit = "\u00B0C";
      std::string wunit = id(ha_weather_wind_speed_unit).state.c_str();
      if (wunit.empty()) wunit = "m/s";
      float temp_c = id(ha_weather_temperature).state;
      float wind_ms = id(ha_weather_wind_speed).state;
      float feels_c = temp_c;
      if (temp_c <= 10.0f && wind_ms > 1.3f) {
        float wind_kmh = wind_ms * 3.6f;
        float v16 = powf(wind_kmh, 0.16f);
        feels_c = 13.12f + 0.6215f * temp_c - 11.37f * v16 + 0.3965f * temp_c * v16;
      }
      char buf[160];
      snprintf(buf, sizeof(buf),
               "Wind speed: %.1f %s\nFeels like: %.1f%s",
               wind_ms, wunit.c_str(),
               feels_c, tunit.c_str());
      return std::string(buf);
    on_value:
      - lambda: |-
          id(weather_available) = (x != "Weather unavailable");
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return !id(clock_style_is_analog);'
          then:
            - if:
                condition:
                  and:
                    - lambda: return id(weather_available);
                    - lambda: return id(clock_show_weather).state;
                then:
                  - lvgl.widget.show: weather_header
                else:
                  - lvgl.widget.hide: weather_header
            - if:
                condition:
                  and:
                    - lambda: return id(weather_available);
                    - lambda: return id(clock_show_feels_like).state;
                then:
                  - lvgl.widget.show: weather_label
                  - lvgl.label.update:
                      id: weather_label
                      text: !lambda return x;
                else:
                  - lvgl.widget.hide: weather_label
          else:
            - lvgl.widget.hide: weather_header
            - lvgl.widget.hide: weather_label
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_is_analog);'
              - lambda: return id(weather_available);
              - lambda: return id(clock_show_weather).state;
          then:
            - lvgl.widget.show: analog_weather_icon
            - lvgl.widget.show: analog_weather_temp
          else:
            - lvgl.widget.hide: analog_weather_icon
            - lvgl.widget.hide: analog_weather_temp

