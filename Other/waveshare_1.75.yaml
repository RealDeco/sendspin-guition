substitutions:
  name: esphome-web-6eac80
  friendly_name: Waveshare 1.75

  # User settings

  startup_sound_file: "Home_Connected" # (options are: available, Home_Connected, Home_Connected_Male, Computer_Ready)
  wakeup_sound: "popup" # (options are: popup, wake_word_triggered)
  imagemodel1: "Gwen_Black" # options are: below
  imagemodel2: "Alfred" # options are below

# AlbertQuackmore, Alita, Alfred, Astrobot, Buzz, Casita, Cybergirl, Dory, EVE, Eyes, Eyes2, GLaDOS, Girl1, Guy1, Guy2, Gwen, Gwen_Black, 
# HA-character, ha-girl, Hacker, Harley, Jarvis, Luffy, Mario, Max, Prime, Robochibi, Robocop, Robot, Robotgirl, Salem, Sarah, Shaun

  display_model: "WAVESHARE-ESP32-S3-TOUCH-AMOLED-1.75"

  # Home Assistant weather entity.
  ha_weather_entity: weather.forecast_home


  imagewidth:  "360"
  imageheight: "360"

  screenwidth:  "466"
  screenheight: "466"

  media_sample_rate: 48000

  album_fade_time: "1500ms"

  ui_phase_standby: "0"
  ui_phase_player_controls: "1"
  ui_phase_now_playing: "2"
  ui_phase_playlist_menu: "3"
  va_phase_idle: "0"
  va_phase_waiting_for_command: "1"
  va_phase_listening: "2"
  va_phase_thinking: "3"
  va_phase_replying: "4"
  va_phase_error: "5"
  va_phase_timer_ringing: "6"

packages: # github
  extcomp:
    url: https://github.com/RealDeco/xiaozhi-esphome.git
    ref: main
    refresh: 0s
    files:
      - devices/Under_Development/Modular/HW/sendspin-external_components_2026.8.0.yaml

#packages: # local
#  extcomp: !include localtest/HW/sendspin-external_components_2026.8.0.yaml

external_components:
  - source: github://pr#16882
    components: [audio, i2s_audio, micro_wake_word, resampler]
    refresh: 1h
      
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
#    advanced:
#      execute_from_psram: True
    sdkconfig_options:
#      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "2048"

psram:
  mode: octal
  speed: 80MHz

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.0
  name_add_mac_suffix: false
  project:
    name: realdeco.sendspin_guition
    version: "2026.8.0"
  on_boot:
    priority: -100
    then:
      - script.execute:
          id: set_ui_phase
          phase: ${ui_phase_standby}
      - script.execute:
          id: set_va_phase
          phase: ${va_phase_idle}
      - script.execute: refresh_playlist_labels
      - script.execute: apply_accent_color_debounced
      - script.execute: led_ring_apply_state
      - script.execute:
          id: apply_clock_style
          analog: !lambda 'return id(clock_style_choice).current_option() == "Analog Clock";'
      - lambda: 'id(timer_seconds_remaining).publish_state(0);'

logger:
  level: WARN

api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return !id(boot_sound_played) && !id(boot_announce_active);'
        then:
          - lambda: 'id(boot_announce_active) = true;'
          - lvgl.label.update:
              id: boot_sound_label
              text: "Home Connected"
          - if:
              condition:
                switch.is_on: startup_sound_switch
              then:
                - lambda: 'id(play_sound)->execute(true, std::string("ready_sound"));'
                - delay: 3500ms
              else:
                - delay: 2s
          - lambda: |-
              id(boot_sound_played) = true;
              id(boot_announce_active) = false;
          - script.execute:
              id: set_ui_phase
              phase: !lambda 'return id(ui_phase);'
          - if:
              condition:
                switch.is_on: battery_display_switch
              then:
                - script.execute: refresh_battery_display

ota:
  - platform: esphome

wifi:
  on_connect:
    - delay: 1s
    - if:
        condition:
          switch.is_on: standby_background_enabled
        then:
          - script.execute: load_standby_background
  ap:

improv_serial:

captive_portal:

debug:

sensor:
  - platform: debug
    free:
      name: "SRAM Free Memory"
    block:
      name: "SRAM Largest Contiguous Block"
    psram:
      name: "PSRAM Free Memory"

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

  - platform: homeassistant
    id: ha_weather_temperature
    entity_id: ${ha_weather_entity}
    attribute: temperature
  - platform: homeassistant
    id: ha_weather_wind_speed
    entity_id: ${ha_weather_entity}
    attribute: wind_speed
  - platform: sendspin
    id: sendspin_track_progress
    type: track_progress
    on_value:
      - lambda: 'id(track_progress_anchor_ms) = millis();'
      - script.execute: refresh_now_playing_progress_bar
  - platform: sendspin
    id: sendspin_track_duration
    type: track_duration
  - platform: template
    id: timer_seconds_remaining
    name: "Timer Seconds Remaining"
    unit_of_measurement: "s"
    icon: "mdi:timer"
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    id: axp2101_batt_v
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    update_interval: 120s
    lambda: |-
      uint8_t data[2] = {0, 0};
      if (!id(axp2101_dev).read_bytes(0x34, data, 2)) {
        ESP_LOGW("axp2101", "Failed to read VBAT");
        return NAN;
      }
      uint16_t mv = ((data[0] & 0x3F) << 8) | data[1];
      return mv / 1000.0f;

    on_value:
      then:
        - sensor.template.publish:
            id: battery_percentage
            state: !lambda 'return x;'

  - platform: template
    id: battery_percentage
    name: "Battery Percentage"
    update_interval: never
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:battery-medium
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 2.80 -> 0.0
            - 3.10 -> 10.0
            - 3.30 -> 20.0
            - 3.45 -> 30.0
            - 3.60 -> 40.0
            - 3.70 -> 50.0
            - 3.75 -> 60.0
            - 3.80 -> 70.0
            - 3.90 -> 80.0
            - 4.00 -> 90.0
            - 4.20 -> 100.0
      - lambda: |-
          if (x > 100) return 100;
          if (x < 0) return 0;
          return x;
    on_value:
      - if:
          condition:
            switch.is_on: battery_display_switch
          then:
            - script.execute: refresh_battery_display

time:
  - platform: homeassistant
    id: homeassistant_time

interval:
  - interval: 1s
    then:
      - script.execute: refresh_now_playing_progress_bar
      - script.execute: analog_clock_redraw

