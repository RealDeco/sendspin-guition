script:
  - id: led_ring_apply_state
    mode: restart
    then:
      - lambda: |-
          return;

  - id: finish_va_reply
    mode: restart
    then:
      - delay: 1500ms
      - if:
          condition:
            lambda: return id(manual_va_active);
          then:
            - lambda: id(manual_va_active) = false;
            - script.execute:
                id: set_va_phase
                phase: ${va_phase_idle}
            - if:
                condition:
                  lambda: return id(manual_va_resume_media);
                then:
                  - lambda: id(manual_va_resume_media) = false;
                  - media_player.toggle: sendspin_group_media_player
          else:
            - script.execute:
                id: set_va_phase
                phase: ${va_phase_idle}
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - script.execute: start_wake_word

  - id: set_va_phase
    mode: restart
    parameters:
      phase: int
    then:
      - lambda: |-
          id(va_phase) = phase;
          const char *name = "idle";
          switch (phase) {
            case ${va_phase_waiting_for_command}: name = "waiting_for_command"; break;
            case ${va_phase_listening}: name = "listening"; break;
            case ${va_phase_thinking}: name = "thinking"; break;
            case ${va_phase_replying}: name = "replying"; break;
            case ${va_phase_error}: name = "error"; break;
            case ${va_phase_timer_ringing}: name = "timer_ringing"; break;
          }
          ESP_LOGW("va", "phase: %s", name);
      - if:
          condition:
            lambda: return phase == ${va_phase_idle};
          then:
            - script.execute:
                id: set_ui_phase
                phase: !lambda return id(ui_phase);
      - if:
          condition:
            lambda: return phase == ${va_phase_waiting_for_command};
          then:
            - lambda: |-
                lv_img_set_src(id(va_phase_image_widget), id(active_image_set) == 2 ? id(va_waiting_image2) : id(va_waiting_image1));
                lv_obj_add_flag(id(va_status_block), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(va_phase_image_widget), LV_OBJ_FLAG_HIDDEN);
            - if:
                condition:
                  lambda: return id(manual_va_slide_up);
                then:
                  - lvgl.page.show:
                      id: va_page
                      animation: MOVE_TOP
                      time: 160ms
                  - lambda: id(manual_va_slide_up) = false;
                else:
                  - lvgl.page.show: va_page
      - if:
          condition:
            lambda: return phase == ${va_phase_listening};
          then:
            - lambda: |-
                lv_img_set_src(id(va_phase_image_widget), id(active_image_set) == 2 ? id(va_listening_image2) : id(va_listening_image1));
                lv_obj_add_flag(id(va_status_block), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(va_phase_image_widget), LV_OBJ_FLAG_HIDDEN);
            - lvgl.page.show: va_page
      - if:
          condition:
            lambda: return phase == ${va_phase_thinking};
          then:
            - lambda: |-
                lv_img_set_src(id(va_phase_image_widget), id(active_image_set) == 2 ? id(va_thinking_image2) : id(va_thinking_image1));
                lv_obj_add_flag(id(va_status_block), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(va_phase_image_widget), LV_OBJ_FLAG_HIDDEN);
            - lvgl.page.show: va_page
      - if:
          condition:
            lambda: return phase == ${va_phase_replying};
          then:
            - lambda: |-
                lv_img_set_src(id(va_phase_image_widget), id(active_image_set) == 2 ? id(va_replying_image2) : id(va_replying_image1));
                lv_obj_add_flag(id(va_status_block), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(va_phase_image_widget), LV_OBJ_FLAG_HIDDEN);
            - lvgl.page.show: va_page
      - if:
          condition:
            lambda: return phase == ${va_phase_error};
          then:
            - lambda: |-
                lv_label_set_text(id(va_status_icon), "\U000F0026");
                lv_label_set_text(id(va_status_icon_glow), "\U000F0026");
                lv_obj_set_style_text_color(id(va_status_icon), lv_color_hex(0xFF6666), 0);
                lv_obj_set_style_text_color(id(va_status_icon_glow), lv_color_hex(0x803333), 0);
                lv_label_set_text(id(va_status_title), "ERROR");
                lv_obj_set_style_text_color(id(va_status_title), lv_color_hex(0xFF6666), 0);
                lv_obj_clear_flag(id(va_status_subtitle), LV_OBJ_FLAG_HIDDEN);
                lv_label_set_text(id(va_status_subtitle), "Something went wrong");
                lv_obj_add_flag(id(va_phase_image_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(va_status_block), LV_OBJ_FLAG_HIDDEN);
            - lvgl.page.show: va_page
      - if:
          condition:
            lambda: return phase == ${va_phase_timer_ringing};
          then:
            - lambda: |-
                lv_label_set_text(id(va_status_icon), "\U000F0020");
                lv_label_set_text(id(va_status_icon_glow), "\U000F0020");
                lv_obj_set_style_text_color(id(va_status_icon), lv_color_hex(0xFFA030), 0);
                lv_obj_set_style_text_color(id(va_status_icon_glow), lv_color_hex(0x805020), 0);
                lv_label_set_text(id(va_status_title), "TIMER FINISHED");
                lv_obj_set_style_text_color(id(va_status_title), lv_color_hex(0xFFA030), 0);
                lv_obj_add_flag(id(va_status_subtitle), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(va_phase_image_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(va_status_block), LV_OBJ_FLAG_HIDDEN);
            - lvgl.page.show: va_page
      - if:
          condition:
            lambda: return phase != ${va_phase_idle};
          then:
            - script.stop: player_controls_timeout
            - script.execute: standby_screen_activity
      - component.update: va_phase_text
      - script.execute: led_ring_apply_state

  - id: start_manual_va
    mode: restart
    then:
      - script.stop: player_controls_timeout
      - lambda: |-
          id(manual_va_active) = true;
          id(manual_va_resume_media) = id(external_media_player).state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;
      - if:
          condition:
            media_player.is_playing: external_media_player
          then:
            - media_player.pause: external_media_player
            - wait_until:
                condition:
                  not:
                    media_player.is_playing: external_media_player
                timeout: 1s
      - script.execute: stop_wake_word
      - delay: 100ms
      - lambda: |-
          id(active_image_set) = 1;
          id(manual_va_slide_up) = true;
      - script.execute:
          id: set_va_phase
          phase: ${va_phase_waiting_for_command}
      - voice_assistant.start:

  - id: stop_active_va
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing
          else:
            - if:
                condition:
                  media_player.is_announcing:
                    id: external_media_player
                then:
                  - media_player.stop:
                      announcement: true
                      id: external_media_player
            - if:
                condition:
                  voice_assistant.is_running:
                then:
                  - voice_assistant.stop:
            - script.execute:
                id: set_va_phase
                phase: ${va_phase_idle}
            - if:
                condition:
                  lambda: return id(manual_va_active);
                then:
                  - lambda: id(manual_va_active) = false;
                  - if:
                      condition:
                        lambda: return id(manual_va_resume_media);
                      then:
                        - lambda: id(manual_va_resume_media) = false;
                        - media_player.toggle: sendspin_group_media_player
            - delay: 300ms
            - script.execute: start_wake_word

  - id: start_wake_word
    mode: restart
    then:
      - if:
          condition:
            and:
              - switch.is_off: mute
              - not:
                  voice_assistant.is_running:
              - not:
                  micro_wake_word.is_running:
              - not:
                  media_player.is_playing: external_media_player
              - not:
                  media_player.is_playing: sendspin_group_media_player
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - lambda: |-
                ESP_LOGW("va", "starting on-device wake word");
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - switch.is_off: mute
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_playing: external_media_player
              - not:
                  media_player.is_playing: sendspin_group_media_player
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - lambda: |-
                ESP_LOGW("va", "starting HA wake word continuous mode");
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:

  - id: refresh_now_playing_progress_bar
    mode: restart
    then:
      - lvgl.bar.update:
          id: now_playing_progress_bar
          animated: false
          value: !lambda |-
            if (!id(sendspin_track_duration).has_state() || id(sendspin_track_duration).state <= 0) return 0;
            float progress = id(sendspin_track_progress).has_state() ? id(sendspin_track_progress).state : 0.0f;
            if (id(external_media_player).state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING) {
              progress += (float) (millis() - id(track_progress_anchor_ms));
            }
            float pct = progress / id(sendspin_track_duration).state * 100.0f;
            return (int) std::max(0.0f, std::min(100.0f, pct));

  - id: apply_accent_color_debounced
    mode: restart
    then:
      - delay: 40ms
      - script.execute: apply_accent_color

  - id: apply_accent_color
    mode: restart
    then:
      - lambda: |-
          const int r = std::max(0, std::min(255, id(accent_red)));
          const int g = std::max(0, std::min(255, id(accent_green)));
          const int b = std::max(0, std::min(255, id(accent_blue)));
          const uint32_t accent_u32 = ((uint32_t) r << 16) | ((uint32_t) g << 8) | (uint32_t) b;
          const uint32_t dark_u32 = ((uint32_t) (r / 10) << 16) | ((uint32_t) (g / 10) << 8) | (uint32_t) (b / 10);
          const lv_color_t accent = lv_color_hex(accent_u32);
          const lv_color_t accent_dark = lv_color_hex(dark_u32);

          const int r2 = std::max(0, std::min(255, id(accent2_red)));
          const int g2 = std::max(0, std::min(255, id(accent2_green)));
          const int b2 = std::max(0, std::min(255, id(accent2_blue)));
          const uint32_t accent2_u32 = ((uint32_t) r2 << 16) | ((uint32_t) g2 << 8) | (uint32_t) b2;
          const lv_color_t accent2 = lv_color_hex(accent2_u32);

          const int r3 = std::max(0, std::min(255, id(accent3_red)));
          const int g3 = std::max(0, std::min(255, id(accent3_green)));
          const int b3 = std::max(0, std::min(255, id(accent3_blue)));
          const uint32_t accent3_u32 = ((uint32_t) r3 << 16) | ((uint32_t) g3 << 8) | (uint32_t) b3;
          const lv_color_t accent3 = lv_color_hex(accent3_u32);

          const int r4 = std::max(0, std::min(255, id(accent4_red)));
          const int g4 = std::max(0, std::min(255, id(accent4_green)));
          const int b4 = std::max(0, std::min(255, id(accent4_blue)));
          const uint32_t accent4_u32 = ((uint32_t) r4 << 16) | ((uint32_t) g4 << 8) | (uint32_t) b4;
          const lv_color_t accent4 = lv_color_hex(accent4_u32);

          lv_obj_set_style_text_color(id(clock_label), accent, 0);
          lv_obj_set_style_text_color(id(clock_ampm_label), accent, 0);
          lv_obj_set_style_text_color(id(idle_timer_countdown), accent, 0);
          lv_obj_set_style_text_color(id(weather_big_temp), accent, 0);
          lv_obj_set_style_text_color(id(weather_big_temp_unit), accent, 0);
          lv_obj_set_style_text_color(id(analog_weather_temp), accent, 0);
          lv_obj_set_style_bg_color(id(controls_toggle_button), accent, 0);
          lv_obj_set_style_border_color(id(controls_toggle_button), accent, LV_STATE_PRESSED);
          lv_obj_set_style_bg_color(id(now_playing_progress_bar), accent, LV_PART_INDICATOR);
          lv_obj_set_style_text_color(id(date_label), accent2, 0);
          lv_obj_set_style_text_color(id(weather_icon), accent2, 0);
          lv_obj_set_style_text_color(id(analog_weather_icon), accent2, 0);
          lv_obj_set_style_text_color(id(weather_label), accent3, 0);
          lv_obj_set_style_text_color(id(controls_title_label), accent2, 0);
          lv_obj_set_style_text_color(id(controls_artist_label), accent3, 0);
          lv_obj_set_style_text_color(id(controls_album_label), accent3, 0);
          lv_obj_set_style_text_color(id(controls_mute_icon), accent4, 0);
          lv_obj_set_style_text_color(id(controls_volume_down_icon), accent4, 0);
          lv_obj_set_style_text_color(id(controls_volume_up_icon), accent4, 0);
          lv_obj_set_style_text_color(id(controls_group_label), accent4, 0);

          lv_obj_t *playlist_buttons[] = {
            id(playlist_1_button), id(playlist_2_button), id(playlist_3_button),
            id(playlist_4_button), id(playlist_5_button), id(playlist_6_button)
          };
          for (auto *button : playlist_buttons) {
            lv_obj_set_style_bg_color(button, accent_dark, 0);
            lv_obj_set_style_border_color(button, accent, 0);
            lv_obj_set_style_shadow_color(button, accent, 0);
            lv_obj_set_style_bg_color(button, accent, LV_STATE_PRESSED);
          }

          lv_obj_t *playlist_labels[] = {
            id(playlist_1_label), id(playlist_2_label), id(playlist_3_label),
            id(playlist_4_label), id(playlist_5_label), id(playlist_6_label)
          };
          for (auto *label : playlist_labels) {
            lv_obj_set_style_text_color(label, accent2, 0);
          }
      - script.execute: refresh_shuffle_repeat_buttons
      - script.execute: analog_clock_redraw

  - id: analog_clock_ensure_created
    then:
      - lambda: |-
          if (id(analog_clock_canvas_widget) != nullptr) return;
          const int32_t SIZE = std::min(${screenwidth}, ${screenheight});
          lv_obj_t *canvas = lv_canvas_create(id(idle_page)->obj);
          lv_draw_buf_t *buf = lv_draw_buf_create(SIZE, SIZE, LV_COLOR_FORMAT_ARGB8888, LV_STRIDE_AUTO);
          lv_canvas_set_draw_buf(canvas, buf);
          lv_obj_set_style_bg_opa(canvas, LV_OPA_TRANSP, 0);
          lv_obj_center(canvas);
          lv_obj_clear_flag(canvas, LV_OBJ_FLAG_CLICKABLE);
          lv_obj_clear_flag(canvas, LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_add_flag(canvas, LV_OBJ_FLAG_HIDDEN);
          id(analog_clock_canvas_widget) = canvas;

  - id: apply_clock_style
    mode: restart
    parameters:
      analog: bool
    then:
      - lambda: |-
          id(clock_style_is_analog) = analog;
      - if:
          condition:
            lambda: 'return analog;'
          then:
            - script.execute: analog_clock_ensure_created
            - lambda: |-
                lv_obj_add_flag(id(clock_label), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(clock_ampm_label), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(date_label), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(weather_header), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(weather_label), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(analog_clock_canvas_widget), LV_OBJ_FLAG_HIDDEN);
            - script.execute: analog_clock_redraw
            - component.update: weather_line
          else:
            - lambda: |-
                lv_obj_clear_flag(id(clock_label), LV_OBJ_FLAG_HIDDEN);
                if (id(clock_show_date).state) {
                  lv_obj_clear_flag(id(date_label), LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(id(date_label), LV_OBJ_FLAG_HIDDEN);
                }
                if (id(analog_clock_canvas_widget) != nullptr) {
                  lv_obj_add_flag(id(analog_clock_canvas_widget), LV_OBJ_FLAG_HIDDEN);
                }
                lv_obj_add_flag(id(analog_weather_icon), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(analog_weather_temp), LV_OBJ_FLAG_HIDDEN);
            - component.update: weather_line

  - id: analog_clock_redraw
    mode: restart
    then:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_is_analog);'
              - lambda: 'return id(analog_clock_canvas_widget) != nullptr;'
          then:
            - lambda: |-
                lv_obj_t *canvas = id(analog_clock_canvas_widget);
                const int32_t SIZE = std::min(${screenwidth}, ${screenheight});
                const int32_t CX = SIZE / 2;
                const int32_t CY = SIZE / 2;
                const int32_t R = SIZE / 2 - 10;

                lv_canvas_fill_bg(canvas, lv_color_hex(0x000000), LV_OPA_TRANSP);

                lv_layer_t layer;
                lv_canvas_init_layer(canvas, &layer);

                const uint32_t accent = ((uint32_t) id(accent_red) << 16) | ((uint32_t) id(accent_green) << 8) | (uint32_t) id(accent_blue);
                const uint32_t accent2 = ((uint32_t) id(accent2_red) << 16) | ((uint32_t) id(accent2_green) << 8) | (uint32_t) id(accent2_blue);
                const uint32_t accent3 = ((uint32_t) id(accent3_red) << 16) | ((uint32_t) id(accent3_green) << 8) | (uint32_t) id(accent3_blue);
                lv_color_t fg = lv_color_hex(accent);
                lv_color_t fg2 = lv_color_hex(accent2);
                lv_color_t fg3 = lv_color_hex(accent3);
                const bool show_seconds = id(clock_show_seconds).state;

                lv_draw_line_dsc_t line_dsc;
                lv_draw_line_dsc_init(&line_dsc);
                line_dsc.round_start = true;
                line_dsc.round_end = true;

                if (id(clock_show_gfx).state) {
                  for (int i = 0; i < 60; i++) {
                    float a = (i / 60.0f) * 6.2831853f - 1.5707963f;
                    bool major = (i % 5 == 0);
                    int32_t r_out = R;
                    int32_t r_in = major ? R - 16 : R - 8;
                    line_dsc.p1.x = CX + (int32_t) (cosf(a) * r_out);
                    line_dsc.p1.y = CY + (int32_t) (sinf(a) * r_out);
                    line_dsc.p2.x = CX + (int32_t) (cosf(a) * r_in);
                    line_dsc.p2.y = CY + (int32_t) (sinf(a) * r_in);
                    line_dsc.color = major ? fg : fg2;
                    line_dsc.width = major ? 3 : 1;
                    lv_draw_line(&layer, &line_dsc);
                  }
                }

                if (id(clock_show_date).state) {
                  std::string date_str = id(clock_date).state;
                  lv_draw_label_dsc_t label_dsc;
                  lv_draw_label_dsc_init(&label_dsc);
                  label_dsc.color = fg2;
                  label_dsc.font = id(font_date)->get_lv_font();
                  label_dsc.align = LV_TEXT_ALIGN_CENTER;
                  label_dsc.text = date_str.c_str();
                  label_dsc.text_local = true;
                  const int32_t date_y = CY + (int32_t) (R * 0.55f);
                  lv_area_t label_area = {CX - R, date_y, CX + R, date_y + 40};
                  lv_draw_label(&layer, &label_dsc, &label_area);
                }

                auto t = id(homeassistant_time).now();
                int hh = t.is_valid() ? (t.hour % 12) : 0;
                int mm = t.is_valid() ? t.minute : 0;
                int ss = t.is_valid() ? t.second : 0;

                float s_pos = ss / 60.0f;
                float m_pos = (mm + s_pos) / 60.0f;
                float h_pos = (hh + m_pos) / 12.0f;

                auto draw_hand = [&](float pos, int32_t len, int32_t width, lv_color_t color) {
                  float a = pos * 6.2831853f - 1.5707963f;
                  line_dsc.p1.x = CX;
                  line_dsc.p1.y = CY;
                  line_dsc.p2.x = CX + (int32_t) (cosf(a) * len);
                  line_dsc.p2.y = CY + (int32_t) (sinf(a) * len);
                  line_dsc.color = color;
                  line_dsc.width = width;
                  lv_draw_line(&layer, &line_dsc);
                };

                draw_hand(h_pos, (int32_t) (R * 0.5f), 6, fg3);
                draw_hand(m_pos, (int32_t) (R * 0.72f), 4, fg3);
                if (show_seconds) {
                  draw_hand(s_pos, (int32_t) (R * 0.85f), 1, fg);
                }

                lv_draw_rect_dsc_t dot_dsc;
                lv_draw_rect_dsc_init(&dot_dsc);
                dot_dsc.bg_color = fg;
                dot_dsc.bg_opa = LV_OPA_COVER;
                dot_dsc.radius = LV_RADIUS_CIRCLE;
                lv_area_t dot_area = {CX - 6, CY - 6, CX + 6, CY + 6};
                lv_draw_rect(&layer, &dot_dsc, &dot_area);

                lv_canvas_finish_layer(canvas, &layer);
                lv_obj_invalidate(canvas);

  - id: set_ui_phase
    mode: restart
    parameters:
      phase: int
    then:
      - script.stop: player_controls_timeout
      - lambda: |-
          id(ui_phase) = phase;
      - script.execute: standby_screen_activity
      - if:
          condition:
            lambda: 'return id(boot_sound_played) && phase == ${ui_phase_standby};'
          then:
            - lvgl.page.show: idle_page
            - component.update: weather_line
      - if:
          condition:
            lambda: 'return id(boot_sound_played) && phase == ${ui_phase_player_controls};'
          then:
            - lvgl.page.show: player_controls_page
            - lambda: |-
                lv_label_set_text(id(controls_mute_icon), id(external_media_player).is_muted() ? "\xF3\xB0\x9D\x9F" : "\xF3\xB0\x95\xBE");
            - script.execute: player_controls_timeout
      - if:
          condition:
            lambda: 'return id(boot_sound_played) && phase == ${ui_phase_now_playing};'
          then:
            - lvgl.page.show: sendspin_page
      - if:
          condition:
            lambda: 'return id(boot_sound_played) && phase == ${ui_phase_playlist_menu};'
          then:
            - lvgl.page.show: playlist_menu_page
            - script.execute: player_controls_timeout
      - script.execute: refresh_artist_art_dot

  - id: player_controls_timeout
    mode: restart
    then:
      - delay: !lambda |-
          return (uint32_t) (id(player_controls_timeout_seconds).state * 1000.0f);
      - if:
          condition:
            lambda: 'return id(va_phase) == ${va_phase_idle};'
          then:
            - if:
                condition:
                  media_player.is_idle: external_media_player
                then:
                  - script.execute:
                      id: set_ui_phase
                      phase: ${ui_phase_standby}
                else:
                  - script.execute:
                      id: set_ui_phase
                      phase: ${ui_phase_now_playing}

  - id: open_playlist_menu
    then:
      - script.stop: player_controls_timeout
      - lambda: |-
          id(ui_phase) = ${ui_phase_playlist_menu};
      - lvgl.page.show:
          id: playlist_menu_page
          animation: MOVE_BOTTOM
          time: 160ms
      - script.execute: player_controls_timeout

  - id: close_playlist_menu
    then:
      - script.stop: player_controls_timeout
      - lambda: |-
          id(ui_phase) = ${ui_phase_player_controls};
      - lvgl.page.show:
          id: player_controls_page
          animation: MOVE_TOP
          time: 160ms
      - script.execute: player_controls_timeout

  - id: close_playlist_menu_to_now_playing
    then:
      - script.stop: player_controls_timeout
      - lambda: |-
          id(ui_phase) = ${ui_phase_now_playing};
      - lvgl.page.show: sendspin_page

  - id: refresh_playlist_labels
    mode: restart
    then:
      - lvgl.label.update:
          id: playlist_1_label
          text: !lambda return id(playlist_1_name).state;
      - lvgl.label.update:
          id: playlist_2_label
          text: !lambda return id(playlist_2_name).state;
      - lvgl.label.update:
          id: playlist_3_label
          text: !lambda return id(playlist_3_name).state;
      - lvgl.label.update:
          id: playlist_4_label
          text: !lambda return id(playlist_4_name).state;
      - lvgl.label.update:
          id: playlist_5_label
          text: !lambda return id(playlist_5_name).state;
      - lvgl.label.update:
          id: playlist_6_label
          text: !lambda return id(playlist_6_name).state;

  - id: play_playlist
    parameters:
      uri: string
    then:
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected) && !id(playlist_media_player_entity).state.empty() && !uri.empty();'
          then:
            - homeassistant.action:
                action: media_player.play_media
                data:
                  media_content_type: music
                data_template:
                  entity_id: "{{ media_player_entity }}"
                  media_content_id: "{{ media_url }}"
                variables:
                  media_player_entity: |-
                    return id(playlist_media_player_entity).state;
                  media_url: |-
                    return uri;

  - id: load_standby_background
    mode: restart
    then:
      - online_image.set_url:
          id: standby_background_image
          url: !lambda |-
            return "https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/Other/${screenwidth}x${screenheight}/" + id(standby_background_choice).current_option().str() + ".png";

  - id: standby_screen_activity
    mode: restart
    then:
      - script.stop: standby_screen_timeout
      - if:
          condition:
            lambda: 'return id(screen_timeout_dimmed);'
          then:
            - light.turn_on:
                id: Sled
                brightness: !lambda 'return id(preferred_screen_brightness);'
            - lambda: |-
                id(screen_timeout_dimmed) = false;
      - if:
          condition:
            and:
              - switch.is_on: standby_screen_timeout_enabled
              - lambda: 'return id(ui_phase) == ${ui_phase_standby};'
              - lambda: 'return id(va_phase) == ${va_phase_idle};'
              - lambda: 'return !id(timer_is_active);'
          then:
            - script.execute: standby_screen_timeout

  - id: standby_screen_timeout
    mode: restart
    then:
      - delay: !lambda |-
          return (uint32_t) (id(standby_screen_timeout_seconds).state * 1000.0f / 3.0f);
      - if:
          condition:
            and:
              - switch.is_on: standby_screen_timeout_enabled
              - lambda: 'return id(ui_phase) == ${ui_phase_standby};'
              - lambda: 'return id(va_phase) == ${va_phase_idle};'
              - lambda: 'return !id(timer_is_active);'
          then:
            - lambda: |-
                id(preferred_screen_brightness) = id(Sled).remote_values.get_brightness();
                id(screen_timeout_dimmed) = true;
            - light.turn_on:
                id: Sled
                brightness: !lambda 'return id(preferred_screen_brightness) * 0.60f;'
          else:
            - script.stop: standby_screen_timeout
      - delay: !lambda |-
          return (uint32_t) (id(standby_screen_timeout_seconds).state * 1000.0f / 3.0f);
      - if:
          condition:
            and:
              - switch.is_on: standby_screen_timeout_enabled
              - lambda: 'return id(ui_phase) == ${ui_phase_standby};'
              - lambda: 'return id(va_phase) == ${va_phase_idle};'
              - lambda: 'return !id(timer_is_active);'
          then:
            - light.turn_on:
                id: Sled
                brightness: !lambda 'return id(preferred_screen_brightness) * 0.25f;'
          else:
            - script.stop: standby_screen_timeout
      - delay: !lambda |-
          return (uint32_t) (id(standby_screen_timeout_seconds).state * 1000.0f / 3.0f);
      - if:
          condition:
            and:
              - switch.is_on: standby_screen_timeout_enabled
              - lambda: 'return id(ui_phase) == ${ui_phase_standby};'
              - lambda: 'return id(va_phase) == ${va_phase_idle};'
              - lambda: 'return !id(timer_is_active);'
          then:
            - light.turn_off: Sled

  - id: now_playing_swipe_left
    then:
      - script.execute:
          id: album_art_slide
          direction: -1
      - media_player.next: sendspin_group_media_player

  - id: now_playing_swipe_right
    then:
      - script.execute:
          id: album_art_slide
          direction: 1
      - script.execute: media_player_previous_with_restart_check

  - id: player_controls_keep_open
    then:
      - script.execute:
          id: set_ui_phase
          phase: ${ui_phase_player_controls}

  - id: player_controls_toggle
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.toggle: sendspin_group_media_player
            - script.execute:
                id: set_ui_phase
                phase: ${ui_phase_now_playing}

  - id: player_controls_swipe_previous
    then:
      - script.execute:
          id: player_controls_slide_to_now_playing
          direction: 1
      - script.execute: media_player_previous_with_restart_check

  - id: player_controls_swipe_next
    then:
      - script.execute:
          id: player_controls_slide_to_now_playing
          direction: -1
      - media_player.next: sendspin_group_media_player

  - id: player_controls_shuffle_toggle
    mode: restart
    then:
      - lambda: 'id(shuffle_state) = !id(shuffle_state);'
      - script.execute: refresh_shuffle_repeat_buttons
      - script.execute: player_controls_keep_open
      - if:
          condition:
            lambda: 'return !id(playlist_media_player_entity).state.empty();'
          then:
            - if:
                condition:
                  lambda: 'return id(shuffle_state);'
                then:
                  - homeassistant.action:
                      action: media_player.shuffle_set
                      data:
                        shuffle: "true"
                      data_template:
                        entity_id: "{{ media_player_entity }}"
                      variables:
                        media_player_entity: |-
                          return id(playlist_media_player_entity).state;
                else:
                  - homeassistant.action:
                      action: media_player.shuffle_set
                      data:
                        shuffle: "false"
                      data_template:
                        entity_id: "{{ media_player_entity }}"
                      variables:
                        media_player_entity: |-
                          return id(playlist_media_player_entity).state;

  - id: player_controls_repeat_cycle
    mode: restart
    then:
      - lambda: 'id(repeat_mode) = (id(repeat_mode) + 1) % 3;'
      - script.execute: refresh_shuffle_repeat_buttons
      - script.execute: player_controls_keep_open
      - if:
          condition:
            lambda: 'return !id(playlist_media_player_entity).state.empty();'
          then:
            - if:
                condition:
                  lambda: 'return id(repeat_mode) == 0;'
                then:
                  - homeassistant.action:
                      action: media_player.repeat_set
                      data:
                        repeat: "off"
                      data_template:
                        entity_id: "{{ media_player_entity }}"
                      variables:
                        media_player_entity: |-
                          return id(playlist_media_player_entity).state;
            - if:
                condition:
                  lambda: 'return id(repeat_mode) == 1;'
                then:
                  - homeassistant.action:
                      action: media_player.repeat_set
                      data:
                        repeat: "all"
                      data_template:
                        entity_id: "{{ media_player_entity }}"
                      variables:
                        media_player_entity: |-
                          return id(playlist_media_player_entity).state;
            - if:
                condition:
                  lambda: 'return id(repeat_mode) == 2;'
                then:
                  - homeassistant.action:
                      action: media_player.repeat_set
                      data:
                        repeat: "one"
                      data_template:
                        entity_id: "{{ media_player_entity }}"
                      variables:
                        media_player_entity: |-
                          return id(playlist_media_player_entity).state;

  - id: refresh_shuffle_repeat_buttons
    mode: restart
    then:
      - lambda: |-
          const uint32_t accent_u32 = ((uint32_t) id(accent_red) << 16) | ((uint32_t) id(accent_green) << 8) | (uint32_t) id(accent_blue);
          const lv_color_t accent = lv_color_hex(accent_u32);
          const uint32_t accent4_u32 = ((uint32_t) id(accent4_red) << 16) | ((uint32_t) id(accent4_green) << 8) | (uint32_t) id(accent4_blue);
          const lv_color_t inactive_color = lv_color_hex(accent4_u32);

          if (id(shuffle_state)) {
            lv_label_set_text(id(controls_shuffle_label), "\U000F049D");
            lv_obj_set_style_text_color(id(controls_shuffle_label), accent, 0);
          } else {
            lv_label_set_text(id(controls_shuffle_label), "\U000F049E");
            lv_obj_set_style_text_color(id(controls_shuffle_label), inactive_color, 0);
          }

          switch (id(repeat_mode)) {
            case 1:
              lv_label_set_text(id(controls_repeat_label), "\U000F0456");
              lv_obj_set_style_text_color(id(controls_repeat_label), accent, 0);
              break;
            case 2:
              lv_label_set_text(id(controls_repeat_label), "\U000F0458");
              lv_obj_set_style_text_color(id(controls_repeat_label), accent, 0);
              break;
            default:
              lv_label_set_text(id(controls_repeat_label), "\U000F0457");
              lv_obj_set_style_text_color(id(controls_repeat_label), inactive_color, 0);
              break;
          }

  - id: player_controls_volume_down
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.volume_down: external_media_player
            - script.execute: show_volume_ring
            - script.execute: player_controls_keep_open

  - id: player_controls_volume_up
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.volume_up: external_media_player
            - script.execute: show_volume_ring
            - script.execute: player_controls_keep_open

  - id: player_controls_mute
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - lambda: |-
                bool new_muted = !id(external_media_player).is_muted();
                auto call = id(external_media_player).make_call();
                call.set_command(new_muted ? media_player::MEDIA_PLAYER_COMMAND_MUTE : media_player::MEDIA_PLAYER_COMMAND_UNMUTE);
                call.perform();
                lv_label_set_text(id(controls_mute_icon), new_muted ? "\xF3\xB0\x9D\x9F" : "\xF3\xB0\x95\xBE");
            - script.execute: player_controls_keep_open

  - id: player_controls_slide_to_now_playing
    mode: restart
    parameters:
      direction: int
    then:
      - script.stop: player_controls_timeout
      - lambda: |-
          id(ui_phase) = ${ui_phase_now_playing};
      - lvgl.page.show: sendspin_page
      - script.execute:
          id: album_art_slide
          direction: !lambda return direction;

  - id: album_art_slide
    mode: restart
    parameters:
      direction: int
    then:
      - lvgl.animation.stop: album_art_crossfade
      - lambda: |-
          id(album_art_slide_active) = true;
          id(sendspin_album_art_valid) = false;
          id(last_album_art_valid) = false;
          lv_obj_t *outgoing = id(slide_outgoing_art);
          lv_obj_t *incoming = id(slide_incoming_art);
          lv_anim_del(outgoing, nullptr);
          lv_anim_del(incoming, nullptr);
          lv_img_set_src(outgoing, lv_img_get_src(id(incoming_art)));
          lv_img_set_zoom(outgoing, LV_ZOOM_NONE);
          lv_img_set_src(incoming, id(fallback_playing_image));
          lv_img_set_zoom(incoming, LV_ZOOM_NONE);
          lv_obj_set_x(outgoing, 0);
          lv_obj_set_x(incoming, -direction * ${screenwidth});
          lv_obj_clear_flag(outgoing, LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(incoming, LV_OBJ_FLAG_HIDDEN);

          lv_anim_t current_slide;
          lv_anim_init(&current_slide);
          lv_anim_set_var(&current_slide, outgoing);
          lv_anim_set_values(&current_slide, 0, direction * ${screenwidth});
          lv_anim_set_time(&current_slide, 300);
          lv_anim_set_exec_cb(&current_slide, [](void *obj, int32_t x) {
            lv_obj_set_x((lv_obj_t *) obj, x);
          });
          lv_anim_start(&current_slide);

          lv_anim_t incoming_slide;
          lv_anim_init(&incoming_slide);
          lv_anim_set_var(&incoming_slide, incoming);
          lv_anim_set_values(&incoming_slide, -direction * ${screenwidth}, 0);
          lv_anim_set_time(&incoming_slide, 300);
          lv_anim_set_exec_cb(&incoming_slide, [](void *obj, int32_t x) {
            lv_obj_set_x((lv_obj_t *) obj, x);
          });
          lv_anim_start(&incoming_slide);
      - delay: 300ms
      - lambda: |-
          lv_obj_add_flag(id(slide_outgoing_art), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(slide_incoming_art), LV_OBJ_FLAG_HIDDEN);
          lv_img_set_src(id(incoming_art), id(fallback_playing_image));
          lv_img_set_zoom(id(incoming_art), LV_ZOOM_NONE);
          id(album_art_slide_active) = false;
          id(album_art_awaiting_swipe_art) = true;

  - id: refresh_battery_display
    then:
      - lambda: |-
          if (!id(boot_sound_played)) return;
          if (id(battery_bar_widget) == nullptr) {
            lv_obj_t *cont = lv_obj_create(lv_layer_top());
            lv_obj_remove_style_all(cont);
            lv_obj_set_size(cont, 63, 25);
            lv_obj_set_pos(cont, 202, 12);
            lv_obj_clear_flag(cont, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(cont, LV_OBJ_FLAG_SCROLLABLE);
            id(battery_bar_widget) = cont;

            lv_obj_t *body = lv_obj_create(cont);
            lv_obj_remove_style_all(body);
            lv_obj_set_size(body, 56, 25);
            lv_obj_set_pos(body, 0, 0);
            lv_obj_set_style_border_color(body, lv_color_white(), 0);
            lv_obj_set_style_border_width(body, 2, 0);
            lv_obj_set_style_outline_color(body, lv_color_black(), 0);
            lv_obj_set_style_outline_width(body, 1, 0);
            lv_obj_set_style_outline_pad(body, 0, 0);
            lv_obj_set_style_bg_color(body, lv_color_hex(0x1A1A1A), 0);
            lv_obj_set_style_bg_opa(body, LV_OPA_COVER, 0);
            lv_obj_set_style_radius(body, 4, 0);
            lv_obj_clear_flag(body, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(body, LV_OBJ_FLAG_SCROLLABLE);

            lv_obj_t *fill = lv_obj_create(cont);
            lv_obj_remove_style_all(fill);
            lv_obj_set_size(fill, 0, 17);
            lv_obj_set_pos(fill, 4, 4);
            lv_obj_set_style_bg_opa(fill, LV_OPA_COVER, 0);
            lv_obj_set_style_radius(fill, 2, 0);
            lv_obj_clear_flag(fill, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(fill, LV_OBJ_FLAG_SCROLLABLE);
            id(battery_bar_fill) = fill;

            lv_obj_t *nub = lv_obj_create(cont);
            lv_obj_remove_style_all(nub);
            lv_obj_set_size(nub, 7, 13);
            lv_obj_set_pos(nub, 56, 6);
            lv_obj_set_style_bg_color(nub, lv_color_white(), 0);
            lv_obj_set_style_bg_opa(nub, LV_OPA_COVER, 0);
            lv_obj_set_style_outline_color(nub, lv_color_black(), 0);
            lv_obj_set_style_outline_width(nub, 1, 0);
            lv_obj_set_style_outline_pad(nub, 0, 0);
            lv_obj_set_style_radius(nub, 2, 0);
            lv_obj_clear_flag(nub, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(nub, LV_OBJ_FLAG_SCROLLABLE);
          }

          float pct = id(battery_percentage).state;
          if (isnan(pct)) pct = 0;
          int fill_w = (int)(pct / 100.0f * 48.0f);
          fill_w = std::max(0, std::min(48, fill_w));
          lv_obj_set_width(id(battery_bar_fill), fill_w);

          lv_color_t color;
          if (pct >= 50) color = lv_color_hex(0x4CAF50);
          else if (pct >= 20) color = lv_color_hex(0xFFC107);
          else color = lv_color_hex(0xF44336);
          lv_obj_set_style_bg_color(id(battery_bar_fill), color, 0);

          lv_obj_clear_flag(id(battery_bar_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(battery_bar_widget));

  - id: refresh_artist_art_dot
    then:
      - lambda: |-
          if (id(artist_art_dot_widget) == nullptr) {
            lv_obj_t *dot = lv_obj_create(lv_layer_top());
            lv_obj_remove_style_all(dot);
            lv_obj_set_size(dot, 10, 10);
            lv_obj_set_pos(dot, ${screenwidth} / 2 - 5, 19);
            lv_obj_set_style_bg_color(dot, lv_color_hex(0xFF3B30), 0);
            lv_obj_set_style_bg_opa(dot, LV_OPA_COVER, 0);
            lv_obj_set_style_radius(dot, 5, 0);
            lv_obj_clear_flag(dot, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(dot, LV_OBJ_FLAG_SCROLLABLE);
            lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
            id(artist_art_dot_widget) = dot;
          }
      - if:
          condition:
            and:
              - lvgl.page.is_showing: sendspin_page
              - lambda: 'return id(artist_art_valid) && !id(now_playing_art_mode);'
          then:
            - lambda: |-
                lv_obj_clear_flag(id(artist_art_dot_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_move_foreground(id(artist_art_dot_widget));
          else:
            - lambda: |-
                lv_obj_add_flag(id(artist_art_dot_widget), LV_OBJ_FLAG_HIDDEN);

  - id: now_playing_show_artist_art
    mode: restart
    then:
      - lvgl.animation.stop: album_art_crossfade
      - lambda: |-
          lv_obj_set_style_opa(id(outgoing_art), LV_OPA_TRANSP, 0);
          lv_obj_t *outgoing = id(slide_outgoing_art);
          lv_obj_t *incoming = id(slide_incoming_art);
          lv_anim_del(outgoing, nullptr);
          lv_anim_del(incoming, nullptr);
          lv_img_set_src(outgoing, lv_img_get_src(id(incoming_art)));
          lv_img_set_zoom(outgoing, LV_ZOOM_NONE);
          lv_img_set_src(incoming, id(artist_art)->get_lv_image_dsc());
          lv_img_set_zoom(incoming, LV_ZOOM_NONE);
          lv_obj_set_x(outgoing, 0);
          lv_obj_set_x(incoming, 0);
          lv_obj_set_y(outgoing, 0);
          lv_obj_set_y(incoming, -${screenheight});
          lv_obj_clear_flag(outgoing, LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(incoming, LV_OBJ_FLAG_HIDDEN);

          lv_anim_t current_slide;
          lv_anim_init(&current_slide);
          lv_anim_set_var(&current_slide, outgoing);
          lv_anim_set_values(&current_slide, 0, ${screenheight});
          lv_anim_set_time(&current_slide, 300);
          lv_anim_set_exec_cb(&current_slide, [](void *obj, int32_t y) {
            lv_obj_set_y((lv_obj_t *) obj, y);
          });
          lv_anim_start(&current_slide);

          lv_anim_t incoming_slide;
          lv_anim_init(&incoming_slide);
          lv_anim_set_var(&incoming_slide, incoming);
          lv_anim_set_values(&incoming_slide, -${screenheight}, 0);
          lv_anim_set_time(&incoming_slide, 300);
          lv_anim_set_exec_cb(&incoming_slide, [](void *obj, int32_t y) {
            lv_obj_set_y((lv_obj_t *) obj, y);
          });
          lv_anim_start(&incoming_slide);
          id(now_playing_art_mode) = true;
          id(refresh_artist_art_dot)->execute();
      - delay: 300ms
      - lambda: |-
          lv_obj_add_flag(id(slide_outgoing_art), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(slide_incoming_art), LV_OBJ_FLAG_HIDDEN);
          lv_img_set_src(id(incoming_art), id(artist_art)->get_lv_image_dsc());
          lv_img_set_zoom(id(incoming_art), LV_ZOOM_NONE);

  - id: now_playing_show_album_art
    mode: restart
    then:
      - lvgl.animation.stop: album_art_crossfade
      - lambda: |-
          lv_obj_set_style_opa(id(outgoing_art), LV_OPA_TRANSP, 0);
          lv_obj_t *outgoing = id(slide_outgoing_art);
          lv_obj_t *incoming = id(slide_incoming_art);
          lv_anim_del(outgoing, nullptr);
          lv_anim_del(incoming, nullptr);
          lv_img_set_src(outgoing, lv_img_get_src(id(incoming_art)));
          lv_img_set_zoom(outgoing, LV_ZOOM_NONE);
          lv_img_set_src(incoming, id(sendspin_album_art_valid) ? id(sendspin_album_art)->get_lv_image_dsc() : id(fallback_playing_image)->get_lv_image_dsc());
          lv_img_set_zoom(incoming, LV_ZOOM_NONE);
          lv_obj_set_x(outgoing, 0);
          lv_obj_set_x(incoming, 0);
          lv_obj_set_y(outgoing, 0);
          lv_obj_set_y(incoming, ${screenheight});
          lv_obj_clear_flag(outgoing, LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(incoming, LV_OBJ_FLAG_HIDDEN);

          lv_anim_t current_slide;
          lv_anim_init(&current_slide);
          lv_anim_set_var(&current_slide, outgoing);
          lv_anim_set_values(&current_slide, 0, -${screenheight});
          lv_anim_set_time(&current_slide, 300);
          lv_anim_set_exec_cb(&current_slide, [](void *obj, int32_t y) {
            lv_obj_set_y((lv_obj_t *) obj, y);
          });
          lv_anim_start(&current_slide);

          lv_anim_t incoming_slide;
          lv_anim_init(&incoming_slide);
          lv_anim_set_var(&incoming_slide, incoming);
          lv_anim_set_values(&incoming_slide, ${screenheight}, 0);
          lv_anim_set_time(&incoming_slide, 300);
          lv_anim_set_exec_cb(&incoming_slide, [](void *obj, int32_t y) {
            lv_obj_set_y((lv_obj_t *) obj, y);
          });
          lv_anim_start(&incoming_slide);
          id(now_playing_art_mode) = false;
          id(refresh_artist_art_dot)->execute();
      - delay: 300ms
      - lambda: |-
          lv_obj_add_flag(id(slide_outgoing_art), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(slide_incoming_art), LV_OBJ_FLAG_HIDDEN);
          lv_img_set_src(id(incoming_art), id(sendspin_album_art_valid) ? id(sendspin_album_art)->get_lv_image_dsc() : id(fallback_playing_image)->get_lv_image_dsc());
          lv_img_set_zoom(id(incoming_art), LV_ZOOM_NONE);

  - id: media_player_previous_with_restart_check
    then:
      - lambda: |-
          id(pre_previous_swipe_title) = id(sendspin_title).state;
      - media_player.previous: sendspin_group_media_player
      - script.execute: restore_art_if_same_title

  - id: restore_art_if_same_title
    mode: restart
    then:
      - delay: 1200ms
      - if:
          condition:
            lambda: 'return id(sendspin_title).state == id(pre_previous_swipe_title);'
          then:
            - lambda: |-
                id(sendspin_album_art_valid) = true;
                id(album_art_awaiting_swipe_art) = false;
            - script.execute: album_art_crossfade_apply

  - id: album_art_crossfade_apply
    mode: restart
    then:
      - lambda: |-
          id(now_playing_art_mode) = false;
          id(refresh_artist_art_dot)->execute();
      - if:
          condition:
            lambda: 'return id(last_album_art_valid);'
          then:
            - lvgl.image.update:
                id: outgoing_art
                src: sendspin_album_art_transition
          else:
            - lvgl.image.update:
                id: outgoing_art
                src: fallback_playing_image
      - lvgl.image.update:
          id: incoming_art
          src: sendspin_album_art
      - lvgl.animation.start: album_art_crossfade


  - id: refresh_timer_display
    mode: restart
    then:
      - lambda: |-
          bool found = false;
          int left = 0;
          int total = 0;
          for (auto &timer : id(va).get_timers()) {
            if (!timer.is_active) continue;
            if (!found || timer.seconds_left < left) {
              found = true;
              left = timer.seconds_left;
              total = timer.total_seconds;
            }
          }
          id(timer_is_active) = found;
          id(timer_seconds_left) = found ? left : 0;
          id(timer_total_seconds) = found && total > 0 ? total : 0;
          id(timer_seconds_remaining).publish_state(id(timer_seconds_left));

          static constexpr int TIMER_SEGMENTS = 144;

          if (id(timer_progress_arc) == nullptr) {
            id(timer_progress_arc) = lv_obj_create(lv_layer_top());
            lv_obj_remove_style_all(id(timer_progress_arc));
            lv_obj_set_size(id(timer_progress_arc), ${screenwidth}, ${screenheight});
            lv_obj_center(id(timer_progress_arc));
            lv_obj_clear_flag(id(timer_progress_arc), LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(id(timer_progress_arc), LV_OBJ_FLAG_SCROLLABLE);
            const float cx = ${screenwidth} / 2.0f;
            const float cy = ${screenheight} / 2.0f;
            const float radius = 220.0f;
            for (int i = 0; i < TIMER_SEGMENTS; i++) {
              const float angle = (-90.0f + (360.0f * i / TIMER_SEGMENTS)) * (float) M_PI / 180.0f;
              lv_obj_t *seg = lv_obj_create(id(timer_progress_arc));
              lv_obj_remove_style_all(seg);
              lv_obj_set_size(seg, 6, 6);
              lv_obj_set_style_radius(seg, LV_RADIUS_CIRCLE, 0);
              lv_obj_set_style_bg_opa(seg, LV_OPA_COVER, 0);
              lv_obj_set_pos(seg, (int) lroundf(cx + cosf(angle) * radius - 3.0f),
                             (int) lroundf(cy + sinf(angle) * radius - 3.0f));
              lv_obj_clear_flag(seg, LV_OBJ_FLAG_CLICKABLE);
              lv_obj_clear_flag(seg, LV_OBJ_FLAG_SCROLLABLE);
            }
          }

          if (!found || total <= 0) {
            lv_obj_add_flag(id(timer_progress_arc), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(hourglass_canvas), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(idle_timer_block), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(idle_center_block), LV_OBJ_FLAG_HIDDEN);
            if (id(standby_background_enabled).state) {
              lv_obj_clear_flag(id(standby_background_widget), LV_OBJ_FLAG_HIDDEN);
              lv_obj_move_background(id(standby_background_widget));
            }
            return;
          }

          float remain = (float) left / (float) total;
          if (remain < 0.0f) remain = 0.0f;
          if (remain > 1.0f) remain = 1.0f;

          int active_segments = (int) lroundf((float) left * (float) TIMER_SEGMENTS / (float) total);
          active_segments = std::max(0, std::min(TIMER_SEGMENTS, active_segments));
          for (int i = 0; i < TIMER_SEGMENTS; i++) {
            lv_obj_t *seg = lv_obj_get_child(id(timer_progress_arc), i);
            if (seg == nullptr) continue;
            const bool active = i < active_segments;
            lv_obj_set_style_bg_color(seg, active ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x242424), 0);
            lv_obj_set_style_bg_opa(seg, active ? LV_OPA_COVER : 115, 0);
          }
          lv_obj_clear_flag(id(timer_progress_arc), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(timer_progress_arc));

          lv_obj_t *canvas = id(hourglass_canvas);
          lv_canvas_fill_bg(canvas, lv_color_hex(0x000000), LV_OPA_TRANSP);

          lv_layer_t layer;
          lv_canvas_init_layer(canvas, &layer);

          auto fill_rect = [&](int x, int y, int w, int h, lv_color_t color, int radius) {
            lv_draw_rect_dsc_t dsc;
            lv_draw_rect_dsc_init(&dsc);
            dsc.bg_color = color;
            dsc.bg_opa = LV_OPA_COVER;
            dsc.border_width = 0;
            dsc.radius = radius;
            lv_area_t area{x, y, x + w - 1, y + h - 1};
            lv_draw_rect(&layer, &dsc, &area);
          };
          auto fill_circle = [&](int cx, int cy, int r, lv_color_t color) {
            fill_rect(cx - r, cy - r, r * 2 + 1, r * 2 + 1, color, LV_RADIUS_CIRCLE);
          };
          auto thick_line = [&](int x1, int y1, int x2, int y2, lv_color_t color, int width) {
            lv_draw_line_dsc_t dsc;
            lv_draw_line_dsc_init(&dsc);
            dsc.color = color;
            dsc.width = width;
            dsc.opa = LV_OPA_COVER;
            dsc.round_start = true;
            dsc.round_end = true;
            dsc.p1.x = x1; dsc.p1.y = y1;
            dsc.p2.x = x2; dsc.p2.y = y2;
            lv_draw_line(&layer, &dsc);
          };

          const lv_color_t outline_c  = lv_color_hex(0xFFFFFF);
          const lv_color_t sand_c     = lv_color_hex(0xFFC107);
          const lv_color_t sand_dim_c = lv_color_hex(0xB88812);

          const int hourglass_w = 150, hourglass_h = 280;
          const int hg_x = 102;
          const int hg_y = (466 - hourglass_h) / 2;
          const int hg_cx = hg_x + hourglass_w / 2;
          const int hg_top = hg_y;
          const int hg_mid = hg_y + hourglass_h / 2;
          const int hg_bot = hg_y + hourglass_h;
          const int rim_h = 9;
          const int throat_w = 13;
          const int chamber_pad = 13;
          const int top_inner_y = hg_top + rim_h + 2;
          const int bot_inner_y = hg_bot - rim_h - 2;
          const int line_thick = 3;
          const int drop_radius = 5;

          fill_rect(hg_x, hg_top, hourglass_w, rim_h, outline_c, 0);
          fill_rect(hg_x, hg_bot - rim_h, hourglass_w, rim_h, outline_c, 0);

          thick_line(hg_x + chamber_pad, top_inner_y, hg_cx - throat_w / 2, hg_mid, outline_c, line_thick);
          thick_line(hg_x + hourglass_w - chamber_pad, top_inner_y, hg_cx + throat_w / 2, hg_mid, outline_c, line_thick);
          thick_line(hg_cx - throat_w / 2, hg_mid, hg_x + chamber_pad, bot_inner_y, outline_c, line_thick);
          thick_line(hg_cx + throat_w / 2, hg_mid, hg_x + hourglass_w - chamber_pad, bot_inner_y, outline_c, line_thick);

          const int top_chamber_h = std::max(1, hg_mid - top_inner_y - 3);
          const int bot_chamber_h = std::max(1, bot_inner_y - hg_mid - 3);
          const int top_surface_y = top_inner_y + (int) lroundf(top_chamber_h * (1.0f - remain));
          const int bot_fill_h    = (int) lroundf(bot_chamber_h * (1.0f - remain));
          const int wide = hourglass_w / 2 - chamber_pad;
          const int neck = std::max(throat_w / 2, 2);

          if (remain > 0.0f) {
            const int y_end   = hg_mid - 4;
            const int y_start = std::min(std::max(top_surface_y, top_inner_y), y_end);
            for (int y = y_start; y <= y_end; ++y) {
              float t = (float) (y - top_inner_y) / (float) std::max(1, hg_mid - top_inner_y);
              t = std::min(1.0f, std::max(0.0f, t));
              int hw = wide - (int) lroundf((wide - neck) * t);
              lv_color_t col = (y == y_start) ? sand_c : sand_dim_c;
              fill_rect(hg_cx - hw, y, hw * 2 + 1, 1, col, 0);
            }
          }

          if (bot_fill_h > 0) {
            const int y_end   = bot_inner_y;
            const int y_start = std::max(hg_mid + 4, bot_inner_y - bot_fill_h);
            for (int y = y_start; y <= y_end; ++y) {
              float t = (float) (y - hg_mid) / (float) std::max(1, bot_inner_y - hg_mid);
              t = std::min(1.0f, std::max(0.0f, t));
              int hw = neck + (int) lroundf((wide - neck) * t);
              lv_color_t col = (y > y_start + (y_end - y_start) / 2) ? sand_dim_c : sand_c;
              fill_rect(hg_cx - hw, y, hw * 2 + 1, 1, col, 0);
            }
          }

          if (remain > 0.0f) {
            const int drop_top = hg_mid + 3;
            const int bottom_surface_y = (bot_fill_h > 0) ? std::max(hg_mid + 5, bot_inner_y - bot_fill_h) : bot_inner_y;
            const int drop_bot   = std::max(drop_top + 1, bottom_surface_y - 2);
            const int drop_steps = std::max(4, std::min(10, (drop_bot - drop_top) / 3));
            const uint32_t elapsed_seconds = total > left ? (uint32_t) (total - left) : 0;
            const int drop_step        = elapsed_seconds % drop_steps;
            const int second_drop_step = (drop_step + drop_steps / 2) % drop_steps;
            const int drop_y1 = drop_top + ((drop_bot - drop_top) * drop_step)        / std::max(1, drop_steps - 1);
            const int drop_y2 = drop_top + ((drop_bot - drop_top) * second_drop_step) / std::max(1, drop_steps - 1);
            fill_circle(hg_cx, drop_y1, drop_radius, sand_c);
            fill_circle(hg_cx, drop_y2, drop_radius, sand_dim_c);
          }

          lv_canvas_finish_layer(canvas, &layer);
          lv_obj_clear_flag(id(hourglass_canvas), LV_OBJ_FLAG_HIDDEN);

          char text[16];
          if (left >= 3600) {
            snprintf(text, sizeof(text), "%d:%02d:%02d", left / 3600, (left / 60) % 60, left % 60);
          } else {
            snprintf(text, sizeof(text), "%d:%02d", left / 60, left % 60);
          }
          lv_label_set_text(id(idle_timer_countdown), text);

          if (id(va_phase) == ${va_phase_idle}) {
            lv_obj_add_flag(id(standby_background_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(idle_center_block), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(idle_timer_block), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(idle_timer_block));
          } else {
            lv_obj_add_flag(id(idle_timer_block), LV_OBJ_FLAG_HIDDEN);
          }

  - id: show_volume_ring
    mode: restart
    then:
      - script.stop: hide_volume_ring
      - lambda: |-
          if (id(volume_ring_overlay) == nullptr) {
            id(volume_ring_overlay) = lv_obj_create(lv_layer_top());
            lv_obj_remove_style_all(id(volume_ring_overlay));
            lv_obj_set_size(id(volume_ring_overlay), 150, 150);
            lv_obj_center(id(volume_ring_overlay));
            lv_obj_set_style_bg_color(id(volume_ring_overlay), lv_color_hex(0x000000), 0);
            lv_obj_set_style_bg_opa(id(volume_ring_overlay), 230, 0);
            lv_obj_set_style_border_width(id(volume_ring_overlay), 3, 0);
            lv_obj_set_style_radius(id(volume_ring_overlay), LV_RADIUS_CIRCLE, 0);
            lv_obj_clear_flag(id(volume_ring_overlay), LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(id(volume_ring_overlay), LV_OBJ_FLAG_SCROLLABLE);

            id(volume_ring_label) = lv_label_create(id(volume_ring_overlay));
            lv_obj_set_width(id(volume_ring_label), 130);
            lv_obj_center(id(volume_ring_label));
            lv_obj_set_style_text_align(id(volume_ring_label), LV_TEXT_ALIGN_CENTER, 0);
            lv_obj_set_style_text_font(id(volume_ring_label), id(font_7seg), 0);
          }

          const float volume = std::max(0.0f, std::min(1.0f, id(external_media_player).volume));
          const int pct = (int) lroundf(volume * 100.0f);
          const uint32_t accent_u32 = ((uint32_t) id(accent_red) << 16) | ((uint32_t) id(accent_green) << 8) | (uint32_t) id(accent_blue);
          const lv_color_t accent = lv_color_hex(accent_u32);
          const uint32_t accent4_u32 = ((uint32_t) id(accent4_red) << 16) | ((uint32_t) id(accent4_green) << 8) | (uint32_t) id(accent4_blue);
          const lv_color_t accent4 = lv_color_hex(accent4_u32);
          lv_obj_set_style_border_color(id(volume_ring_overlay), accent, 0);
          lv_obj_set_style_text_color(id(volume_ring_label), accent4, 0);
          char text[8];
          snprintf(text, sizeof(text), "%d", pct);
          lv_label_set_text(id(volume_ring_label), text);
          lv_obj_set_style_opa(id(volume_ring_overlay), LV_OPA_COVER, 0);
          lv_obj_clear_flag(id(volume_ring_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(volume_ring_overlay));
      - script.execute: hide_volume_ring

  - id: hide_volume_ring
    mode: restart
    then:
      - delay: 900ms
      - lambda: |-
          if (id(volume_ring_overlay) == nullptr) return;
          lv_anim_del(id(volume_ring_overlay), nullptr);
          lv_anim_t fade;
          lv_anim_init(&fade);
          lv_anim_set_var(&fade, id(volume_ring_overlay));
          lv_anim_set_values(&fade, LV_OPA_COVER, LV_OPA_TRANSP);
          lv_anim_set_time(&fade, 260);
          lv_anim_set_exec_cb(&fade, [](void *obj, int32_t opacity) {
            lv_obj_set_style_opa((lv_obj_t *) obj, opacity, 0);
          });
          lv_anim_start(&fade);
      - delay: 280ms
      - lambda: |-
          if (id(volume_ring_overlay) != nullptr) {
            lv_obj_add_flag(id(volume_ring_overlay), LV_OBJ_FLAG_HIDDEN);
          }


  - id: album_art_show_fallback
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(album_art_slide_active);'
          then:
            - if:
                condition:
                  lambda: 'return id(last_album_art_valid);'
                then:
                  - lvgl.image.update:
                      id: outgoing_art
                      src: sendspin_album_art_transition
                else:
                  - lvgl.image.update:
                      id: outgoing_art
                      src: fallback_playing_image
            - lvgl.image.update:
                id: incoming_art
                src: fallback_playing_image
            - lvgl.animation.start: album_art_crossfade
            - lvgl.image.update:
                id: controls_album_art_widget
                src: fallback_playing_image
            - lvgl.image.update:
                id: playlist_album_art_widget
                src: fallback_playing_image

  - id: ring_timer
    then:
      - script.execute: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file: "timer_finished_sound"

  - id: enable_repeat_one
    then:
      - media_player.repeat_one:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 500ms

  - id: disable_repeat
    then:
      - media_player.repeat_off:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 0ms

  - id: activate_stop_word_once
    mode: restart
    then:
      - wait_until:
          condition:
            media_player.is_announcing:
              id: external_media_player
          timeout: 5s
      - delay: 1s
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
      - wait_until:
          not:
            media_player.is_announcing:
              id: external_media_player
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.disable_model: stop

  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: 'return sound_file == "ready_sound";'
          then:
            - lambda: 'id(boot_announce_active) = true;'

      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true

      - lambda: |-
          if ((id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }

