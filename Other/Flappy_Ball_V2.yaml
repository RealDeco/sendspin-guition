generic_image:
  - platform: sendspin
    id: sendspin_album_art
    format: jpeg
    type: RGB565
    resize: ${imagewidth}x${imageheight}
    source: ALBUM
    on_image_display:
      - script.stop: album_art_timeout_fallback
      - lambda: |-
          id(sendspin_album_art_valid) = true;
      - if:
          condition:
            lambda: 'return !id(album_art_slide_active);'
          then:
            - script.execute: album_art_apply_decoded
    on_image_error:
      - lambda: |-
          id(sendspin_album_art_valid) = false;
          if (!id(album_art_slide_active)) {
            lv_obj_add_flag(id(album_art_transition_widget), LV_OBJ_FLAG_HIDDEN);
          }
      - lvgl.image.update:
          id: album_art_widget
          src: fallback_playing_image
      - lvgl.image.update:
          id: controls_album_art_widget
          src: fallback_playing_image
      - lvgl.image.update:
          id: playlist_album_art_widget
          src: fallback_playing_image

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false

audio_file:
  - id: timer_finished_sound
    file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
  - id: ready_sound
    file: https://github.com/RealDeco/xiaozhi-esphome/raw/main/sounds/${startup_sound_file}.flac
  - id: wake_word_sound
    file: https://github.com/RealDeco/xiaozhi-esphome/raw/main/sounds/${wakeup_sound}.flac

http_request:

i2c:
  - id: bus_a
    sda: GPIO15
    scl: GPIO14
    scan: true
  - id: bus_b
    sda: GPIO11
    scl: GPIO7
    scan: true

spi:
  - id: spi_bus
    clk_pin: GPIO4
    mosi_pin: GPIO2

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16
    full_duplex: true
    
audio_dac:
  - platform: es8311
    i2c_id: bus_a
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: raw_microphone
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO10
    adc_type: external
    channel: stereo
    pdm: false
    sample_rate: ${media_sample_rate}
    bits_per_sample: 16bit
  - platform: resampler
    id: voice_microphone
    microphone:
      microphone: raw_microphone
      channels: [0]
    sample_rate: 16000
    buffer_duration: 500ms
    
speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: ${media_sample_rate}
    bits_per_sample: 16bit
    channel: mono
##    timeout: never

  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
      - id: media_mixing_input

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: ${media_sample_rate}
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: ${media_sample_rate}
    bits_per_sample: 16

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
  - platform: audio_http
    id: http_media_source
    buffer_size: 100000
  - platform: sendspin
    id: sendspin_media_source

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    name: Sendspin Group Media Player

  - platform: speaker_source
    id: external_media_player
    name: Media Player

    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: ${media_sample_rate}
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source

    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: ${media_sample_rate}
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0.5
    volume_max: 0.8

    on_play:
      then:
        - script.stop: mp_idle_debounce
        - if:
            condition:
              and:
                - lambda: 'return id(va_phase) == ${va_phase_idle};'
                - lambda: 'return !id(va_reply_active);'
                - not:
                    media_player.is_announcing:
                      id: external_media_player
            then:
              - lambda: |-
                  ESP_LOGW("va", "stopping wake word for media playback");
              - script.execute: stop_wake_word
        - script.execute: led_ring_apply_state
        - if:
            condition:
              lambda: 'return id(va_phase) == ${va_phase_idle};'
            then:
              - if:
                  condition:
                    lambda: 'return id(ui_phase) == ${ui_phase_player_controls};'
                  then:
                    - script.execute:
                        id: set_ui_phase
                        phase: ${ui_phase_player_controls}
                  else:
                    - script.execute:
                        id: set_ui_phase
                        phase: ${ui_phase_now_playing}

    on_idle:
      then:
        - if:
            condition:
              lambda: 'return id(va_reply_active);'
            then:
              - lambda: |-
                  id(va_reply_active) = false;
              - script.execute: finish_va_reply
            else:
              - if:
                  condition:
                    and:
                      - lambda: 'return id(va_phase) == ${va_phase_idle};'
                      - not:
                          media_player.is_announcing:
                            id: external_media_player
                  then:
                    - script.execute: start_wake_word
              - if:
                  condition:
                    lambda: 'return id(va_phase) == ${va_phase_idle};'
                  then:
                    - script.execute: mp_idle_debounce
              - script.execute: led_ring_apply_state

    on_pause:
      then:
        - script.execute: led_ring_apply_state
        - if:
            condition:
              lambda: 'return id(va_phase) == ${va_phase_idle};'
            then:
              - script.execute: start_wake_word
              - script.execute:
                  id: set_ui_phase
                  phase: ${ui_phase_player_controls}

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    on_multi_click:
      - timing:
          - ON for at most 400ms
          - OFF for at most 350ms
          - ON for at most 400ms
          - OFF for at least 50ms
        then:
          - lambda: id(flappy_game)->stop_game();
          - plane_radar.toggle:
              id: radar
      - timing:
          - ON for at most 600ms
          - OFF for at least 50ms
        then:
          - sendspin.switch:
      - timing:
          - ON for at least 1500ms
        then:
          - plane_radar.stop:
              id: radar
          - flappy_bird.toggle:
              id: flappy_game

switch:
  - platform: gpio
    name: Speaker Enable
    icon: "mdi:speaker"
    entity_category: config
    pin: GPIO46
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: startup_sound_switch
    name: Startup sound
    icon: "mdi:card-text-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: wake_word_sound_switch
    name: Wake word sound
    icon: "mdi:ear-hearing"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: battery_display_switch
    name: Show battery
    icon: "mdi:battery"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: refresh_battery_display
    on_turn_off:
      - lambda: |-
          if (id(battery_bar_widget) != nullptr)
            lv_obj_add_flag(id(battery_bar_widget), LV_OBJ_FLAG_HIDDEN);

  - platform: template
    id: mute
    name: Mute microphone
    icon: "mdi:microphone-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - microphone.unmute:
          id: voice_microphone
      - script.execute: start_wake_word
    on_turn_on:
      - script.execute: stop_wake_word
      - microphone.mute:
          id: voice_microphone

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - micro_wake_word.disable_model: stop
      - script.execute:
          id: set_va_phase
          phase: ${va_phase_idle}
      - script.execute: disable_repeat
      - if:
          condition:
            media_player.is_announcing:
              id: external_media_player
          then:
            - media_player.stop:
                announcement: true
                id: external_media_player
      - script.execute: led_ring_apply_state
    on_turn_on:
      - micro_wake_word.enable_model: stop
      - script.execute:
          id: set_va_phase
          phase: ${va_phase_timer_ringing}
      - script.execute: ring_timer
      - script.execute: led_ring_apply_state
      - delay: 15min
      - switch.turn_off: timer_ringing

  - platform: template
    id: standby_screen_timeout_enabled
    name: Standby screen timeout
    icon: "mdi:monitor-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: standby_screen_activity
    on_turn_off:
      - script.execute: standby_screen_activity

  - platform: template
    id: standby_background_enabled
    name: Standby clock background
    icon: "mdi:image-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: load_standby_background
    on_turn_off:
      - lambda: |-
          lv_obj_add_flag(id(standby_background_widget), LV_OBJ_FLAG_HIDDEN);
      - online_image.release: standby_background_image

number:
  - platform: template
    id: radar_center_lat
    name: "Radar Center Latitude"
    icon: "mdi:latitude"
    entity_category: config
    min_value: -90
    max_value: 90
    step: 0.0001
    initial_value: ${radar_lat}
    restore_value: true
    set_action:
      - lambda: id(radar)->set_latitude(x);

  - platform: template
    id: radar_center_lon
    name: "Radar Center Longitude"
    icon: "mdi:longitude"
    entity_category: config
    min_value: -180
    max_value: 180
    step: 0.0001
    initial_value: ${radar_lon}
    restore_value: true
    set_action:
      - lambda: id(radar)->set_longitude(x);

  - platform: template
    id: player_controls_timeout_seconds
    name: Player controls timeout delay
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    mode: box
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    set_action:
      - if:
          condition:
