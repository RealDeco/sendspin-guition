substitutions:
  name: xiaozhi-ball-v2
  friendly_name: "Xiaozhi Ball V2"

  radar_lat: "55.6761"   # Center latitude  (set to your location)
  radar_lon: "12.5862"   # Center longitude (set to your location)

  startup_sound_file: "Home_Connected" # (options are: available, Home_Connected, Home_Connected_Male, Computer_Ready)
  wakeup_sound: "popup" # (options are: popup, wake_word_triggered)

  imagemodel1: "Gwen_Black"
  imagemodel2: "Alfred"

  ## available models:
  # AlbertQuackmore, Alita, Alfred, Astrobot, Buzz, Casita, Cybergirl, Dory, EVE, Eyes, Eyes2, GLaDOS, Girl1, Guy1, Guy2, Gwen, Gwen_Black, 
  # HA-character, ha-girl, Hacker, Harley, Jarvis, Luffy, Mario, Max, Prime, Robochibi, Robocop, Robot, Robotgirl, Salem, Sarah, Shaun

  
  ha_weather_entity: weather.forecast_home

  media_sample_rate: "48000"

  imagewidth:  "240"
  imageheight: "240"

  screenwidth:  "240"
  screenheight: "240"

  ui_phase_standby: "0"
  ui_phase_player_controls: "1"
  ui_phase_now_playing: "2"
  ui_phase_playlist_menu: "3"
  va_phase_idle: "0"
  va_phase_waiting_for_command: "1"
  va_phase_listening: "2"
  va_phase_thinking: "3"
  va_phase_replying: "4"
  va_phase_error: "5"
  va_phase_timer_ringing: "6"

packages:
  extcomp:
    url: https://github.com/RealDeco/xiaozhi-esphome.git
    ref: main
    refresh: 0s
    files:
      - devices/Under_Development/Modular/HW/sendspin-external_components.yaml

external_components:
  - source: github://pr#16882
    components: [audio, i2s_audio, micro_wake_word, resampler]
    refresh: 1h
  - source: github://RealDeco/sendspin-guition@main
    components: [plane_radar, flappy_bird]
    refresh: 0d

#packages: # local
#  extcomp: !include localtest/HW/sendspin-external_components.yaml

plane_radar:
  id: radar
  latitude: ${radar_lat}
  longitude: ${radar_lon}
  update_interval: 15s
  initial_range_km: 50
  on_aircraft_update:
    - lambda: |-
        id(radar_aircraft_sensor).publish_state(count);

flappy_bird:
  id: flappy_game
  gravity: 1.0
  flap_strength: -9.5
  pipe_speed: 6.0
  gap_size: 72
  on_game_over:
    - lambda: |-
        if (score > (int)id(flappy_high_score)) {
          id(flappy_high_score) = score;
          id(flappy_hs_sensor).publish_state(score);
        }

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: True

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  name_add_mac_suffix: false
  project:
    name: realdeco.sendspin_guition
    version: "2026.7.0"
  on_boot:
    priority: -100
    then:
      - script.execute:
          id: set_ui_phase
          phase: ${ui_phase_standby}
      - script.execute:
          id: set_va_phase
          phase: ${va_phase_idle}
      - script.execute: refresh_playlist_labels
      - script.execute: apply_accent_color_debounced
      - script.execute: led_ring_apply_state
      - component.update: flappy_hs_sensor
      - lambda: id(flappy_game)->set_high_score(id(flappy_high_score));
      - lambda: |-
          id(radar)->set_latitude(id(radar_center_lat).state);
          id(radar)->set_longitude(id(radar_center_lon).state);
      - lambda: 'id(timer_seconds_remaining).publish_state(0);'

logger:
  level: WARN

api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return !id(boot_sound_played) && !id(boot_announce_active);'
        then:
          - lambda: 'id(boot_announce_active) = true;'
          - lvgl.label.update:
              id: boot_sound_label
              text: "Home Connected"
          - if:
              condition:
                switch.is_on: startup_sound_switch
              then:
                - lambda: 'id(play_sound)->execute(true, std::string("ready_sound"));'
                - delay: 3500ms
              else:
                - delay: 2s
          - lambda: |-
              id(boot_sound_played) = true;
              id(boot_announce_active) = false;
          - script.execute:
              id: set_ui_phase
              phase: !lambda 'return id(ui_phase);'
          - if:
              condition:
                switch.is_on: battery_display_switch
              then:
                - script.execute: refresh_battery_display

ota:
  - platform: esphome

wifi:
  on_connect:
    - delay: 1s
    - if:
        condition:
          switch.is_on: standby_background_enabled
        then:
          - script.execute: load_standby_background
  ap:

improv_serial:

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

interval:
  - interval: 1s
    then:
      - script.execute: refresh_now_playing_progress_bar

