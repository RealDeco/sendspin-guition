  - id: fetch_daily_forecast
    mode: restart
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${ha_weather_entity}
            type: daily
          capture_response: true
          on_success:
            - lambda: |-
                auto icon_for_condition = [](const std::string &condition) -> const char* {
                  if (condition == "sunny" || condition == "clear") return "\U000F0599";
                  if (condition == "partlycloudy") return "\U000F0595";
                  if (condition == "cloudy") return "\U000F0590";
                  if (condition == "rainy") return "\U000F0597";
                  if (condition == "pouring") return "\U000F0596";
                  if (condition == "snowy") return "\U000F0598";
                  if (condition == "lightning") return "\U000F0593";
                  if (condition == "hail") return "\U000F0592";
                  return "\U000F0590";
                };

                auto weekday_from_iso = [](const char *iso_value, int fallback_offset) -> const char* {
                  static const char* names[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
                  if (iso_value == nullptr || iso_value[0] == '\0') {
                    return names[(fallback_offset + 1) % 7];
                  }
                  int year = 0;
                  int month = 0;
                  int day = 0;
                  if (sscanf(iso_value, "%d-%d-%d", &year, &month, &day) != 3) {
                    return names[(fallback_offset + 1) % 7];
                  }
                  if (month < 1 || month > 12) {
                    return names[(fallback_offset + 1) % 7];
                  }
                  static const int offsets[] = {0, 3, 2, 5, 0, 3, 5, 1, 4, 6, 2, 4};
                  if (month < 3) year -= 1;
                  int day_index = (year + year / 4 - year / 100 + year / 400 + offsets[month - 1] + day) % 7;
                  if (day_index < 0 || day_index > 6) {
                    return names[(fallback_offset + 1) % 7];
                  }
                  return names[day_index];
                };

                JsonArrayConst forecast = response["response"]["${ha_weather_entity}"]["forecast"].as<JsonArrayConst>();
                if (forecast.isNull() || forecast.size() == 0) {
                  lv_obj_add_flag(id(home_forecast_strip), LV_OBJ_FLAG_HIDDEN);
                  ESP_LOGW("forecast", "No daily forecast data returned");
                  return;
                }

                lv_obj_t *day_labels[3] = {id(home_forecast_day_1), id(home_forecast_day_2), id(home_forecast_day_3)};
                lv_obj_t *icon_labels[3] = {id(home_forecast_icon_1), id(home_forecast_icon_2), id(home_forecast_icon_3)};
                lv_obj_t *temp_labels[3] = {id(home_forecast_temp_1), id(home_forecast_temp_2), id(home_forecast_temp_3)};

                size_t start_index = forecast.size() >= 4 ? 1 : 0;
                std::string tunit = id(ha_weather_temperature_unit).state.c_str();
                if (tunit.empty()) tunit = "\u00B0C";

                bool rendered_any = false;
                for (size_t i = 0; i < 3; i++) {
                  size_t src_index = start_index + i;
                  if (src_index >= forecast.size()) {
                    lv_label_set_text(day_labels[i], "--");
                    lv_label_set_text(icon_labels[i], "\U000F0590");
                    lv_label_set_text(temp_labels[i], "--");
                    continue;
                  }
                  JsonObjectConst day = forecast[src_index].as<JsonObjectConst>();
                  const char *datetime_value = day["datetime"] | "";
                  const char *condition_value = day["condition"] | "cloudy";
                  float high_temp = day["temperature"] | NAN;
                  float low_temp = day["templow"] | high_temp;

                  lv_label_set_text(day_labels[i], weekday_from_iso(datetime_value, i));
                  lv_label_set_text(icon_labels[i], icon_for_condition(std::string(condition_value)));

                  if (std::isnan(high_temp)) {
                    lv_label_set_text(temp_labels[i], "--");
                  } else {
                    char temp_buf[24];
                    snprintf(temp_buf, sizeof(temp_buf), "%.0f/%.0f%s", high_temp, std::isnan(low_temp) ? high_temp : low_temp, tunit.c_str());
                    lv_label_set_text(temp_labels[i], temp_buf);
                    rendered_any = true;
                  }
                }

                if (rendered_any && id(clock_style_mode) == ${clock_style_home}) {
                  lv_obj_clear_flag(id(home_forecast_strip), LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(id(home_forecast_strip), LV_OBJ_FLAG_HIDDEN);
                }
          on_error:
            - lambda: |-
                lv_obj_add_flag(id(home_forecast_strip), LV_OBJ_FLAG_HIDDEN);
                ESP_LOGW("forecast", "weather.get_forecasts failed");

  - id: analog_clock_redraw
    mode: restart
    then:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_analog};'
              - lambda: 'return id(analog_clock_canvas_widget) != nullptr;'
          then:
            - lambda: |-
                lv_obj_t *canvas = id(analog_clock_canvas_widget);
                const int32_t SIZE = std::min(${screenwidth}, ${screenheight});
                const int32_t CX = SIZE / 2;
                const int32_t CY = SIZE / 2;
                const int32_t R = SIZE / 2 - 10;

                lv_canvas_fill_bg(canvas, lv_color_hex(0x000000), LV_OPA_TRANSP);

                lv_layer_t layer;
                lv_canvas_init_layer(canvas, &layer);

                const uint32_t accent = ((uint32_t) id(accent_red) << 16) | ((uint32_t) id(accent_green) << 8) | (uint32_t) id(accent_blue);
                const uint32_t accent2 = ((uint32_t) id(accent2_red) << 16) | ((uint32_t) id(accent2_green) << 8) | (uint32_t) id(accent2_blue);
                const uint32_t accent3 = ((uint32_t) id(accent3_red) << 16) | ((uint32_t) id(accent3_green) << 8) | (uint32_t) id(accent3_blue);
                lv_color_t fg = lv_color_hex(accent);
                lv_color_t fg2 = lv_color_hex(accent2);
                lv_color_t fg3 = lv_color_hex(accent3);
                const bool show_seconds = id(clock_show_seconds).state;

                lv_draw_line_dsc_t line_dsc;
                lv_draw_line_dsc_init(&line_dsc);
                line_dsc.round_start = true;
                line_dsc.round_end = true;

                if (id(clock_show_gfx).state) {
                  for (int i = 0; i < 60; i++) {
                    float a = (i / 60.0f) * 6.2831853f - 1.5707963f;
                    bool major = (i % 5 == 0);
                    int32_t r_out = R;
                    int32_t r_in = major ? R - 16 : R - 8;
                    line_dsc.p1.x = CX + (int32_t) (cosf(a) * r_out);
                    line_dsc.p1.y = CY + (int32_t) (sinf(a) * r_out);
                    line_dsc.p2.x = CX + (int32_t) (cosf(a) * r_in);
                    line_dsc.p2.y = CY + (int32_t) (sinf(a) * r_in);
                    line_dsc.color = major ? fg : fg2;
                    line_dsc.width = major ? 3 : 1;
                    lv_draw_line(&layer, &line_dsc);
                  }
                }

                if (id(clock_show_date).state) {
                  std::string date_str = id(clock_date).state;
                  lv_draw_label_dsc_t label_dsc;
                  lv_draw_label_dsc_init(&label_dsc);
                  label_dsc.color = fg2;
                  label_dsc.font = id(font_date)->get_lv_font();
                  label_dsc.align = LV_TEXT_ALIGN_CENTER;
                  label_dsc.text = date_str.c_str();
                  label_dsc.text_local = true;
                  const int32_t date_y = CY + (int32_t) (R * 0.55f);
                  lv_area_t label_area = {CX - R, date_y, CX + R, date_y + 40};
                  lv_draw_label(&layer, &label_dsc, &label_area);
                }

                auto t = id(homeassistant_time).now();
                int hh = t.is_valid() ? (t.hour % 12) : 0;
                int mm = t.is_valid() ? t.minute : 0;
                int ss = t.is_valid() ? t.second : 0;

                float s_pos = ss / 60.0f;
                float m_pos = (mm + s_pos) / 60.0f;
                float h_pos = (hh + m_pos) / 12.0f;

                auto draw_hand = [&](float pos, int32_t len, int32_t width, lv_color_t color) {
                  float a = pos * 6.2831853f - 1.5707963f;
                  line_dsc.p1.x = CX;
                  line_dsc.p1.y = CY;
                  line_dsc.p2.x = CX + (int32_t) (cosf(a) * len);
                  line_dsc.p2.y = CY + (int32_t) (sinf(a) * len);
                  line_dsc.color = color;
                  line_dsc.width = width;
                  lv_draw_line(&layer, &line_dsc);
                };

                draw_hand(h_pos, (int32_t) (R * 0.5f), 6, fg3);
                draw_hand(m_pos, (int32_t) (R * 0.72f), 4, fg3);
                if (show_seconds) {
                  draw_hand(s_pos, (int32_t) (R * 0.85f), 1, fg);
                }

                lv_draw_rect_dsc_t dot_dsc;
                lv_draw_rect_dsc_init(&dot_dsc);
                dot_dsc.bg_color = fg;
                dot_dsc.bg_opa = LV_OPA_COVER;
                dot_dsc.radius = LV_RADIUS_CIRCLE;
                lv_area_t dot_area = {CX - 6, CY - 6, CX + 6, CY + 6};
                lv_draw_rect(&layer, &dot_dsc, &dot_area);

                lv_canvas_finish_layer(canvas, &layer);
                lv_obj_invalidate(canvas);

  - id: retro_clock_redraw
    mode: restart
    parameters:
      full_redraw: bool
    then:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_retro};'
              - lambda: 'return id(analog_clock_canvas_widget) != nullptr;'
          then:
            - lambda: |-
                lv_obj_t *canvas = id(analog_clock_canvas_widget);
                const int32_t SIZE = std::min(${screenwidth}, ${screenheight});
                const int32_t CX = SIZE / 2;
                const int32_t CY = SIZE / 2;
                const float scale = SIZE / 240.0f;
                auto S = [&](float v) -> int32_t { return (int32_t) roundf(v * scale); };

                const lv_color_t c_matte = lv_color_hex(0x080808);
                const lv_color_t c_matte_dark = lv_color_hex(0x333333);
                const lv_color_t c_charcoal = lv_color_hex(0x181818);
                const lv_color_t c_white = lv_color_hex(0xFFFFFF);
                const lv_color_t c_soft_white = lv_color_hex(0xD6D3D6);
                const lv_color_t c_dim_white = lv_color_hex(0x7B7D7B);
                const lv_color_t c_shadow = lv_color_hex(0x000000);
                const lv_color_t c_orange = lv_color_hex(0xFFA600);
                const lv_color_t c_orange_dark = lv_color_hex(0xB56100);
                const lv_color_t c_ring_inner = lv_color_hex(0x101010);
                const lv_color_t c_tick_minor = lv_color_hex(0x525152);

                lv_draw_buf_t *canvas_buf = lv_canvas_get_draw_buf(canvas);

                // The bezel/rings/tick-marks/numerals/caption never change - redrawing
                // all ~75 of those shapes every second (on top of the moving hands) was
                // cheap enough on the 360x360 reference device but expensive enough on
                // this larger canvas to intermittently starve the touchscreen driver's
                // own timing and make touch stop registering. Draw the static face once,
                // cache a raw snapshot of the canvas buffer, and on every later call just
                // memcpy it back (near-instant) before drawing only the moving parts.
                if (id(retro_static_buf) == nullptr) {
                  lv_canvas_fill_bg(canvas, lv_color_hex(0x000000), LV_OPA_COVER);

                  lv_layer_t static_layer;
                  lv_canvas_init_layer(canvas, &static_layer);

                  auto fill_circle_at = [&](int32_t cx, int32_t cy, int32_t r, lv_color_t color) {
                    lv_draw_rect_dsc_t dsc;
                    lv_draw_rect_dsc_init(&dsc);
                    dsc.bg_color = color;
                    dsc.bg_opa = LV_OPA_COVER;
                    dsc.border_opa = LV_OPA_TRANSP;
                    dsc.radius = LV_RADIUS_CIRCLE;
                    lv_area_t area = {cx - r, cy - r, cx + r, cy + r};
                    lv_draw_rect(&static_layer, &dsc, &area);
                  };
                  auto fill_circle = [&](int32_t r, lv_color_t color) {
                    fill_circle_at(CX, CY, r, color);
                  };
                  auto stroke_circle = [&](int32_t r, lv_color_t color, int32_t width) {
                    lv_draw_rect_dsc_t dsc;
                    lv_draw_rect_dsc_init(&dsc);
                    dsc.bg_opa = LV_OPA_TRANSP;
                    dsc.border_color = color;
                    dsc.border_width = width;
                    dsc.border_opa = LV_OPA_COVER;
                    dsc.radius = LV_RADIUS_CIRCLE;
                    lv_area_t area = {CX - r, CY - r, CX + r, CY + r};
                    lv_draw_rect(&static_layer, &dsc, &area);
                  };

                  fill_circle(S(118.0f), c_matte_dark);
                  fill_circle(S(111.0f), c_matte);

                  for (int r = 110; r >= 72; r -= 8) {
                    stroke_circle(S((float) r), (r == 110) ? c_charcoal : c_ring_inner, 1);
                  }
                  stroke_circle(S(117.0f), c_dim_white, 1);
                  stroke_circle(S(116.0f), c_charcoal, 1);
                  stroke_circle(S(105.0f), c_charcoal, 1);

                  lv_draw_line_dsc_t static_line_dsc;
                  lv_draw_line_dsc_init(&static_line_dsc);
                  static_line_dsc.round_start = true;
                  static_line_dsc.round_end = true;

                  for (int i = 0; i < 60; i++) {
                    float a = (i / 60.0f) * 6.2831853f - 1.5707963f;
                    bool major = (i % 5 == 0);
                    int32_t r_out = S(major ? 107.0f : 104.0f);
                    int32_t r_in = S(major ? 91.0f : 99.0f);
                    static_line_dsc.p1.x = CX + (int32_t) (cosf(a) * r_out);
                    static_line_dsc.p1.y = CY + (int32_t) (sinf(a) * r_out);
                    static_line_dsc.p2.x = CX + (int32_t) (cosf(a) * r_in);
                    static_line_dsc.p2.y = CY + (int32_t) (sinf(a) * r_in);
                    static_line_dsc.color = major ? c_soft_white : c_tick_minor;
                    static_line_dsc.width = major ? 2 : 1;
                    lv_draw_line(&static_layer, &static_line_dsc);
                  }

                  lv_draw_label_dsc_t numeral_dsc;
                  lv_draw_label_dsc_init(&numeral_dsc);
                  numeral_dsc.color = c_soft_white;
                  numeral_dsc.font = id(font_retro_numeral)->get_lv_font();
                  numeral_dsc.align = LV_TEXT_ALIGN_CENTER;
                  numeral_dsc.text_local = true;

                  auto draw_numeral = [&](const char *text, int32_t x, int32_t y) {
                    numeral_dsc.text = text;
                    lv_area_t area = {x - S(30.0f), y - S(14.0f), x + S(30.0f), y + S(14.0f)};
                    lv_draw_label(&static_layer, &numeral_dsc, &area);
                  };

                  draw_numeral("12", CX, CY - S(78.0f));
                  draw_numeral("3", CX + S(78.0f), CY);
                  draw_numeral("6", CX, CY + S(78.0f));
                  draw_numeral("9", CX - S(78.0f), CY);

                  lv_draw_label_dsc_t caption_dsc;
                  lv_draw_label_dsc_init(&caption_dsc);
                  caption_dsc.color = c_dim_white;
                  caption_dsc.font = id(font_retro_small)->get_lv_font();
                  caption_dsc.align = LV_TEXT_ALIGN_CENTER;
                  caption_dsc.text = "RETRO";
                  caption_dsc.text_local = true;
                  int32_t caption_y = CY - S(34.0f);
                  lv_area_t caption_area = {CX - S(50.0f), caption_y - S(10.0f), CX + S(50.0f), caption_y + S(10.0f)};
                  lv_draw_label(&static_layer, &caption_dsc, &caption_area);

                  lv_canvas_finish_layer(canvas, &static_layer);

                  uint8_t *snapshot = (uint8_t *) malloc(canvas_buf->data_size);
                  if (snapshot != nullptr) {
                    memcpy(snapshot, canvas_buf->data, canvas_buf->data_size);
                    id(retro_static_buf) = snapshot;
                  }
                } else if (full_redraw) {
                  // Style-entry (or a settings toggle) needs the FULL canvas restored, not
                  // just the hands' bounding square below - the shared canvas may have been
                  // overwritten edge-to-edge by Analog/Mario since Retro last drew, so the
                  // partial restore alone would leave stale content in the outer bezel/ring
                  // area forever. Still cheap: one full memcpy of the cached snapshot, not a
                  // redraw of the ~75 static shapes.
                  memcpy(canvas_buf->data, id(retro_static_buf), canvas_buf->data_size);
                } else {
                  // Restoring the full ~920KB canvas every second (this device's 480x480
                  // canvas is the largest in the fleet) was still expensive enough to
                  // intermittently starve the touchscreen driver on every routine per-second
                  // tick. Only the hands/hub/digital-readout ever move, and they never extend
                  // past S(100) from center (hand length 92 + shadow offset, rounded up for
                  // margin) - restore just that bounding square instead of the whole canvas.
                  const int32_t MOVING_HALF = S(100.0f);
                  const int32_t rx0 = std::max((int32_t) 0, CX - MOVING_HALF);
                  const int32_t rx1 = std::min(SIZE, CX + MOVING_HALF);
                  const int32_t ry0 = std::max((int32_t) 0, CY - MOVING_HALF);
                  const int32_t ry1 = std::min(SIZE, CY + MOVING_HALF);
                  const uint32_t stride = canvas_buf->header.stride;
                  const uint32_t row_bytes = (uint32_t) (rx1 - rx0) * 4;
                  for (int32_t y = ry0; y < ry1; y++) {
                    uint32_t row_offset = (uint32_t) y * stride + (uint32_t) rx0 * 4;
                    memcpy(canvas_buf->data + row_offset, id(retro_static_buf) + row_offset, row_bytes);
                  }
                }

                lv_layer_t layer;
                lv_canvas_init_layer(canvas, &layer);

                lv_draw_line_dsc_t line_dsc;
                lv_draw_line_dsc_init(&line_dsc);
                line_dsc.round_start = true;
                line_dsc.round_end = true;

                auto t = id(homeassistant_time).now();
                int hh24 = t.is_valid() ? t.hour : 0;
                int hh = hh24 % 12;
                int mm = t.is_valid() ? t.minute : 0;
                int ss = t.is_valid() ? t.second : 0;

                float s_pos = ss / 60.0f;
                float m_pos = (mm + s_pos) / 60.0f;
                float h_pos = (hh + m_pos) / 12.0f;

                auto draw_hand = [&](float pos, int32_t len, int32_t width, lv_color_t color, bool shadow) {
                  float a = pos * 6.2831853f - 1.5707963f;
                  int32_t ex = CX + (int32_t) (cosf(a) * len);
                  int32_t ey = CY + (int32_t) (sinf(a) * len);
                  if (shadow) {
                    line_dsc.p1.x = CX + S(3.0f);
                    line_dsc.p1.y = CY + S(3.0f);
                    line_dsc.p2.x = ex + S(3.0f);
                    line_dsc.p2.y = ey + S(3.0f);
                    line_dsc.color = c_shadow;
                    line_dsc.width = width;
                    lv_draw_line(&layer, &line_dsc);
                  }
                  line_dsc.p1.x = CX;
                  line_dsc.p1.y = CY;
                  line_dsc.p2.x = ex;
                  line_dsc.p2.y = ey;
                  line_dsc.color = color;
                  line_dsc.width = width;
                  lv_draw_line(&layer, &line_dsc);
                };

                draw_hand(h_pos, S(53.0f), S(5.0f), c_white, true);
                draw_hand(m_pos, S(76.0f), S(3.0f), c_soft_white, true);

                if (id(clock_show_seconds).state) {
                  draw_hand(s_pos, S(92.0f), S(1.0f), c_orange, true);

                  float tail_pos = s_pos + 0.5f;
                  if (tail_pos >= 1.0f) tail_pos -= 1.0f;
                  draw_hand(tail_pos, S(18.0f), 1, c_orange_dark, false);
                }

                auto fill_circle_dyn = [&](int32_t cx, int32_t cy, int32_t r, lv_color_t color) {
                  lv_draw_rect_dsc_t dsc;
                  lv_draw_rect_dsc_init(&dsc);
                  dsc.bg_color = color;
                  dsc.bg_opa = LV_OPA_COVER;
                  dsc.border_opa = LV_OPA_TRANSP;
                  dsc.radius = LV_RADIUS_CIRCLE;
                  lv_area_t area = {cx - r, cy - r, cx + r, cy + r};
                  lv_draw_rect(&layer, &dsc, &area);
                };
                auto stroke_circle_dyn = [&](int32_t r, lv_color_t color, int32_t width) {
                  lv_draw_rect_dsc_t dsc;
                  lv_draw_rect_dsc_init(&dsc);
                  dsc.bg_opa = LV_OPA_TRANSP;
                  dsc.border_color = color;
                  dsc.border_width = width;
                  dsc.border_opa = LV_OPA_COVER;
                  dsc.radius = LV_RADIUS_CIRCLE;
                  lv_area_t area = {CX - r, CY - r, CX + r, CY + r};
                  lv_draw_rect(&layer, &dsc, &area);
                };

                fill_circle_dyn(CX + S(3.0f), CY + S(3.0f), S(7.0f), c_shadow);
                fill_circle_dyn(CX, CY, S(7.0f), c_matte_dark);
                stroke_circle_dyn(S(7.0f), c_soft_white, 1);
                fill_circle_dyn(CX, CY, S(3.0f), c_orange);

                lv_draw_label_dsc_t digital_dsc;
                lv_draw_label_dsc_init(&digital_dsc);
                digital_dsc.color = c_dim_white;
                digital_dsc.font = id(font_retro_small)->get_lv_font();
                digital_dsc.align = LV_TEXT_ALIGN_CENTER;
                digital_dsc.text_local = true;
                int display_hour = hh24;
                if (id(clock_12h_format).state) {
                  display_hour = hh24 % 12;
                  if (display_hour == 0) display_hour = 12;
                }
                char time_buf[8];
                snprintf(time_buf, sizeof(time_buf), "%02d:%02d", display_hour, mm);
                digital_dsc.text = time_buf;
                int32_t digital_y = CY + S(46.0f);
                lv_area_t digital_area = {CX - S(50.0f), digital_y - S(10.0f), CX + S(50.0f), digital_y + S(10.0f)};
                lv_draw_label(&layer, &digital_dsc, &digital_area);

                lv_canvas_finish_layer(canvas, &layer);
                lv_obj_invalidate(canvas);


  - id: mario_draw_scene
    mode: restart
    parameters:
      full_redraw: bool
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(clock_style_mode) == ${clock_style_mario};'
              - lambda: 'return id(analog_clock_canvas_widget) != nullptr;'
              - or:
                  # A full_redraw is a deliberate one-time "prepare this style now" paint (called
                  # when entering Mario style) and must happen even if idle_page isn't the currently
                  # shown page yet (e.g. boot_page is still showing during startup) - otherwise
                  # the canvas is left with whatever garbage was in its freshly-allocated buffer until
                  # something else happens to trigger a redraw. Animation-frame calls (full_redraw:
                  # false) keep the visibility check, since there's no point animating unseen content.
                  - lambda: 'return full_redraw;'
                  - lvgl.page.is_showing: idle_page
