image:
  - platform: file
    file: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/${imagemodel}/${imagewidth}x${imageheight}/playing.png
    id: fallback_playing_image
    resize: ${imageheight}x${imageheight}
    type: RGB565
    dither: NONE

### wallpaper

  - platform: online_image
    id: standby_background_image
    url: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/Other/${imagewidth}x${imageheight}/clock.png
    format: PNG
    type: RGB565
    resize: ${imagewidth}x${imageheight}
    update_interval: never
    on_download_finished:
      - if:
          condition:
            switch.is_on: standby_background_enabled
          then:
            - lvgl.image.update:
                id: standby_background_widget
                src: standby_background_image
            - lvgl.image.update:
                id: pulldown_background_widget
                src: standby_background_image
            - lambda: |-
                lv_obj_clear_flag(id(standby_background_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(pulldown_background_widget), LV_OBJ_FLAG_HIDDEN);

### sendspin album art

  - platform: sendspin
    id: album_slot
    format: JPEG
    type: RGB565
    resize: ${imagewidth}x${imageheight}
    display_offset: 1s
    source: ALBUM
    current_image:
      id: sendspin_album_art
    transition_image:
      id: sendspin_album_art_transition
    on_image_display:
      - lambda: |-
          id(last_album_art_valid) = id(sendspin_album_art_valid);
          id(sendspin_album_art_valid) = true;
          id(album_art_awaiting_swipe_art) = false;
          id(confirmed_art_album_name) = id(sendspin_album).get_state();
      - if:
          condition:
            lambda: 'return !id(album_art_slide_active);'
          then:
            - script.execute: album_art_crossfade_apply
          else:
            - sendspin.image.transition_finished: album_slot
      - lvgl.image.update:
          id: controls_album_art_widget
          src: sendspin_album_art
      - lvgl.image.update:
          id: playlist_album_art_widget
          src: sendspin_album_art
    on_image_clear:
      - logger.log:
          format: "Album art cleared"
          level: WARN
      - lambda: |-
          id(last_album_art_valid) = id(sendspin_album_art_valid);
          id(sendspin_album_art_valid) = false;
      - script.execute: album_art_show_fallback
    on_image_error:
      - logger.log:
          format: "Album art error"
          level: WARN
      - lambda: |-
          id(last_album_art_valid) = id(sendspin_album_art_valid);
          id(sendspin_album_art_valid) = false;
      - script.execute: album_art_show_fallback

  - platform: sendspin
    id: artist_slot
    format: PNG
    type: RGB565
    resize: ${imagewidth}x${imageheight}
    source: artist
    current_image:
      id: artist_art
    on_image_display:
      - logger.log:
          format: "Artist art available (late by %u ms)"
          args: ["(unsigned) lateness_ms"]
          level: INFO
      - lambda: |-
          id(artist_art_valid) = true;
          id(refresh_artist_art_dot)->execute();
    on_image_clear:
      - logger.log:
          format: "No artist art for this song"
          level: INFO
      - lambda: |-
          id(artist_art_valid) = false;
          id(refresh_artist_art_dot)->execute();
    on_image_error:
      - lambda: |-
          ESP_LOGW("artist_art", "failed to decode artist art");
          id(artist_art_valid) = false;
          id(refresh_artist_art_dot)->execute();

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

http_request:

switch:
  - platform: gpio
    name: Relay 1
    pin:
      number: GPIO40
      inverted: true
  - platform: gpio
    name: Relay 2
    pin:
      number: GPIO2
      inverted: true
  - platform: gpio
    name: Relay 3
    pin:
      number: GPIO1
      inverted: true
  - platform: template
    id: standby_screen_timeout_enabled
    name: Standby screen timeout
    icon: "mdi:monitor-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: standby_screen_activity
    on_turn_off:
      - script.execute: standby_screen_activity

  - platform: template
    id: standby_background_enabled
    name: Standby clock background
    icon: "mdi:image-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: load_standby_background
    on_turn_off:
      - lambda: |-
          lv_obj_add_flag(id(standby_background_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(pulldown_background_widget), LV_OBJ_FLAG_HIDDEN);
      - online_image.release: standby_background_image

  - platform: template
    id: clock_12h_format
    name: 12-Hour Clock
    icon: "mdi:clock-time-four-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - component.update: clock_hms
      - script.execute:
          id: retro_clock_redraw
          full_redraw: true
      - script.execute:
          id: mario_draw_scene
          full_redraw: true
    on_turn_off:
      - component.update: clock_hms
      - script.execute:
          id: retro_clock_redraw
          full_redraw: true
      - script.execute:
          id: mario_draw_scene
          full_redraw: true

  - platform: template
    id: clock_show_date
    name: Show Date
    icon: "mdi:calendar-blank-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_digital};'
          then:
            - lvgl.widget.show: date_label
      - script.execute: analog_clock_redraw
    on_turn_off:
      - lvgl.widget.hide: date_label
      - script.execute: analog_clock_redraw

  - platform: template
    id: clock_show_seconds
    name: Show Seconds
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - component.update: clock_hms
      - script.execute: analog_clock_redraw
      - script.execute:
          id: retro_clock_redraw
          full_redraw: true
    on_turn_off:
      - component.update: clock_hms
      - script.execute: analog_clock_redraw
      - script.execute:
          id: retro_clock_redraw
          full_redraw: true

  - platform: template
    id: clock_show_gfx
    name: Show GFX
    icon: "mdi:radar"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: analog_clock_redraw
    on_turn_off:
      - script.execute: analog_clock_redraw

  - platform: template
    id: clock_show_weather
    name: Show Weather
    icon: "mdi:weather-partly-cloudy"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - component.update: weather_line
    on_turn_off:
      - component.update: weather_line

  - platform: template
    id: clock_show_feels_like
    name: Show Feels Like
    icon: "mdi:thermometer-lines"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - component.update: weather_line
    on_turn_off:
      - component.update: weather_line

number:
  - platform: template
    id: player_controls_timeout_seconds
    name: Player controls timeout delay
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    mode: box
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    set_action:
      - if:
          condition:
            lambda: 'return id(ui_phase) == ${ui_phase_player_controls};'
          then:
            - script.execute: player_controls_timeout

  - platform: template
    id: standby_screen_timeout_seconds
    name: Standby screen timeout delay
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    mode: box
    min_value: 15
    max_value: 3600
    step: 5
    initial_value: 60
    set_action:
      - script.execute: standby_screen_activity

select:
  - platform: template
    id: clock_style_choice
    name: Clock Style
    icon: "mdi:clock-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Digital Clock
    options:
      - Digital Clock
      - Analog Clock
      - Rooms
      - Retro
      - Mario
      - Home
    set_action:
      - script.execute:
          id: apply_clock_style
          style_mode: !lambda |-
            if (x == "Analog Clock") return ${clock_style_analog};
            if (x == "Rooms") return ${clock_style_rooms};
            if (x == "Retro") return ${clock_style_retro};
            if (x == "Mario") return ${clock_style_mario};
            if (x == "Home") return ${clock_style_home};
            return ${clock_style_digital};

  - platform: template
    id: accent_color_preset
    name: Accent color preset
    icon: "mdi:palette"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Pitch Black
    options:
      - Pitch Black
      - Burning Red
      - Cyber Blue
    set_action:
      - if:
          condition:
            lambda: return x == "Pitch Black";
          then:
            - light.turn_on:
                id: accent_color_picker
                brightness: 100%
                red: 100%
                green: 100%
                blue: 0%
            - light.turn_on:
                id: accent_color_picker_2
                brightness: 100%
                red: 100%
                green: 100%
                blue: 100%
            - light.turn_on:
                id: accent_color_picker_3
                brightness: 100%
                red: 40%
                green: 80%
                blue: 100%
            - light.turn_on:
                id: accent_color_picker_4
                brightness: 100%
                red: 100%
                green: 100%
                blue: 100%
      - if:
          condition:
            lambda: return x == "Burning Red";
          then:
            - light.turn_on:
                id: accent_color_picker
                brightness: 100%
                red: 100%
                green: 0%
                blue: 0%
            - light.turn_on:
                id: accent_color_picker_2
                brightness: 100%
                red: 100%
                green: 100%
                blue: 0%
            - light.turn_on:
                id: accent_color_picker_3
                brightness: 100%
                red: 100%
                green: 100%
                blue: 100%
            - light.turn_on:
                id: accent_color_picker_4
                brightness: 100%
                red: 100%
                green: 100%
                blue: 100%
      - if:
          condition:
            lambda: return x == "Cyber Blue";
          then:
            - light.turn_on:
                id: accent_color_picker
                brightness: 100%
                red: 40%
                green: 80%
                blue: 100%
            - light.turn_on:
                id: accent_color_picker_2
                brightness: 100%
                red: 0%
