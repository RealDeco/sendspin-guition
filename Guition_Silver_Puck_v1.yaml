substitutions:
  name: silver-puck-v1
  friendly_name: Silver Puck v1

## SETTINGS ######################################################################################################################################

  startup_sound_file: Home_Connected # options are: Home_Connected or Home_Connected_Male
  imagemodel: "HA-character" # options are: AlbertQuackmore, Alita, Casita, Gwen, HA-character, ha-girl, Hacker, Salem, Sarah, Shaun

  # your home assistant weather entity, in most cases the same.
  ha_weather_entity: weather.forecast_home

# presence and light sensors
  sensor1_entity: "binary_sensor.room_1_presence"
  light1_entity: "binary_sensor.room_1_light"
  sensor1_label: "Room 1"

  sensor2_entity: "binary_sensor.room_2_presence"
  light2_entity: "binary_sensor.room_2_light"
  sensor2_label: "Room 2"

  sensor3_entity: "binary_sensor.room_3_presence"
  light3_entity: "binary_sensor.room_3_light"
  sensor3_label: "Room 3"

  sensor4_entity: "binary_sensor.room_4_presence"
  light4_entity: "binary_sensor.room_4_light"
  sensor4_label: "Room 4"

  sensor5_entity: "binary_sensor.room_5_presence"
  light5_entity: "binary_sensor.room_5_light"
  sensor5_label: "Room 5"

  sensor6_entity: "binary_sensor.room_6_presence"
  light6_entity: "binary_sensor.room_6_light"
  sensor6_label: "Room 6"

# pulldown menu switches (labels are set from Home Assistant, see the text entities)
  pulldown1_entity: "light.ceiling"
  pulldown2_entity: "light.ceiling_2"
  pulldown3_entity: "light.hue_p45_7_light"
  pulldown4_entity: "light.color_light"

  display_model: "JC3636W518"
  pdm_mic_type: "false"

  album_fade_time: "1500ms"
  
  imagewidth:  "360"
  imageheight: "360"

  screenwidth:  "360"
  screenheight: "360"

  media_sample_rate: 48000
  ui_phase_standby: "0"
  ui_phase_player_controls: "1"
  ui_phase_now_playing: "2"
  ui_phase_playlist_menu: "3"
  ui_phase_pulldown: "4"
  clock_style_digital: "0"
  clock_style_analog: "1"
  clock_style_rooms: "2"
  clock_style_retro: "3"
  clock_style_mario: "4"

spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO9
  data_pins: [GPIO11, GPIO12, GPIO13, GPIO14]

i2c:
  id: touchscreen_bus
  sda: GPIO7
  scl: GPIO8

  ## SENDSPIN SETTINGS #############################################################################################################################

packages:
  extcomp:
    url: https://github.com/RealDeco/xiaozhi-esphome.git
    ref: main
    refresh: 0s
    files:
      - devices/Under_Development/Modular/HW/sendspin-external_components_2026.8.0.yaml

## END OF SETTINGS ###############################################################################################################################

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.0
  name_add_mac_suffix: true
  project:
    name: realdeco.sendspin_guition
    version: "2026.8.0"
  on_boot:
    priority: -100
    then:
      - script.execute:
          id: set_ui_phase
          phase: ${ui_phase_standby}
      - script.execute: refresh_playlist_labels
      - script.execute: refresh_pulldown_labels
      - script.execute: apply_accent_color_debounced
      - script.execute:
          id: apply_clock_style
          style_mode: !lambda |-
            std::string opt = id(clock_style_choice).current_option();
            if (opt == "Analog Clock") return ${clock_style_analog};
            if (opt == "Rooms") return ${clock_style_rooms};
            if (opt == "Retro") return ${clock_style_retro};
            if (opt == "Mario") return ${clock_style_mario};
            return ${clock_style_digital};

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: True
#    sdkconfig_options:
#      CONFIG_SPIRAM_RODATA: "y"
#      CONFIG_SPIRAM_USE_MALLOC: "y"
#      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "2048"

logger:
  level: WARN

api:
  on_client_connected:
    - lambda: |-
        if (!id(boot_sound_played)) {
          id(boot_sound_played) = true;
          if (id(startup_sound_switch).state) {
            id(play_sound)->execute(true, std::string("ready_sound"));
          }
        }
    - delay: 1s
    - script.execute: rooms_grid_apply
    - script.execute: refresh_pulldown_states
ota:
  - platform: esphome

wifi:
  on_connect:
    - delay: 1s
    - if:
        condition:
          switch.is_on: standby_background_enabled
        then:
          - script.execute: load_standby_background
  ap:

improv_serial:

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false
  
captive_portal:

button:
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    icon: "mdi:restart"

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      - component.update: clock_hms
      - component.update: clock_date

interval:
  - interval: 1s
    then:
      - script.execute: analog_clock_redraw
      - script.execute: retro_clock_redraw
      - script.execute: mario_clock_tick

