image:
  - platform: file
    file: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/${imagemodel}/360x360/playing.png
    id: fallback_playing_image
    resize: ${imageheight}x${imageheight}
    type: RGB565
    dither: NONE

### wallpaper

  - platform: online_image
    id: standby_background_image
    url: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/Other/360x360/clock.png
    format: PNG
    type: RGB565
    resize: ${imagewidth}x${imageheight}
    update_interval: never
    on_download_finished:
      - if:
          condition:
            switch.is_on: standby_background_enabled
          then:
            - lvgl.image.update:
                id: standby_background_widget
                src: standby_background_image
            - lvgl.image.update:
                id: pulldown_background_widget
                src: standby_background_image
            - lambda: |-
                lv_obj_clear_flag(id(standby_background_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(pulldown_background_widget), LV_OBJ_FLAG_HIDDEN);

### sendspin album art

  - platform: sendspin
    id: album_slot
    format: JPEG
    type: RGB565
    resize: ${imagewidth}x${imageheight}
    display_offset: 1s
    source: ALBUM
    current_image:
      id: sendspin_album_art
    transition_image:
      id: sendspin_album_art_transition
    on_image_display:
      - lambda: |-
          id(last_album_art_valid) = id(sendspin_album_art_valid);
          id(sendspin_album_art_valid) = true;
          id(album_art_awaiting_swipe_art) = false;
          id(confirmed_art_album_name) = id(sendspin_album).get_state();
      - if:
          condition:
            lambda: 'return !id(album_art_slide_active);'
          then:
            - script.execute: album_art_crossfade_apply
          else:
            - sendspin.image.transition_finished: album_slot
      - lvgl.image.update:
          id: controls_album_art_widget
          src: sendspin_album_art
      - lvgl.image.update:
          id: playlist_album_art_widget
          src: sendspin_album_art
    on_image_clear:
      - logger.log:
          format: "Album art cleared"
          level: WARN
      - lambda: |-
          id(last_album_art_valid) = id(sendspin_album_art_valid);
          id(sendspin_album_art_valid) = false;
      - script.execute: album_art_show_fallback
    on_image_error:
      - logger.log:
          format: "Album art error"
          level: WARN
      - lambda: |-
          id(last_album_art_valid) = id(sendspin_album_art_valid);
          id(sendspin_album_art_valid) = false;
      - script.execute: album_art_show_fallback

  - platform: sendspin
    id: artist_slot
    format: PNG
    type: RGB565
    resize: ${imagewidth}x${imageheight}
    source: artist
    current_image:
      id: artist_art
    on_image_display:
      - logger.log:
          format: "Artist art available (late by %u ms)"
          args: ["(unsigned) lateness_ms"]
          level: INFO
      - lambda: |-
          id(artist_art_valid) = true;
          id(refresh_artist_art_dot)->execute();
    on_image_clear:
      - logger.log:
          format: "No artist art for this song"
          level: INFO
      - lambda: |-
          id(artist_art_valid) = false;
          id(refresh_artist_art_dot)->execute();
    on_image_error:
      - lambda: |-
          ESP_LOGW("artist_art", "failed to decode artist art");
          id(artist_art_valid) = false;
          id(refresh_artist_art_dot)->execute();

