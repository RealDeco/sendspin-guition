                  0xC300, 0xC300, 0xF801, 0xF801, 0xF801, 0xF801, 0xF801, 0xF801, 0xF801, 0xF801, 0xF801, 0xC300, 0xC300, 0xC300, 0x000E, 0xC300,
                  0xC300, 0xC300, 0xF801, 0xF801, 0xF801, 0xF801, 0xF801, 0xF801, 0xF801, 0xF801, 0x000E, 0x000E, 0x000E, 0x000E, 0x000E, 0x000E,
                  0xC300, 0xC300, 0x000E, 0xF801, 0xF801, 0xF801, 0xF801, 0xF801, 0x000E, 0x000E, 0x000E, 0x000E, 0x000E, 0x000E, 0x000E, 0x000E
                };

                auto rgb565_to_hex = [](uint16_t v) -> uint32_t {
                  uint8_t r5 = (v >> 11) & 0x1F;
                  uint8_t g6 = (v >> 5) & 0x3F;
                  uint8_t b5 = v & 0x1F;
                  uint8_t r8 = (r5 << 3) | (r5 >> 2);
                  uint8_t g8 = (g6 << 2) | (g6 >> 4);
                  uint8_t b8 = (b5 << 3) | (b5 >> 2);
                  return ((uint32_t) r8 << 16) | ((uint32_t) g8 << 8) | b8;
                };

                // SCALE is fractional now (filling the full canvas, not a clean integer multiple of 64),
                // so each source pixel maps to a variable-sized block: its screen-space bounds are found
                // by rounding both edges independently, which tiles without gaps or overlaps.
                auto blit = [&](const uint16_t *data, int sw, int sh, int32_t gx, int32_t gy) {
                  for (int sy = 0; sy < sh; sy++) {
                    int32_t by0 = OFFSET_Y + (int32_t) roundf((gy + sy) * SCALE);
                    int32_t by1 = OFFSET_Y + (int32_t) roundf((gy + sy + 1) * SCALE);
                    for (int sx = 0; sx < sw; sx++) {
                      uint16_t px = data[sy * sw + sx];
                      if (px == MASK_COLOR) continue;
                      lv_color_t color = lv_color_hex(rgb565_to_hex(px));
                      int32_t bx0 = OFFSET_X + (int32_t) roundf((gx + sx) * SCALE);
                      int32_t bx1 = OFFSET_X + (int32_t) roundf((gx + sx + 1) * SCALE);
                      for (int32_t y = by0; y < by1; y++) {
                        for (int32_t x = bx0; x < bx1; x++) {
                          lv_canvas_set_px(canvas, x, y, color, LV_OPA_COVER);
                        }
                      }
                    }
                  }
                };

                if (full_redraw) {
                  // Sky fill (whole canvas, so it extends to fill the round bezel)
                  lv_canvas_fill_bg(canvas, lv_color_hex(rgb565_to_hex(MASK_COLOR)), LV_OPA_COVER);

                  // Background scenery (static, matches the original's one-time setup() draw calls) -
                  // only needs to be painted once per style-entry, not every animation frame.
                  blit(HILL_SPRITE, 20, 22, 0, 34);
                  blit(CLOUD1_SPRITE, 13, 12, 0, 21);
                  blit(CLOUD2_SPRITE, 13, 12, 51, 7);
                  blit(BUSH_SPRITE, 21, 9, 43, 47);
                  for (int i = 0; i < 8; i++) {
                    blit(GROUND_SPRITE, 8, 8, i * 8, 56);
                  }
                } else {
                  // Animation-frame fast path: only erase the small regions Mario/the blocks can occupy
                  // (their entire travel range sits over plain sky in the original layout, so a flat
                  // sky-colored rect fill is a safe, much cheaper stand-in for a full scene redraw).
                  // This uses its own layer that's finished (flushed to the canvas buffer) immediately -
                  // lv_draw_rect only queues a draw task, it doesn't render until lv_canvas_finish_layer
                  // runs, so sharing one layer with the sprite blits below (which write immediately via
                  // lv_canvas_set_px) would let the queued erase flush AFTER the blits and wipe them out.
                  lv_layer_t erase_layer;
                  lv_canvas_init_layer(canvas, &erase_layer);
                  auto erase_rect = [&](int32_t gx, int32_t gy, int32_t gw, int32_t gh) {
                    lv_draw_rect_dsc_t erase_dsc;
                    lv_draw_rect_dsc_init(&erase_dsc);
                    erase_dsc.bg_color = lv_color_hex(rgb565_to_hex(MASK_COLOR));
                    erase_dsc.bg_opa = LV_OPA_COVER;
                    erase_dsc.border_opa = LV_OPA_TRANSP;
                    int32_t bx0 = OFFSET_X + (int32_t) roundf(gx * SCALE);
                    int32_t bx1 = OFFSET_X + (int32_t) roundf((gx + gw) * SCALE);
                    int32_t by0 = OFFSET_Y + (int32_t) roundf(gy * SCALE);
                    int32_t by1 = OFFSET_Y + (int32_t) roundf((gy + gh) * SCALE);
                    lv_area_t area = {bx0, by0, bx1 - 1, by1 - 1};
                    lv_draw_rect(&erase_layer, &erase_dsc, &area);
                  };
                  erase_rect(23, 25, 17, 31);
                  erase_rect(13, 7, 19, 23);
                  erase_rect(32, 7, 19, 23);
                  lv_canvas_finish_layer(canvas, &erase_layer);
                }

                // Blocks (hour/minute), each with its own current bounce offset
                blit(BLOCK_SPRITE, 19, 19, 13, 11 + id(hourblock_offset));
                blit(BLOCK_SPRITE, 19, 19, 32, 11 + id(minuteblock_offset));

                // Mario, idle or jumping sprite depending on current animation state
                if (id(mario_anim_active)) {
                  blit(MARIO_JUMP_SPRITE, 17, 16, 23, 40 + id(mario_y_offset));
                } else {
                  blit(MARIO_IDLE_SPRITE, 13, 16, 23, 40);
                }

                // Hour/minute digits, drawn on top of each block (matches the source's black text over the block sprite).
                // The source displays 24-hour, non-zero-padded hour (e.g. "22:39"), zero-padded minute.
                // The displayed value is only ever refreshed at the moment a block is actually hit (see
                // mario_jump_animate's collision checks) or when first entering the style - not read live
                // every frame - so the digits change exactly when the bounce happens, not the instant the
                // jump starts.
                if (full_redraw) {
                  auto boot_t = id(homeassistant_time).now();
                  if (boot_t.is_valid()) {
                    id(mario_displayed_hour) = boot_t.hour;
                    id(mario_displayed_minute) = boot_t.minute;
                  }
                }
                int hh24 = id(mario_displayed_hour);
                int mm = id(mario_displayed_minute);
                int display_hour = hh24;
                if (id(clock_12h_format).state) {
                  display_hour = hh24 % 12;
                  if (display_hour == 0) display_hour = 12;
                }
                char hbuf[4];
                char mbuf[4];
                snprintf(hbuf, sizeof(hbuf), "%d", display_hour);
                snprintf(mbuf, sizeof(mbuf), "%02d", mm);

                lv_layer_t layer;
                lv_canvas_init_layer(canvas, &layer);

                lv_draw_label_dsc_t digit_dsc;
                lv_draw_label_dsc_init(&digit_dsc);
                digit_dsc.color = lv_color_hex(0x000000);
                digit_dsc.font = id(font_mario_digits)->get_lv_font();
                digit_dsc.align = LV_TEXT_ALIGN_CENTER;
                digit_dsc.text_local = true;

                // lv_draw_label only centers horizontally (align: LEFT/RIGHT/CENTER) - it top-aligns
                // vertically within whatever area is given, so the area height must tightly match the
                // font's actual rendered height or the text lands above center instead of on it.
                const int32_t font_h = id(font_mario_digits)->get_height();

                const int32_t label_half_w = (int32_t) roundf(SCALE * 10.0f);

                digit_dsc.text = hbuf;
                int32_t hour_cx = OFFSET_X + (int32_t) roundf((13 + 9) * SCALE);
                int32_t hour_cy = OFFSET_Y + (int32_t) roundf((11 + id(hourblock_offset) + 9) * SCALE);
                lv_area_t hour_area = {hour_cx - label_half_w, hour_cy - font_h / 2, hour_cx + label_half_w, hour_cy - font_h / 2 + font_h};
                lv_draw_label(&layer, &digit_dsc, &hour_area);

                digit_dsc.text = mbuf;
                int32_t minute_cx = OFFSET_X + (int32_t) roundf((32 + 9) * SCALE);
                int32_t minute_cy = OFFSET_Y + (int32_t) roundf((11 + id(minuteblock_offset) + 9) * SCALE);
                lv_area_t minute_area = {minute_cx - label_half_w, minute_cy - font_h / 2, minute_cx + label_half_w, minute_cy - font_h / 2 + font_h};
                lv_draw_label(&layer, &digit_dsc, &minute_area);

                lv_canvas_finish_layer(canvas, &layer);
                lv_display_enable_invalidation(mario_disp, true);
                lv_obj_invalidate(canvas);

  - id: mario_clock_tick
    mode: restart
    then:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_mario};'
              - lambda: 'return !id(mario_anim_active);'
              - lambda: |-
                  auto t = id(homeassistant_time).now();
                  return t.is_valid() && t.second == 0 && t.minute != id(mario_last_minute);
          then:
            - script.execute: mario_jump_animate

  - id: mario_jump_animate
    mode: restart
    then:
      - lambda: |-
          id(mario_anim_active) = true;
          auto t = id(homeassistant_time).now();
          if (t.is_valid()) id(mario_last_minute) = t.minute;
          id(mario_y_offset) = 0;
          id(mario_direction_up) = true;
          id(hourblock_offset) = 0;
          id(hourblock_bouncing) = false;
          id(hourblock_going_up) = true;
          id(minuteblock_offset) = 0;
          id(minuteblock_bouncing) = false;
          id(minuteblock_going_up) = true;
      - while:
          condition:
            lambda: 'return id(mario_anim_active);'
          then:
            - lambda: |-
                const int MARIO_PACE = 5;
                const int MARIO_JUMP_HEIGHT = 14;
                const int MOVE_PACE = 2;
                const int MAX_MOVE_HEIGHT = 4;

                if (id(mario_direction_up)) {
                  id(mario_y_offset) -= MARIO_PACE;
                  if (-id(mario_y_offset) >= MARIO_JUMP_HEIGHT) {
                    id(mario_direction_up) = false;
                  }
                } else {
                  id(mario_y_offset) += MARIO_PACE;
                }

                const int mario_x = 23, mario_w = 17, mario_h = 16;
                const int mario_y = 40 + id(mario_y_offset);

                auto overlaps = [&](int bx, int by, int bw, int bh) {
                  return mario_x < bx + bw && mario_x + mario_w > bx &&
                         mario_y < by + bh && mario_y + mario_h > by;
                };

                if (!id(hourblock_bouncing) && overlaps(13, 11 + id(hourblock_offset), 19, 19)) {
                  id(hourblock_bouncing) = true;
                  id(hourblock_going_up) = true;
                  id(mario_direction_up) = false;
                  auto hit_t = id(homeassistant_time).now();
                  if (hit_t.is_valid()) {
                    id(mario_displayed_hour) = hit_t.hour;
                    id(mario_displayed_minute) = hit_t.minute;
                  }
                }
                if (id(hourblock_bouncing)) {
                  if (id(hourblock_going_up)) {
                    id(hourblock_offset) -= MOVE_PACE;
                    if (id(hourblock_offset) <= -MAX_MOVE_HEIGHT) {
                      id(hourblock_offset) = -MAX_MOVE_HEIGHT;
                      id(hourblock_going_up) = false;
                    }
                  } else {
                    id(hourblock_offset) += MOVE_PACE;
                    if (id(hourblock_offset) >= 0) {
                      id(hourblock_offset) = 0;
                      id(hourblock_bouncing) = false;
                    }
                  }
                }

                if (!id(minuteblock_bouncing) && overlaps(32, 11 + id(minuteblock_offset), 19, 19)) {
                  id(minuteblock_bouncing) = true;
                  id(minuteblock_going_up) = true;
                  id(mario_direction_up) = false;
                  auto hit_t2 = id(homeassistant_time).now();
                  if (hit_t2.is_valid()) {
                    id(mario_displayed_hour) = hit_t2.hour;
                    id(mario_displayed_minute) = hit_t2.minute;
                  }
                }
                if (id(minuteblock_bouncing)) {
                  if (id(minuteblock_going_up)) {
                    id(minuteblock_offset) -= MOVE_PACE;
                    if (id(minuteblock_offset) <= -MAX_MOVE_HEIGHT) {
                      id(minuteblock_offset) = -MAX_MOVE_HEIGHT;
                      id(minuteblock_going_up) = false;
                    }
                  } else {
                    id(minuteblock_offset) += MOVE_PACE;
                    if (id(minuteblock_offset) >= 0) {
                      id(minuteblock_offset) = 0;
                      id(minuteblock_bouncing) = false;
                    }
                  }
                }

                if (mario_y + mario_h >= 56) {
                  id(mario_y_offset) = 0;
                  id(mario_anim_active) = false;
                }
            - script.execute:
                id: mario_draw_scene
                full_redraw: false
            - delay: 25ms
      - script.execute:
          id: mario_draw_scene
          full_redraw: false

  - id: set_ui_phase
    mode: restart
    parameters:
      phase: int
    then:
      - script.stop: player_controls_timeout
      - script.stop: pulldown_timeout
      - lambda: |-
          id(ui_phase) = phase;
      - script.execute: standby_screen_activity
      - if:
          condition:
            lambda: 'return phase == ${ui_phase_standby};'
          then:
            - lvgl.page.show: idle_page
            - component.update: weather_line
      - if:
          condition:
            lambda: 'return phase == ${ui_phase_player_controls};'
          then:
            - lvgl.page.show: player_controls_page
            - script.execute: player_controls_timeout
      - if:
          condition:
            lambda: 'return phase == ${ui_phase_now_playing};'
          then:
            - lvgl.page.show: sendspin_page
      - if:
          condition:
            lambda: 'return phase == ${ui_phase_playlist_menu};'
          then:
            - lvgl.page.show: playlist_menu_page
            - script.execute: player_controls_timeout
      - if:
          condition:
            lambda: 'return phase == ${ui_phase_pulldown};'
          then:
            - lvgl.page.show: pulldown_page
            - script.execute: refresh_pulldown_states
            - script.execute: pulldown_timeout

  - id: player_controls_timeout
    mode: restart
    then:
      - delay: !lambda |-
          return (uint32_t) (id(player_controls_timeout_seconds).state * 1000.0f);
      - if:
          condition:
            media_player.is_idle: external_media_player
          then:
            - script.execute:
                id: set_ui_phase
                phase: ${ui_phase_standby}
          else:
            - script.execute:
                id: set_ui_phase
                phase: ${ui_phase_now_playing}

  - id: open_playlist_menu
    then:
      - script.stop: player_controls_timeout
      - lambda: |-
          id(ui_phase) = ${ui_phase_playlist_menu};
      - lvgl.page.show:
          id: playlist_menu_page
          animation: MOVE_BOTTOM
          time: 160ms
      - script.execute: player_controls_timeout

  - id: close_playlist_menu
    then:
      - script.stop: player_controls_timeout
      - lambda: |-
          id(ui_phase) = ${ui_phase_player_controls};
      - lvgl.page.show:
          id: player_controls_page
          animation: MOVE_TOP
          time: 160ms
      - script.execute: player_controls_timeout

  - id: refresh_playlist_labels
    mode: restart
    then:
      - lvgl.label.update:
          id: playlist_1_label
          text: !lambda return id(playlist_1_name).state;
      - lvgl.label.update:
          id: playlist_2_label
          text: !lambda return id(playlist_2_name).state;
      - lvgl.label.update:
          id: playlist_3_label
          text: !lambda return id(playlist_3_name).state;
      - lvgl.label.update:
          id: playlist_4_label
          text: !lambda return id(playlist_4_name).state;
      - lvgl.label.update:
          id: playlist_5_label
          text: !lambda return id(playlist_5_name).state;
      - lvgl.label.update:
          id: playlist_6_label
          text: !lambda return id(playlist_6_name).state;

  - id: refresh_pulldown_labels
    mode: restart
    then:
      - lvgl.label.update:
          id: pulldown1_button_label
          text: !lambda return id(pulldown1_label).state;
      - lvgl.label.update:
          id: pulldown2_button_label
          text: !lambda return id(pulldown2_label).state;
      - lvgl.label.update:
          id: pulldown3_button_label
          text: !lambda return id(pulldown3_label).state;
      - lvgl.label.update:
          id: pulldown4_button_label
          text: !lambda return id(pulldown4_label).state;

  - id: refresh_pulldown_states
    then:
      - lambda: |-
          const uint32_t accent_u32 = ((uint32_t) id(accent_red) << 16) | ((uint32_t) id(accent_green) << 8) | (uint32_t) id(accent_blue);
          const lv_color_t accent = lv_color_hex(accent_u32);
          const uint32_t accent2_u32 = ((uint32_t) id(accent2_red) << 16) | ((uint32_t) id(accent2_green) << 8) | (uint32_t) id(accent2_blue);
          const lv_color_t accent2 = lv_color_hex(accent2_u32);
          auto apply_button = [&](lv_obj_t *btn, lv_obj_t *label, bool on) {
            if (on) {
              lv_obj_set_style_bg_color(btn, accent, 0);
              lv_obj_set_style_bg_opa(btn, LV_OPA_COVER, 0);
            } else {
              lv_obj_set_style_bg_opa(btn, LV_OPA_TRANSP, 0);
            }
            lv_obj_set_style_border_color(btn, accent, 0);
            lv_obj_set_style_text_color(label, accent2, 0);
          };
          apply_button(id(pulldown1_button), id(pulldown1_button_label), id(pulldown1_state).state);
          apply_button(id(pulldown2_button), id(pulldown2_button_label), id(pulldown2_state).state);
          apply_button(id(pulldown3_button), id(pulldown3_button_label), id(pulldown3_state).state);
          apply_button(id(pulldown4_button), id(pulldown4_button_label), id(pulldown4_state).state);

  - id: open_pulldown_menu
    then:
      - script.stop: player_controls_timeout
      - script.stop: pulldown_timeout
      - lambda: |-
          id(ui_phase) = ${ui_phase_pulldown};
      - script.execute: standby_screen_activity
      - lvgl.page.show:
          id: pulldown_page
          animation: MOVE_BOTTOM
          time: 220ms
      - script.execute: refresh_pulldown_states
      - script.execute: pulldown_timeout

  - id: close_pulldown_menu
    then:
      - script.stop: pulldown_timeout
      - lambda: |-
          id(ui_phase) = ${ui_phase_standby};
      - script.execute: standby_screen_activity
      - lvgl.page.show:
          id: idle_page
          animation: MOVE_TOP
          time: 220ms
      - component.update: weather_line

  - id: pulldown_timeout
    mode: restart
    then:
      - delay: 6s
      - script.execute: close_pulldown_menu

  - id: play_playlist
    parameters:
      uri: string
    then:
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected) && !id(playlist_media_player_entity).state.empty() && !uri.empty();'
          then:
            - homeassistant.action:
                action: media_player.play_media
                data:
                  media_content_type: music
                data_template:
                  entity_id: "{{ media_player_entity }}"
                  media_content_id: "{{ media_url }}"
                variables:
                  media_player_entity: |-
                    return id(playlist_media_player_entity).state;
                  media_url: |-
                    return uri;

  - id: load_standby_background
    mode: restart
    then:
      - online_image.set_url:
          id: standby_background_image
          url: !lambda |-
            return "https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/Other/360x360/" + id(standby_background_choice).current_option().str() + ".png";

  - id: standby_screen_activity
    mode: restart
    then:
      - script.stop: standby_screen_timeout
      - if:
          condition:
            lambda: 'return id(screen_timeout_dimmed);'
          then:
            - light.turn_on:
                id: Sled
                brightness: !lambda 'return id(preferred_screen_brightness);'
            - lambda: |-
                id(screen_timeout_dimmed) = false;
      - if:
          condition:
            and:
              - switch.is_on: standby_screen_timeout_enabled
              - lambda: 'return id(ui_phase) == ${ui_phase_standby};'
          then:
            - script.execute: standby_screen_timeout

  - id: standby_screen_timeout
    mode: restart
    then:
      - delay: !lambda |-
          return (uint32_t) (id(standby_screen_timeout_seconds).state * 1000.0f / 3.0f);
      - if:
          condition:
            and:
              - switch.is_on: standby_screen_timeout_enabled
              - lambda: 'return id(ui_phase) == ${ui_phase_standby};'
          then:
            - lambda: |-
                id(preferred_screen_brightness) = id(Sled).remote_values.get_brightness();
                id(screen_timeout_dimmed) = true;
            - light.turn_on:
                id: Sled
                brightness: !lambda 'return id(preferred_screen_brightness) * 0.60f;'
          else:
            - script.stop: standby_screen_timeout
      - delay: !lambda |-
          return (uint32_t) (id(standby_screen_timeout_seconds).state * 1000.0f / 3.0f);
      - if:
          condition:
            and:
              - switch.is_on: standby_screen_timeout_enabled
              - lambda: 'return id(ui_phase) == ${ui_phase_standby};'
          then:
            - light.turn_on:
                id: Sled
                brightness: !lambda 'return id(preferred_screen_brightness) * 0.25f;'
          else:
            - script.stop: standby_screen_timeout
      - delay: !lambda |-
          return (uint32_t) (id(standby_screen_timeout_seconds).state * 1000.0f / 3.0f);
      - if:
          condition:
            and:
              - switch.is_on: standby_screen_timeout_enabled
              - lambda: 'return id(ui_phase) == ${ui_phase_standby};'
          then:
            - light.turn_off: Sled

  - id: now_playing_swipe_left
    then:
      - script.execute:
          id: album_art_slide
          direction: -1
      - media_player.next: sendspin_group_media_player

  - id: now_playing_swipe_right
    then:
      - script.execute:
          id: album_art_slide
          direction: 1
      - script.execute: media_player_previous_with_restart_check

  - id: player_controls_keep_open
    then:
      - script.execute:
          id: set_ui_phase
          phase: ${ui_phase_player_controls}

  - id: player_controls_toggle
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.toggle: sendspin_group_media_player
            - script.execute: player_controls_keep_open

  - id: player_controls_previous
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - script.execute: media_player_previous_with_restart_check
            - script.execute: player_controls_keep_open

  - id: player_controls_next
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.next: sendspin_group_media_player
            - script.execute: player_controls_keep_open

  - id: player_controls_volume_down
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.volume_down: external_media_player
            - script.execute: show_volume_ring
            - script.execute: player_controls_keep_open

  - id: player_controls_volume_up
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.volume_up: external_media_player
            - script.execute: show_volume_ring
            - script.execute: player_controls_keep_open

  - id: player_controls_mute
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.mute: external_media_player
            - script.execute: player_controls_keep_open

  - id: show_volume_ring
    mode: restart
    then:
      - script.stop: hide_volume_ring
      - lambda: |-
          if (id(volume_ring_overlay) == nullptr) {
            id(volume_ring_overlay) = lv_obj_create(lv_layer_top());
            lv_obj_remove_style_all(id(volume_ring_overlay));
            lv_obj_set_size(id(volume_ring_overlay), 150, 150);
            lv_obj_center(id(volume_ring_overlay));
            lv_obj_set_style_bg_color(id(volume_ring_overlay), lv_color_hex(0x000000), 0);
            lv_obj_set_style_bg_opa(id(volume_ring_overlay), 230, 0);
            lv_obj_set_style_border_width(id(volume_ring_overlay), 3, 0);
            lv_obj_set_style_radius(id(volume_ring_overlay), LV_RADIUS_CIRCLE, 0);
            lv_obj_clear_flag(id(volume_ring_overlay), LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(id(volume_ring_overlay), LV_OBJ_FLAG_SCROLLABLE);

            id(volume_ring_label) = lv_label_create(id(volume_ring_overlay));
            lv_obj_set_width(id(volume_ring_label), 130);
            lv_obj_center(id(volume_ring_label));
            lv_obj_set_style_text_align(id(volume_ring_label), LV_TEXT_ALIGN_CENTER, 0);
            lv_obj_set_style_text_font(id(volume_ring_label), id(font_7seg), 0);
          }

          const float volume = std::max(0.0f, std::min(1.0f, id(external_media_player).volume));
          const int pct = (int) lroundf(volume * 100.0f);
          const uint32_t accent_u32 = ((uint32_t) id(accent_red) << 16) | ((uint32_t) id(accent_green) << 8) | (uint32_t) id(accent_blue);
          const lv_color_t accent = lv_color_hex(accent_u32);
          const uint32_t accent4_u32 = ((uint32_t) id(accent4_red) << 16) | ((uint32_t) id(accent4_green) << 8) | (uint32_t) id(accent4_blue);
          const lv_color_t accent4 = lv_color_hex(accent4_u32);
          lv_obj_set_style_border_color(id(volume_ring_overlay), accent, 0);
          lv_obj_set_style_text_color(id(volume_ring_label), accent4, 0);
          char text[8];
          snprintf(text, sizeof(text), "%d", pct);
          lv_label_set_text(id(volume_ring_label), text);
          lv_obj_set_style_opa(id(volume_ring_overlay), LV_OPA_COVER, 0);
          lv_obj_clear_flag(id(volume_ring_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(volume_ring_overlay));
      - script.execute: hide_volume_ring

  - id: hide_volume_ring
    mode: restart
    then:
      - delay: 900ms
      - lambda: |-
          if (id(volume_ring_overlay) == nullptr) return;
          lv_anim_del(id(volume_ring_overlay), nullptr);
          lv_anim_t fade;
          lv_anim_init(&fade);
          lv_anim_set_var(&fade, id(volume_ring_overlay));
          lv_anim_set_values(&fade, LV_OPA_COVER, LV_OPA_TRANSP);
          lv_anim_set_time(&fade, 260);
          lv_anim_set_exec_cb(&fade, [](void *obj, int32_t opacity) {
            lv_obj_set_style_opa((lv_obj_t *) obj, opacity, 0);
          });
          lv_anim_start(&fade);
      - delay: 280ms
      - lambda: |-
          if (id(volume_ring_overlay) != nullptr) {
            lv_obj_add_flag(id(volume_ring_overlay), LV_OBJ_FLAG_HIDDEN);
          }

  - id: album_art_slide
    mode: restart
    parameters:
      direction: int
    then:
      - lvgl.animation.stop: album_art_crossfade
      - lambda: |-
          id(album_art_slide_active) = true;
          id(sendspin_album_art_valid) = false;
          id(last_album_art_valid) = false;
          lv_obj_t *outgoing = id(slide_outgoing_art);
          lv_obj_t *incoming = id(slide_incoming_art);
          lv_anim_del(outgoing, nullptr);
          lv_anim_del(incoming, nullptr);
          lv_img_set_src(outgoing, lv_img_get_src(id(incoming_art)));
          lv_img_set_zoom(outgoing, LV_ZOOM_NONE);
          lv_img_set_src(incoming, id(fallback_playing_image));
          lv_img_set_zoom(incoming, LV_ZOOM_NONE);
          lv_obj_set_x(outgoing, 0);
          lv_obj_set_x(incoming, -direction * ${screenwidth});
          lv_obj_clear_flag(outgoing, LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(incoming, LV_OBJ_FLAG_HIDDEN);

          lv_anim_t current_slide;
          lv_anim_init(&current_slide);
          lv_anim_set_var(&current_slide, outgoing);
          lv_anim_set_values(&current_slide, 0, direction * ${screenwidth});
          lv_anim_set_time(&current_slide, 300);
          lv_anim_set_exec_cb(&current_slide, [](void *obj, int32_t x) {
            lv_obj_set_x((lv_obj_t *) obj, x);
          });
          lv_anim_start(&current_slide);

          lv_anim_t incoming_slide;
          lv_anim_init(&incoming_slide);
          lv_anim_set_var(&incoming_slide, incoming);
          lv_anim_set_values(&incoming_slide, -direction * ${screenwidth}, 0);
          lv_anim_set_time(&incoming_slide, 300);
          lv_anim_set_exec_cb(&incoming_slide, [](void *obj, int32_t x) {
            lv_obj_set_x((lv_obj_t *) obj, x);
          });
          lv_anim_start(&incoming_slide);
      - delay: 300ms
      - lambda: |-
          lv_obj_add_flag(id(slide_outgoing_art), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(slide_incoming_art), LV_OBJ_FLAG_HIDDEN);
          lv_img_set_src(id(incoming_art), id(fallback_playing_image));
          lv_img_set_zoom(id(incoming_art), LV_ZOOM_NONE);
          id(album_art_slide_active) = false;
          id(album_art_awaiting_swipe_art) = true;

  - id: refresh_artist_art_dot
    then:
      - lambda: |-
          if (id(artist_art_valid) && !id(now_playing_art_mode)) {
            lv_obj_clear_flag(id(artist_art_dot), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(artist_art_dot), LV_OBJ_FLAG_HIDDEN);
          }

  - id: now_playing_show_artist_art
    mode: restart
    then:
      - lvgl.animation.stop: album_art_crossfade
      - lambda: |-
          lv_obj_set_style_opa(id(outgoing_art), LV_OPA_TRANSP, 0);
          lv_obj_t *outgoing = id(slide_outgoing_art);
          lv_obj_t *incoming = id(slide_incoming_art);
          lv_anim_del(outgoing, nullptr);
          lv_anim_del(incoming, nullptr);
          lv_img_set_src(outgoing, lv_img_get_src(id(incoming_art)));
          lv_img_set_zoom(outgoing, LV_ZOOM_NONE);
          lv_img_set_src(incoming, id(artist_art)->get_lv_image_dsc());
          lv_img_set_zoom(incoming, LV_ZOOM_NONE);
          lv_obj_set_x(outgoing, 0);
          lv_obj_set_x(incoming, 0);
          lv_obj_set_y(outgoing, 0);
          lv_obj_set_y(incoming, -${screenheight});
          lv_obj_clear_flag(outgoing, LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(incoming, LV_OBJ_FLAG_HIDDEN);

          lv_anim_t current_slide;
          lv_anim_init(&current_slide);
          lv_anim_set_var(&current_slide, outgoing);
          lv_anim_set_values(&current_slide, 0, ${screenheight});
          lv_anim_set_time(&current_slide, 300);
          lv_anim_set_exec_cb(&current_slide, [](void *obj, int32_t y) {
            lv_obj_set_y((lv_obj_t *) obj, y);
          });
          lv_anim_start(&current_slide);

          lv_anim_t incoming_slide;
          lv_anim_init(&incoming_slide);
          lv_anim_set_var(&incoming_slide, incoming);
          lv_anim_set_values(&incoming_slide, -${screenheight}, 0);
          lv_anim_set_time(&incoming_slide, 300);
          lv_anim_set_exec_cb(&incoming_slide, [](void *obj, int32_t y) {
            lv_obj_set_y((lv_obj_t *) obj, y);
          });
          lv_anim_start(&incoming_slide);
          id(now_playing_art_mode) = true;
          id(refresh_artist_art_dot)->execute();
      - delay: 300ms
      - lambda: |-
          lv_obj_add_flag(id(slide_outgoing_art), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(slide_incoming_art), LV_OBJ_FLAG_HIDDEN);
          lv_img_set_src(id(incoming_art), id(artist_art)->get_lv_image_dsc());
          lv_img_set_zoom(id(incoming_art), LV_ZOOM_NONE);

  - id: now_playing_show_album_art
    mode: restart
    then:
      - lvgl.animation.stop: album_art_crossfade
      - lambda: |-
          lv_obj_set_style_opa(id(outgoing_art), LV_OPA_TRANSP, 0);
          lv_obj_t *outgoing = id(slide_outgoing_art);
          lv_obj_t *incoming = id(slide_incoming_art);
          lv_anim_del(outgoing, nullptr);
          lv_anim_del(incoming, nullptr);
          lv_img_set_src(outgoing, lv_img_get_src(id(incoming_art)));
          lv_img_set_zoom(outgoing, LV_ZOOM_NONE);
          lv_img_set_src(incoming, id(sendspin_album_art_valid) ? id(sendspin_album_art)->get_lv_image_dsc() : id(fallback_playing_image)->get_lv_image_dsc());
          lv_img_set_zoom(incoming, LV_ZOOM_NONE);
          lv_obj_set_x(outgoing, 0);
          lv_obj_set_x(incoming, 0);
          lv_obj_set_y(outgoing, 0);
          lv_obj_set_y(incoming, ${screenheight});
          lv_obj_clear_flag(outgoing, LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(incoming, LV_OBJ_FLAG_HIDDEN);

          lv_anim_t current_slide;
          lv_anim_init(&current_slide);
          lv_anim_set_var(&current_slide, outgoing);
          lv_anim_set_values(&current_slide, 0, -${screenheight});
          lv_anim_set_time(&current_slide, 300);
          lv_anim_set_exec_cb(&current_slide, [](void *obj, int32_t y) {
            lv_obj_set_y((lv_obj_t *) obj, y);
          });
          lv_anim_start(&current_slide);

          lv_anim_t incoming_slide;
          lv_anim_init(&incoming_slide);
          lv_anim_set_var(&incoming_slide, incoming);
          lv_anim_set_values(&incoming_slide, ${screenheight}, 0);
          lv_anim_set_time(&incoming_slide, 300);
          lv_anim_set_exec_cb(&incoming_slide, [](void *obj, int32_t y) {
            lv_obj_set_y((lv_obj_t *) obj, y);
          });
          lv_anim_start(&incoming_slide);
          id(now_playing_art_mode) = false;
          id(refresh_artist_art_dot)->execute();
      - delay: 300ms
      - lambda: |-
          lv_obj_add_flag(id(slide_outgoing_art), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(slide_incoming_art), LV_OBJ_FLAG_HIDDEN);
          lv_img_set_src(id(incoming_art), id(sendspin_album_art_valid) ? id(sendspin_album_art)->get_lv_image_dsc() : id(fallback_playing_image)->get_lv_image_dsc());
          lv_img_set_zoom(id(incoming_art), LV_ZOOM_NONE);

  - id: media_player_previous_with_restart_check
    then:
      - lambda: |-
          id(pre_previous_swipe_title) = id(sendspin_title).state;
      - media_player.previous: sendspin_group_media_player
      - script.execute: restore_art_if_same_title

  - id: restore_art_if_same_title
    mode: restart
    then:
      - delay: 1200ms
      - if:
          condition:
            lambda: 'return id(sendspin_title).state == id(pre_previous_swipe_title);'
          then:
            - lambda: |-
                id(sendspin_album_art_valid) = true;
                id(album_art_awaiting_swipe_art) = false;
            - script.execute: album_art_crossfade_apply

  - id: album_art_crossfade_apply
    mode: restart
    then:
      - lambda: |-
          id(now_playing_art_mode) = false;
          id(refresh_artist_art_dot)->execute();
      - if:
          condition:
            lambda: 'return id(last_album_art_valid);'
          then:
            - lvgl.image.update:
                id: outgoing_art
                src: sendspin_album_art_transition
          else:
            - lvgl.image.update:
                id: outgoing_art
                src: fallback_playing_image
      - lvgl.image.update:
          id: incoming_art
          src: sendspin_album_art
      - lvgl.animation.start: album_art_crossfade

  - id: album_art_show_fallback
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(album_art_slide_active);'
          then:
            - if:
                condition:
                  lambda: 'return id(last_album_art_valid);'
                then:
                  - lvgl.image.update:
                      id: outgoing_art
                      src: sendspin_album_art_transition
                else:
                  - lvgl.image.update:
                      id: outgoing_art
                      src: fallback_playing_image
            - lvgl.image.update:
                id: incoming_art
                src: fallback_playing_image
            - lvgl.animation.start: album_art_crossfade
            - lvgl.image.update:
                id: controls_album_art_widget
                src: fallback_playing_image
            - lvgl.image.update:
                id: playlist_album_art_widget
                src: fallback_playing_image


  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: 'return sound_file == "ready_sound";'
          then:
            - lambda: 'id(boot_announce_active) = true;'

      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true

      - lambda: |-
          if ((id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }

