http_request:

switch:
  - platform: gpio
    name: Speaker Enable
    icon: "mdi:speaker"
    entity_category: config
    pin: GPIO48
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: startup_sound_switch
    name: Startup sound
    icon: "mdi:card-text-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: standby_screen_timeout_enabled
    name: Standby screen timeout
    icon: "mdi:monitor-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: standby_screen_activity
    on_turn_off:
      - script.execute: standby_screen_activity

  - platform: template
    id: standby_background_enabled
    name: Standby clock background
    icon: "mdi:image-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: load_standby_background
    on_turn_off:
      - lambda: |-
          lv_obj_add_flag(id(standby_background_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(pulldown_background_widget), LV_OBJ_FLAG_HIDDEN);
      - online_image.release: standby_background_image

  - platform: template
    id: clock_12h_format
    name: 12-Hour Clock
    icon: "mdi:clock-time-four-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - component.update: clock_hms
      - script.execute: retro_clock_redraw
      - script.execute:
          id: mario_draw_scene
          full_redraw: true
    on_turn_off:
      - component.update: clock_hms
      - script.execute: retro_clock_redraw
      - script.execute:
          id: mario_draw_scene
          full_redraw: true

  - platform: template
    id: clock_show_date
    name: Show Date
    icon: "mdi:calendar-blank-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_digital};'
          then:
            - lvgl.widget.show: date_label
      - script.execute: analog_clock_redraw
    on_turn_off:
      - lvgl.widget.hide: date_label
      - script.execute: analog_clock_redraw

  - platform: template
    id: clock_show_seconds
    name: Show Seconds
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - component.update: clock_hms
      - script.execute: analog_clock_redraw
      - script.execute: retro_clock_redraw
    on_turn_off:
      - component.update: clock_hms
      - script.execute: analog_clock_redraw
      - script.execute: retro_clock_redraw

  - platform: template
    id: clock_show_gfx
    name: Show GFX
    icon: "mdi:radar"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: analog_clock_redraw
    on_turn_off:
      - script.execute: analog_clock_redraw

  - platform: template
    id: clock_show_weather
    name: Show Weather
    icon: "mdi:weather-partly-cloudy"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - component.update: weather_line
    on_turn_off:
      - component.update: weather_line

  - platform: template
    id: clock_show_feels_like
    name: Show Feels Like
    icon: "mdi:thermometer-lines"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - component.update: weather_line
    on_turn_off:
      - component.update: weather_line

number:
  - platform: template
    id: player_controls_timeout_seconds
    name: Player controls timeout delay
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    mode: box
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    set_action:
      - if:
          condition:
            lambda: 'return id(ui_phase) == ${ui_phase_player_controls};'
          then:
            - script.execute: player_controls_timeout

  - platform: template
    id: standby_screen_timeout_seconds
    name: Standby screen timeout delay
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    mode: box
    min_value: 15
    max_value: 3600
    step: 5
    initial_value: 60
    set_action:
      - script.execute: standby_screen_activity

select:
  - platform: template
    id: clock_style_choice
    name: Clock Style
    icon: "mdi:clock-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Digital Clock
    options:
      - Digital Clock
      - Analog Clock
      - Rooms
      - Retro
      - Mario
    set_action:
      - script.execute:
          id: apply_clock_style
          style_mode: !lambda |-
            if (x == "Analog Clock") return ${clock_style_analog};
            if (x == "Rooms") return ${clock_style_rooms};
            if (x == "Retro") return ${clock_style_retro};
            if (x == "Mario") return ${clock_style_mario};
            return ${clock_style_digital};

  - platform: template
    id: accent_color_preset
    name: Accent color preset
    icon: "mdi:palette"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Pitch Black
    options:
      - Pitch Black
      - Burning Red
      - Cyber Blue
    set_action:
      - if:
          condition:
            lambda: return x == "Pitch Black";
          then:
            - light.turn_on:
                id: accent_color_picker
                brightness: 100%
                red: 100%
                green: 100%
                blue: 0%
            - light.turn_on:
                id: accent_color_picker_2
                brightness: 100%
                red: 100%
                green: 100%
                blue: 100%
            - light.turn_on:
                id: accent_color_picker_3
                brightness: 100%
                red: 40%
                green: 80%
                blue: 100%
            - light.turn_on:
                id: accent_color_picker_4
                brightness: 100%
                red: 100%
                green: 100%
                blue: 100%
      - if:
          condition:
            lambda: return x == "Burning Red";
          then:
            - light.turn_on:
                id: accent_color_picker
                brightness: 100%
                red: 100%
                green: 0%
                blue: 0%
            - light.turn_on:
                id: accent_color_picker_2
                brightness: 100%
                red: 100%
                green: 100%
                blue: 0%
            - light.turn_on:
                id: accent_color_picker_3
                brightness: 100%
                red: 100%
                green: 100%
                blue: 100%
            - light.turn_on:
                id: accent_color_picker_4
                brightness: 100%
                red: 100%
                green: 100%
                blue: 100%
      - if:
          condition:
            lambda: return x == "Cyber Blue";
          then:
            - light.turn_on:
                id: accent_color_picker
                brightness: 100%
                red: 40%
                green: 80%
                blue: 100%
            - light.turn_on:
                id: accent_color_picker_2
                brightness: 100%
                red: 0%
                green: 100%
                blue: 40%
            - light.turn_on:
                id: accent_color_picker_3
                brightness: 100%
                red: 100%
                green: 100%
                blue: 0%
            - light.turn_on:
                id: accent_color_picker_4
                brightness: 100%
                red: 100%
                green: 100%
                blue: 100%

  - platform: template
    id: standby_background_choice
    name: Standby clock background image
    icon: "mdi:image-multiple-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: clock
    options:
      - chip
      - clock
      - hacker
      - mission
      - neonwaves
      - redmarble
      - starrysky
      - tron
      - waterdrops
      - waves
    set_action:
      - script.execute: standby_screen_activity
      - if:
          condition:
            switch.is_on: standby_background_enabled
          then:
            - online_image.set_url:
                id: standby_background_image
                url: !lambda |-
                  return "https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/Other/360x360/" + x + ".png";

text:
  - platform: template
    id: playlist_media_player_entity
    name: Playlist media player entity
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    mode: text
  - platform: template
    id: playlist_1_name
    name: Playlist 1 name
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: My playlist 1
    mode: text
    on_value:
      - script.execute: refresh_playlist_labels
  - platform: template
    id: playlist_1_uri
    name: Playlist 1 URI
    entity_category: config
