script:
  - id: apply_accent_color_debounced
    mode: restart
    then:
      - delay: 40ms
      - script.execute: apply_accent_color

  - id: apply_accent_color
    mode: restart
    then:
      - lambda: |-
          const int r = std::max(0, std::min(255, id(accent_red)));
          const int g = std::max(0, std::min(255, id(accent_green)));
          const int b = std::max(0, std::min(255, id(accent_blue)));
          const uint32_t accent_u32 = ((uint32_t) r << 16) | ((uint32_t) g << 8) | (uint32_t) b;
          const uint32_t dark_u32 = ((uint32_t) (r / 10) << 16) | ((uint32_t) (g / 10) << 8) | (uint32_t) (b / 10);
          const lv_color_t accent = lv_color_hex(accent_u32);
          const lv_color_t accent_dark = lv_color_hex(dark_u32);

          const int r2 = std::max(0, std::min(255, id(accent2_red)));
          const int g2 = std::max(0, std::min(255, id(accent2_green)));
          const int b2 = std::max(0, std::min(255, id(accent2_blue)));
          const uint32_t accent2_u32 = ((uint32_t) r2 << 16) | ((uint32_t) g2 << 8) | (uint32_t) b2;
          const lv_color_t accent2 = lv_color_hex(accent2_u32);

          const int r3 = std::max(0, std::min(255, id(accent3_red)));
          const int g3 = std::max(0, std::min(255, id(accent3_green)));
          const int b3 = std::max(0, std::min(255, id(accent3_blue)));
          const uint32_t accent3_u32 = ((uint32_t) r3 << 16) | ((uint32_t) g3 << 8) | (uint32_t) b3;
          const lv_color_t accent3 = lv_color_hex(accent3_u32);

          const int r4 = std::max(0, std::min(255, id(accent4_red)));
          const int g4 = std::max(0, std::min(255, id(accent4_green)));
          const int b4 = std::max(0, std::min(255, id(accent4_blue)));
          const uint32_t accent4_u32 = ((uint32_t) r4 << 16) | ((uint32_t) g4 << 8) | (uint32_t) b4;
          const lv_color_t accent4 = lv_color_hex(accent4_u32);

          lv_obj_set_style_text_color(id(clock_label), accent, 0);
          lv_obj_set_style_text_color(id(clock_ampm_label), accent, 0);
          lv_obj_set_style_text_color(id(weather_big_temp), accent, 0);
          lv_obj_set_style_text_color(id(weather_big_temp_unit), accent, 0);
          lv_obj_set_style_bg_color(id(controls_toggle_button), accent, 0);
          lv_obj_set_style_border_color(id(controls_toggle_button), accent, LV_STATE_PRESSED);
          lv_obj_set_style_text_color(id(date_label), accent2, 0);
          lv_obj_set_style_text_color(id(weather_icon), accent2, 0);
          lv_obj_set_style_text_color(id(weather_label), accent3, 0);
          lv_obj_set_style_text_color(id(controls_title_label), accent2, 0);
          lv_obj_set_style_text_color(id(controls_artist_label), accent3, 0);
          lv_obj_set_style_text_color(id(controls_album_label), accent3, 0);
          lv_obj_set_style_text_color(id(controls_mute_icon), accent4, 0);
          lv_obj_set_style_text_color(id(controls_volume_down_icon), accent4, 0);
          lv_obj_set_style_text_color(id(controls_volume_up_icon), accent4, 0);

          lv_obj_t *playlist_buttons[] = {
            id(playlist_1_button), id(playlist_2_button), id(playlist_3_button),
            id(playlist_4_button), id(playlist_5_button), id(playlist_6_button)
          };
          for (auto *button : playlist_buttons) {
            lv_obj_set_style_bg_color(button, accent_dark, 0);
            lv_obj_set_style_border_color(button, accent, 0);
            lv_obj_set_style_shadow_color(button, accent, 0);
            lv_obj_set_style_bg_color(button, accent, LV_STATE_PRESSED);
          }

          lv_obj_t *playlist_labels[] = {
            id(playlist_1_label), id(playlist_2_label), id(playlist_3_label),
            id(playlist_4_label), id(playlist_5_label), id(playlist_6_label)
          };
          for (auto *label : playlist_labels) {
            lv_obj_set_style_text_color(label, accent2, 0);
          }
      - script.execute: analog_clock_redraw

  - id: analog_clock_ensure_created
    then:
      - lambda: |-
          if (id(analog_clock_canvas_widget) != nullptr) return;
          const int32_t SIZE = std::min(${screenwidth}, ${screenheight});
          lv_obj_t *canvas = lv_canvas_create(id(idle_page)->obj);
          lv_draw_buf_t *buf = lv_draw_buf_create(SIZE, SIZE, LV_COLOR_FORMAT_ARGB8888, LV_STRIDE_AUTO);
          lv_canvas_set_draw_buf(canvas, buf);
          lv_obj_set_style_bg_opa(canvas, LV_OPA_TRANSP, 0);
          lv_obj_center(canvas);
          lv_obj_clear_flag(canvas, LV_OBJ_FLAG_CLICKABLE);
          lv_obj_clear_flag(canvas, LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_add_flag(canvas, LV_OBJ_FLAG_HIDDEN);
          id(analog_clock_canvas_widget) = canvas;

  - id: apply_clock_style
    mode: restart
    parameters:
      analog: bool
    then:
      - lambda: |-
          id(clock_style_is_analog) = analog;
      - if:
          condition:
            lambda: 'return analog;'
          then:
            - script.execute: analog_clock_ensure_created
            - lambda: |-
                lv_obj_add_flag(id(clock_label), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(clock_ampm_label), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(date_label), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(weather_header), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(weather_label), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(analog_clock_canvas_widget), LV_OBJ_FLAG_HIDDEN);
            - script.execute: analog_clock_redraw
          else:
            - lambda: |-
                lv_obj_clear_flag(id(clock_label), LV_OBJ_FLAG_HIDDEN);
                if (id(clock_show_date).state) {
                  lv_obj_clear_flag(id(date_label), LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(id(date_label), LV_OBJ_FLAG_HIDDEN);
                }
                if (id(analog_clock_canvas_widget) != nullptr) {
                  lv_obj_add_flag(id(analog_clock_canvas_widget), LV_OBJ_FLAG_HIDDEN);
                }
            - component.update: weather_line

  - id: analog_clock_redraw
    mode: restart
    then:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_is_analog);'
              - lambda: 'return id(analog_clock_canvas_widget) != nullptr;'
          then:
            - lambda: |-
                lv_obj_t *canvas = id(analog_clock_canvas_widget);
                const int32_t SIZE = std::min(${screenwidth}, ${screenheight});
                const int32_t CX = SIZE / 2;
                const int32_t CY = SIZE / 2;
                const int32_t R = SIZE / 2 - 10;

                lv_canvas_fill_bg(canvas, lv_color_hex(0x000000), LV_OPA_TRANSP);

                lv_layer_t layer;
                lv_canvas_init_layer(canvas, &layer);

                const uint32_t accent = ((uint32_t) id(accent_red) << 16) | ((uint32_t) id(accent_green) << 8) | (uint32_t) id(accent_blue);
                const uint32_t accent2 = ((uint32_t) id(accent2_red) << 16) | ((uint32_t) id(accent2_green) << 8) | (uint32_t) id(accent2_blue);
                const uint32_t accent3 = ((uint32_t) id(accent3_red) << 16) | ((uint32_t) id(accent3_green) << 8) | (uint32_t) id(accent3_blue);
                lv_color_t fg = lv_color_hex(accent);
                lv_color_t fg2 = lv_color_hex(accent2);
                lv_color_t fg3 = lv_color_hex(accent3);
                const bool show_seconds = id(clock_show_seconds).state;

                lv_draw_line_dsc_t line_dsc;
                lv_draw_line_dsc_init(&line_dsc);
                line_dsc.round_start = true;
                line_dsc.round_end = true;

                if (id(clock_show_gfx).state) {
                  for (int i = 0; i < 60; i++) {
                    float a = (i / 60.0f) * 6.2831853f - 1.5707963f;
                    bool major = (i % 5 == 0);
                    int32_t r_out = R;
                    int32_t r_in = major ? R - 16 : R - 8;
                    line_dsc.p1.x = CX + (int32_t) (cosf(a) * r_out);
                    line_dsc.p1.y = CY + (int32_t) (sinf(a) * r_out);
                    line_dsc.p2.x = CX + (int32_t) (cosf(a) * r_in);
                    line_dsc.p2.y = CY + (int32_t) (sinf(a) * r_in);
                    line_dsc.color = major ? fg : fg2;
                    line_dsc.width = major ? 3 : 1;
                    lv_draw_line(&layer, &line_dsc);
                  }
                }

                auto t = id(homeassistant_time).now();
                int hh = t.is_valid() ? (t.hour % 12) : 0;
                int mm = t.is_valid() ? t.minute : 0;
                int ss = t.is_valid() ? t.second : 0;

                float s_pos = ss / 60.0f;
                float m_pos = (mm + s_pos) / 60.0f;
                float h_pos = (hh + m_pos) / 12.0f;

                auto draw_hand = [&](float pos, int32_t len, int32_t width, lv_color_t color) {
                  float a = pos * 6.2831853f - 1.5707963f;
                  line_dsc.p1.x = CX;
                  line_dsc.p1.y = CY;
                  line_dsc.p2.x = CX + (int32_t) (cosf(a) * len);
                  line_dsc.p2.y = CY + (int32_t) (sinf(a) * len);
                  line_dsc.color = color;
                  line_dsc.width = width;
                  lv_draw_line(&layer, &line_dsc);
                };

                draw_hand(h_pos, (int32_t) (R * 0.5f), 6, fg3);
                draw_hand(m_pos, (int32_t) (R * 0.72f), 4, fg3);
                if (show_seconds) {
                  draw_hand(s_pos, (int32_t) (R * 0.85f), 1, fg);
                }

                lv_draw_rect_dsc_t dot_dsc;
                lv_draw_rect_dsc_init(&dot_dsc);
                dot_dsc.bg_color = fg;
                dot_dsc.bg_opa = LV_OPA_COVER;
                dot_dsc.radius = LV_RADIUS_CIRCLE;
                lv_area_t dot_area = {CX - 6, CY - 6, CX + 6, CY + 6};
                lv_draw_rect(&layer, &dot_dsc, &dot_area);

                if (id(clock_show_date).state) {
                  std::string date_str = id(clock_date).state;
                  lv_draw_label_dsc_t label_dsc;
                  lv_draw_label_dsc_init(&label_dsc);
                  label_dsc.color = fg2;
                  label_dsc.font = id(font_date)->get_lv_font();
                  label_dsc.align = LV_TEXT_ALIGN_CENTER;
                  label_dsc.text = date_str.c_str();
                  const int32_t date_y = CY + (int32_t) (R * 0.55f);
                  lv_area_t label_area = {CX - R, date_y, CX + R, date_y + 40};
                  lv_draw_label(&layer, &label_dsc, &label_area);
                }

                lv_canvas_finish_layer(canvas, &layer);
                lv_obj_invalidate(canvas);

  - id: set_ui_phase
    mode: restart
    parameters:
      phase: int
    then:
      - script.stop: player_controls_timeout
      - lambda: |-
          id(ui_phase) = phase;
      - script.execute: standby_screen_activity
      - if:
          condition:
            lambda: 'return phase == ${ui_phase_standby};'
          then:
            - lvgl.page.show: idle_page
      - if:
          condition:
            lambda: 'return phase == ${ui_phase_player_controls};'
          then:
            - lvgl.page.show: player_controls_page
            - script.execute: player_controls_timeout
      - if:
          condition:
            lambda: 'return phase == ${ui_phase_now_playing};'
          then:
            - lvgl.page.show: sendspin_page
      - if:
          condition:
            lambda: 'return phase == ${ui_phase_playlist_menu};'
          then:
            - lvgl.page.show: playlist_menu_page
            - script.execute: player_controls_timeout

  - id: player_controls_timeout
    mode: restart
    then:
      - delay: !lambda |-
          return (uint32_t) (id(player_controls_timeout_seconds).state * 1000.0f);
      - if:
          condition:
            media_player.is_idle: external_media_player
          then:
            - script.execute:
                id: set_ui_phase
                phase: ${ui_phase_standby}
          else:
            - script.execute:
                id: set_ui_phase
                phase: ${ui_phase_now_playing}

  - id: open_playlist_menu
    then:
      - script.stop: player_controls_timeout
      - lambda: |-
          id(ui_phase) = ${ui_phase_playlist_menu};
      - lvgl.page.show:
          id: playlist_menu_page
          animation: MOVE_BOTTOM
          time: 160ms
      - script.execute: player_controls_timeout

  - id: close_playlist_menu
    then:
      - script.stop: player_controls_timeout
      - lambda: |-
          id(ui_phase) = ${ui_phase_player_controls};
      - lvgl.page.show:
          id: player_controls_page
          animation: MOVE_TOP
          time: 160ms
      - script.execute: player_controls_timeout

  - id: refresh_playlist_labels
    mode: restart
    then:
      - lvgl.label.update:
          id: playlist_1_label
          text: !lambda return id(playlist_1_name).state;
      - lvgl.label.update:
          id: playlist_2_label
          text: !lambda return id(playlist_2_name).state;
      - lvgl.label.update:
          id: playlist_3_label
          text: !lambda return id(playlist_3_name).state;
      - lvgl.label.update:
          id: playlist_4_label
          text: !lambda return id(playlist_4_name).state;
      - lvgl.label.update:
          id: playlist_5_label
          text: !lambda return id(playlist_5_name).state;
      - lvgl.label.update:
          id: playlist_6_label
          text: !lambda return id(playlist_6_name).state;

  - id: play_playlist
    parameters:
      uri: string
    then:
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected) && !id(playlist_media_player_entity).state.empty() && !uri.empty();'
          then:
            - homeassistant.action:
                action: media_player.play_media
                data:
                  media_content_type: music
                data_template:
                  entity_id: "{{ media_player_entity }}"
                  media_content_id: "{{ media_url }}"
                variables:
                  media_player_entity: |-
                    return id(playlist_media_player_entity).state;
                  media_url: |-
                    return uri;

  - id: load_standby_background
    mode: restart
    then:
      - online_image.set_url:
          id: standby_background_image
          url: !lambda |-
            return "https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/Other/360x360/" + id(standby_background_choice).current_option().str() + ".png";

  - id: standby_screen_activity
    mode: restart
    then:
      - script.stop: standby_screen_timeout
      - if:
          condition:
            lambda: 'return id(screen_timeout_dimmed);'
          then:
            - light.turn_on:
                id: Sled
                brightness: !lambda 'return id(preferred_screen_brightness);'
            - lambda: |-
                id(screen_timeout_dimmed) = false;
      - if:
          condition:
            and:
              - switch.is_on: standby_screen_timeout_enabled
              - lambda: 'return id(ui_phase) == ${ui_phase_standby};'
          then:
            - script.execute: standby_screen_timeout

  - id: standby_screen_timeout
    mode: restart
    then:
      - delay: !lambda |-
          return (uint32_t) (id(standby_screen_timeout_seconds).state * 1000.0f / 3.0f);
      - if:
          condition:
            and:
              - switch.is_on: standby_screen_timeout_enabled
              - lambda: 'return id(ui_phase) == ${ui_phase_standby};'
          then:
            - lambda: |-
                id(preferred_screen_brightness) = id(Sled).remote_values.get_brightness();
                id(screen_timeout_dimmed) = true;
            - light.turn_on:
                id: Sled
                brightness: !lambda 'return id(preferred_screen_brightness) * 0.60f;'
          else:
            - script.stop: standby_screen_timeout
      - delay: !lambda |-
          return (uint32_t) (id(standby_screen_timeout_seconds).state * 1000.0f / 3.0f);
      - if:
          condition:
            and:
              - switch.is_on: standby_screen_timeout_enabled
              - lambda: 'return id(ui_phase) == ${ui_phase_standby};'
          then:
            - light.turn_on:
                id: Sled
                brightness: !lambda 'return id(preferred_screen_brightness) * 0.25f;'
          else:
            - script.stop: standby_screen_timeout
      - delay: !lambda |-
          return (uint32_t) (id(standby_screen_timeout_seconds).state * 1000.0f / 3.0f);
      - if:
          condition:
            and:
              - switch.is_on: standby_screen_timeout_enabled
              - lambda: 'return id(ui_phase) == ${ui_phase_standby};'
          then:
            - light.turn_off: Sled

  - id: now_playing_swipe_left
    then:
      - script.execute:
          id: album_art_slide
          direction: -1
      - media_player.next: sendspin_group_media_player

  - id: now_playing_swipe_right
    then:
      - script.execute:
          id: album_art_slide
          direction: 1
      - media_player.previous: sendspin_group_media_player

  - id: now_playing_swipe_up
    then:
      - media_player.volume_up: external_media_player
      - script.execute: show_volume_feedback

  - id: now_playing_swipe_down
    then:
      - media_player.volume_down: external_media_player
      - script.execute: show_volume_feedback

  - id: player_controls_keep_open
    then:
      - script.execute:
          id: set_ui_phase
          phase: ${ui_phase_player_controls}

  - id: player_controls_toggle
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.toggle: sendspin_group_media_player
            - script.execute: player_controls_keep_open

  - id: player_controls_previous
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.previous: sendspin_group_media_player
            - script.execute: player_controls_keep_open

  - id: player_controls_next
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.next: sendspin_group_media_player
            - script.execute: player_controls_keep_open

  - id: player_controls_volume_down
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.volume_down: external_media_player
            - script.execute: show_volume_ring
            - script.execute: player_controls_keep_open

  - id: player_controls_volume_up
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.volume_up: external_media_player
            - script.execute: show_volume_ring
            - script.execute: player_controls_keep_open

  - id: player_controls_mute
    then:
      - delay: 75ms
      - if:
          condition:
            lambda: 'return !id(touch_swipe_detected);'
          then:
            - media_player.mute: external_media_player
            - script.execute: player_controls_keep_open

  - id: show_volume_ring
    mode: restart
    then:
      - script.stop: hide_volume_ring
      - lambda: |-
          if (id(volume_ring_overlay) == nullptr) {
            id(volume_ring_overlay) = lv_obj_create(lv_layer_top());
            lv_obj_remove_style_all(id(volume_ring_overlay));
            lv_obj_set_size(id(volume_ring_overlay), 150, 150);
            lv_obj_center(id(volume_ring_overlay));
            lv_obj_set_style_bg_color(id(volume_ring_overlay), lv_color_hex(0x000000), 0);
            lv_obj_set_style_bg_opa(id(volume_ring_overlay), 230, 0);
            lv_obj_set_style_border_width(id(volume_ring_overlay), 3, 0);
            lv_obj_set_style_radius(id(volume_ring_overlay), LV_RADIUS_CIRCLE, 0);
            lv_obj_clear_flag(id(volume_ring_overlay), LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(id(volume_ring_overlay), LV_OBJ_FLAG_SCROLLABLE);

            id(volume_ring_label) = lv_label_create(id(volume_ring_overlay));
            lv_obj_set_width(id(volume_ring_label), 130);
            lv_obj_center(id(volume_ring_label));
            lv_obj_set_style_text_align(id(volume_ring_label), LV_TEXT_ALIGN_CENTER, 0);
            lv_obj_set_style_text_font(id(volume_ring_label), id(font_7seg), 0);
          }

          const float volume = std::max(0.0f, std::min(1.0f, id(external_media_player).volume));
          const int pct = (int) lroundf(volume * 100.0f);
          const uint32_t accent_u32 = ((uint32_t) id(accent_red) << 16) | ((uint32_t) id(accent_green) << 8) | (uint32_t) id(accent_blue);
          const lv_color_t accent = lv_color_hex(accent_u32);
          const uint32_t accent4_u32 = ((uint32_t) id(accent4_red) << 16) | ((uint32_t) id(accent4_green) << 8) | (uint32_t) id(accent4_blue);
          const lv_color_t accent4 = lv_color_hex(accent4_u32);
          lv_obj_set_style_border_color(id(volume_ring_overlay), accent, 0);
          lv_obj_set_style_text_color(id(volume_ring_label), accent4, 0);
          char text[8];
          snprintf(text, sizeof(text), "%d", pct);
          lv_label_set_text(id(volume_ring_label), text);
          lv_obj_set_style_opa(id(volume_ring_overlay), LV_OPA_COVER, 0);
          lv_obj_clear_flag(id(volume_ring_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(volume_ring_overlay));
      - script.execute: hide_volume_ring

  - id: hide_volume_ring
    mode: restart
    then:
      - delay: 900ms
      - lambda: |-
          if (id(volume_ring_overlay) == nullptr) return;
          lv_anim_del(id(volume_ring_overlay), nullptr);
          lv_anim_t fade;
          lv_anim_init(&fade);
          lv_anim_set_var(&fade, id(volume_ring_overlay));
          lv_anim_set_values(&fade, LV_OPA_COVER, LV_OPA_TRANSP);
          lv_anim_set_time(&fade, 260);
          lv_anim_set_exec_cb(&fade, [](void *obj, int32_t opacity) {
            lv_obj_set_style_opa((lv_obj_t *) obj, opacity, 0);
          });
          lv_anim_start(&fade);
      - delay: 280ms
      - lambda: |-
          if (id(volume_ring_overlay) != nullptr) {
            lv_obj_add_flag(id(volume_ring_overlay), LV_OBJ_FLAG_HIDDEN);
          }

  - id: album_art_slide
    mode: restart
    parameters:
      direction: int
    then:
      - lvgl.animation.stop: album_art_crossfade
      - lambda: |-
          id(album_art_slide_active) = true;
          id(sendspin_album_art_valid) = false;
          id(last_album_art_valid) = false;
          lv_obj_t *outgoing = id(slide_outgoing_art);
          lv_obj_t *incoming = id(slide_incoming_art);
          lv_anim_del(outgoing, nullptr);
          lv_anim_del(incoming, nullptr);
          lv_img_set_src(outgoing, lv_img_get_src(id(incoming_art)));
          lv_img_set_zoom(outgoing, LV_ZOOM_NONE);
          lv_img_set_src(incoming, id(fallback_playing_image));
          lv_img_set_zoom(incoming, LV_ZOOM_NONE);
          lv_obj_set_x(outgoing, 0);
          lv_obj_set_x(incoming, -direction * ${screenwidth});
          lv_obj_clear_flag(outgoing, LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(incoming, LV_OBJ_FLAG_HIDDEN);

          lv_anim_t current_slide;
          lv_anim_init(&current_slide);
          lv_anim_set_var(&current_slide, outgoing);
          lv_anim_set_values(&current_slide, 0, direction * ${screenwidth});
          lv_anim_set_time(&current_slide, 300);
          lv_anim_set_exec_cb(&current_slide, [](void *obj, int32_t x) {
            lv_obj_set_x((lv_obj_t *) obj, x);
          });
          lv_anim_start(&current_slide);

          lv_anim_t incoming_slide;
          lv_anim_init(&incoming_slide);
          lv_anim_set_var(&incoming_slide, incoming);
          lv_anim_set_values(&incoming_slide, -direction * ${screenwidth}, 0);
          lv_anim_set_time(&incoming_slide, 300);
          lv_anim_set_exec_cb(&incoming_slide, [](void *obj, int32_t x) {
            lv_obj_set_x((lv_obj_t *) obj, x);
          });
          lv_anim_start(&incoming_slide);
      - delay: 300ms
      - lambda: |-
          lv_obj_add_flag(id(slide_outgoing_art), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(slide_incoming_art), LV_OBJ_FLAG_HIDDEN);
          lv_img_set_src(id(incoming_art), id(fallback_playing_image));
          lv_img_set_zoom(id(incoming_art), LV_ZOOM_NONE);
          id(album_art_slide_active) = false;
          id(album_art_awaiting_swipe_art) = true;

  - id: album_art_crossfade_apply
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(last_album_art_valid);'
          then:
            - lvgl.image.update:
                id: outgoing_art
                src: sendspin_album_art_transition
          else:
            - lvgl.image.update:
                id: outgoing_art
                src: fallback_playing_image
      - lvgl.image.update:
          id: incoming_art
          src: sendspin_album_art
      - lvgl.animation.start: album_art_crossfade

  - id: show_volume_feedback
    mode: restart
    then:
      - lambda: |-
          int pct = (int) lroundf(id(external_media_player).volume * 100.0f);
          if (pct < 0) pct = 0;
          if (pct > 100) pct = 100;
          char buf[8];
          snprintf(buf, sizeof(buf), "%d%%", pct);
          lv_label_set_text(id(volume_feedback_label), buf);
          lv_obj_clear_flag(id(volume_feedback_box), LV_OBJ_FLAG_HIDDEN);
      - delay: 1200ms
      - lambda: |-
          lv_obj_add_flag(id(volume_feedback_box), LV_OBJ_FLAG_HIDDEN);

  - id: album_art_timeout_fallback
    mode: restart
    then:
      - delay: 2000ms
      - if:
          condition:
            and:
              - lambda: 'return !id(sendspin_album_art_valid);'
              - lambda: 'return !id(album_art_slide_active);'
          then:
            - if:
                condition:
                  lambda: 'return id(last_album_art_valid);'
                then:
                  - lvgl.image.update:
                      id: outgoing_art
                      src: sendspin_album_art_transition
                else:
                  - lvgl.image.update:
                      id: outgoing_art
                      src: fallback_playing_image
            - lvgl.image.update:
                id: incoming_art
                src: fallback_playing_image
            - lvgl.animation.start: album_art_crossfade
            - lvgl.image.update:
                id: controls_album_art_widget
                src: fallback_playing_image
            - lvgl.image.update:
                id: playlist_album_art_widget
                src: fallback_playing_image

  - id: mp_idle_debounce
    mode: restart
    then:
      - delay: 1200ms
      - if:
          condition:
            and:
              - media_player.is_idle: external_media_player
              - lambda: 'return id(ui_phase) != ${ui_phase_player_controls};'
          then:
            - script.execute:
                id: set_ui_phase
                phase: ${ui_phase_standby}

  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: 'return sound_file == "ready_sound";'
          then:
            - lambda: 'id(boot_announce_active) = true;'

      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true

      - lambda: |-
          if ((id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }

