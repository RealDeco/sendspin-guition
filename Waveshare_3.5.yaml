### wallpaper

  - platform: online_image
    id: standby_background_image
    url: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/Other/${screenwidth}x${screenheight}/clock.png
    format: PNG
    type: RGB565
    resize: ${screenwidth}x${screenheight}
    update_interval: never
    on_download_finished:
      - if:
          condition:
            switch.is_on: standby_background_enabled
          then:
            - lvgl.image.update:
                id: standby_background_widget
                src: standby_background_image
            - lambda: |-
                lv_obj_clear_flag(id(standby_background_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_move_background(id(standby_background_widget));

  - platform: online_image
    id: family_photo_image
    url: https://raw.githubusercontent.com/RealDeco/sendspin-guition/main/images/family_photo1.png
    format: PNG
    type: RGB565
    resize: ${imagewidth}x${imageheight}
    update_interval: never
    on_download_finished:
      - if:
          condition:
            lambda: 'return id(standby_frame_content).current_option() == "Family Photo";'
          then:
            - lvgl.image.update:
                id: family_photo_widget
                src: family_photo_image
            - lvgl.widget.show: family_photo_block
    on_error:
      - lambda: |-
          ESP_LOGW("family_photo", "failed to load photo");
    
### sendspin album art

  - platform: sendspin
    id: album_slot
    format: JPEG
    type: RGB565
    resize: ${imagewidth}x${imageheight}
    display_offset: 1s
    source: ALBUM
    current_image:
      id: sendspin_album_art
    transition_image:
      id: sendspin_album_art_transition
    on_image_display:
      - logger.log:
          format: "Album art displayed (late by %u ms)"
          args: ["(unsigned) lateness_ms"]
          level: WARN
      - script.stop: album_art_timeout_fallback
      - lambda: |-
          id(sendspin_album_art_valid) = true;
          id(album_art_awaiting_swipe_art) = false;
          id(confirmed_art_album_name) = id(sendspin_album).get_state();
      - script.execute: album_art_crossfade_apply
    on_image_clear:
      - lambda: |-
          ESP_LOGW("imagecheck", id(sendspin_album).get_state().c_str(), "Cleared");
    on_image_error:
      - lambda: |-
          ESP_LOGW("album_art", "failed to decode album art");
          id(sendspin_album_art_valid) = false;

sendspin:
  id: sendspin_hub
#  task_stack_in_psram: true

audio_file:
  - id: timer_finished_sound
    file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
  - id: ready_sound
    file: https://github.com/RealDeco/xiaozhi-esphome/raw/main/sounds/${startup_sound_file}.flac
  - id: wake_word_sound
    file: https://github.com/RealDeco/xiaozhi-esphome/raw/main/sounds/${wakeup_sound}.flac

http_request:

i2c:
  id: bus_a
  sda: GPIO8
  scl: GPIO7
  scan: true
  frequency: 400kHz

pca9554:
  - id: pca9554a_device
    address: 0x20

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO13
    i2s_mclk_pin: GPIO12
  - id: i2s_lineout
    i2s_lrclk_pin: GPIO44
    i2s_bclk_pin: GPIO48
    
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a

    
microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO14
    adc_type: external
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: internal_speaker
    i2s_dout_pin: GPIO16
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: left
    audio_dac: es8311_dac
    buffer_duration: 100ms

  - platform: i2s_audio
    id: external_speaker
    i2s_audio_id: i2s_lineout
    i2s_dout_pin: GPIO43
    dac_type: external
    channel: stereo
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: router
    id: box_speaker
    output_speakers:
      - internal_speaker
      - external_speaker
    bits_per_sample: 16
    num_channels: 2
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: box_speaker
    num_channels: 2
#    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
      - id: media_mixing_input

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: ${media_sample_rate}
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: ${media_sample_rate}
    bits_per_sample: 16

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
  - platform: audio_http
    id: http_media_source
  - platform: sendspin
    id: sendspin_media_source

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    name: Sendspin Group Media Player

  - platform: speaker_source
    id: external_media_player
    name: Media Player

    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: ${media_sample_rate}
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source

    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: ${media_sample_rate}
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85

    on_play:
      then:
        - script.stop: mp_idle_debounce
        - if:
            condition:
              and:
                - lambda: 'return id(va_phase) == ${va_phase_idle};'
                - lambda: 'return !id(va_reply_active);'
                - not:
                    media_player.is_announcing:
                      id: external_media_player
            then:
              - script.execute: stop_wake_word
        - if:
            condition:
              lambda: 'return id(va_phase) == ${va_phase_idle};'
            then:
              - if:
                  condition:
                    lambda: 'return id(ui_phase) == ${ui_phase_player_controls};'
                  then:
                    - script.execute:
                        id: set_ui_phase
                        phase: ${ui_phase_player_controls}
                  else:
                    - script.execute:
                        id: set_ui_phase
                        phase: ${ui_phase_now_playing}

    on_idle:
      then:
        - if:
            condition:
              lambda: 'return id(va_reply_active);'
            then:
              - lambda: |-
                  id(va_reply_active) = false;
              - script.execute: finish_va_reply
            else:
              - if:
                  condition:
                    and:
                      - lambda: 'return id(va_phase) == ${va_phase_idle};'
                      - not:
                          media_player.is_announcing:
                            id: external_media_player
                  then:
                    - script.execute: start_wake_word
              - if:
                  condition:
                    lambda: 'return id(va_phase) == ${va_phase_idle};'
                  then:
                    - script.execute: mp_idle_debounce

    on_pause:
      then:
        - if:
            condition:
              lambda: 'return id(va_phase) == ${va_phase_idle};'
            then:
              - script.execute: start_wake_word
              - script.execute:
                  id: set_ui_phase
                  phase: ${ui_phase_player_controls}

switch:
  - platform: gpio
    name: Speaker Enable
    icon: "mdi:speaker"
    entity_category: config
    pin:
      pca9554: pca9554a_device
      number: 7
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: startup_sound_switch
    name: Startup sound
    icon: "mdi:card-text-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: wake_word_sound_switch
    name: Wake word sound
    icon: "mdi:ear-hearing"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: mute
    name: Mute microphone
    icon: "mdi:microphone-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - microphone.unmute:
      - script.execute: start_wake_word
    on_turn_on:
      - script.execute: stop_wake_word
      - microphone.mute:

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - micro_wake_word.disable_model: stop
      - script.execute:
          id: set_va_phase
          phase: ${va_phase_idle}
      - script.execute: disable_repeat
      - if:
          condition:
            media_player.is_announcing:
              id: external_media_player
          then:
            - media_player.stop:
                announcement: true
                id: external_media_player
    on_turn_on:
      - micro_wake_word.enable_model: stop
      - script.execute:
          id: set_va_phase
          phase: ${va_phase_timer_ringing}
      - script.execute: ring_timer
      - delay: 15min
      - switch.turn_off: timer_ringing

  - platform: template
    id: standby_screen_timeout_enabled
    name: Standby screen timeout
    icon: "mdi:monitor-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: standby_screen_activity
    on_turn_off:
      - script.execute: standby_screen_activity

  - platform: template
    id: standby_background_enabled
    name: Standby clock background
    icon: "mdi:image-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: load_standby_background
    on_turn_off:
      - lambda: |-
          lv_obj_add_flag(id(standby_background_widget), LV_OBJ_FLAG_HIDDEN);
      - online_image.release: standby_background_image

  - platform: template
    id: clock_12h_format
    name: 12-Hour Clock
    icon: "mdi:clock-time-four-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - component.update: clock_hms
    on_turn_off:
      - component.update: clock_hms

  - platform: template
    id: clock_show_date
    name: Show Date
    icon: "mdi:calendar-blank-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - if:
          condition:
            and:
              - lambda: 'return !lv_obj_has_flag(id(standby_panel), LV_OBJ_FLAG_HIDDEN);'
              - lambda: 'return !id(clock_style_is_analog);'
          then:
            - lvgl.widget.show: date_label
      - script.execute: analog_clock_redraw
    on_turn_off:
      - lvgl.widget.hide: date_label
      - script.execute: analog_clock_redraw

  - platform: template
    id: clock_show_seconds
    name: Show Seconds
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - component.update: clock_hms
