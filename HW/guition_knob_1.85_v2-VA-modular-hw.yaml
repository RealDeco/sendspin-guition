# Hardware package for Guition JC3636K718 / 1.85 inch knob board.
# Edit this file for board pinouts and device-specific hardware.

external_components:
  - source: github://RAR/esphome-drv2605
    components: [drv2605]
    refresh: 1h

substitutions:
  display_model: "JC3636W518V2"
  pdm_mic_type: "true"
  media_sample_rate: 48000

button:
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    icon: "mdi:restart"

spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO11
  data_pins: [GPIO13, GPIO14, GPIO15, GPIO16]

i2c:
  id: touchscreen_bus
  sda: GPIO9
  scl: GPIO10

drv2605:
  id: haptic_driver
  i2c_id: touchscreen_bus
  address: 0x5A
  motor_type: LRA
  library: 6

i2s_audio:
  #   Speaker/PCM5100A: WS GPIO45, BCK GPIO3, DO GPIO42, no MCLK
  #   PDM mic: SCK GPIO5, DATA GPIO4
  # PDM mic uses GPIO5 as clock and GPIO4 as data; no LRCLK/WS pin is routed for mic input.
  - id: i2s_mic
    i2s_lrclk_pin: GPIO5

  - id: i2s_audio_bus
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO3

microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO4
    adc_type: external
    channel: left
    pdm: ${pdm_mic_type}
    sample_rate: 16000
    bits_per_sample: 16bit
    
speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO42
    dac_type: external
    channel: stereo
    buffer_duration: 100ms

  - platform: mixer
    id: mixing_speaker
    output_speaker: box_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
      - id: media_mixing_input

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: ${media_sample_rate}
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: ${media_sample_rate}
    bits_per_sample: 16
    
media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000
  - platform: sendspin
    id: sendspin_media_source

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    name: Sendspin Group Media Player

  - platform: speaker_source
    id: external_media_player
    name: Media Player

    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: ${media_sample_rate}
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source

    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: ${media_sample_rate}
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85

    on_play:
      then:
        - script.stop: mp_idle_debounce
        - if:
            condition:
              and:
                - lambda: 'return id(va_phase) == ${va_phase_idle};'
                - lambda: 'return !id(va_reply_active);'
                - not:
                    media_player.is_announcing:
                      id: external_media_player
            then:
              - lambda: |-
                  ESP_LOGW("va", "stopping wake word for media playback");
              - script.execute: stop_wake_word
        - script.execute: led_ring_apply_state
        - if:
            condition:
              lambda: 'return id(va_phase) == ${va_phase_idle};'
            then:
              - if:
                  condition:
                    lambda: 'return id(ui_phase) == ${ui_phase_player_controls};'
                  then:
                    - script.execute:
                        id: set_ui_phase
                        phase: ${ui_phase_player_controls}
                  else:
                    - script.execute:
                        id: set_ui_phase
                        phase: ${ui_phase_now_playing}

    on_idle:
      then:
        - if:
            condition:
              lambda: 'return id(va_reply_active);'
            then:
              - lambda: |-
                  id(va_reply_active) = false;
              - script.execute: finish_va_reply
            else:
              - if:
                  condition:
                    and:
                      - lambda: 'return id(va_phase) == ${va_phase_idle};'
                      - not:
                          media_player.is_announcing:
                            id: external_media_player
                  then:
                    - script.execute: start_wake_word
              - if:
                  condition:
                    lambda: 'return id(va_phase) == ${va_phase_idle};'
                  then:
                    - script.execute: mp_idle_debounce
              - script.execute: led_ring_apply_state

    on_pause:
      then:
        - script.execute: led_ring_apply_state
        - if:
            condition:
              lambda: 'return id(va_phase) == ${va_phase_idle};'
            then:
              - script.execute: start_wake_word
              - script.execute:
                  id: set_ui_phase
                  phase: ${ui_phase_player_controls}

binary_sensor:
  - platform: gpio
    id: rotary_cw_pulse
    internal: true
    pin:
      number: GPIO1
      mode:
        input: true
        pullup: true
    use_interrupt: false
    filters:
      - delayed_on_off: 2ms
    on_press:
      then:
        - logger.log:
            level: WARN
            tag: rotary
            format: "GPIO1 CW pulse"
        - script.execute: standby_screen_activity
        - media_player.volume_up: external_media_player
        - script.execute: haptic_click
        - script.execute: show_volume_ring

  - platform: gpio
    id: rotary_ccw_pulse
    internal: true
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
    use_interrupt: false
    filters:
      - delayed_on_off: 2ms
    on_press:
      then:
        - logger.log:
            level: WARN
            tag: rotary
            format: "GPIO2 CCW pulse"
        - script.execute: standby_screen_activity
        - media_player.volume_down: external_media_player
        - script.execute: haptic_click
        - script.execute: show_volume_ring

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO21
    inverted: false

light:
  - platform: monochromatic
    id: Sled
    name: Screen
    icon: mdi:television
    entity_category: config
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

  - platform: esp32_rmt_led_strip
    id: rgb_ring
    name: RGB ring
    icon: mdi:led-strip-variant
    pin:
      number: GPIO0
      ignore_strapping_warning: true
    num_leds: 13
    chipset: WS2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 250ms
    effects:
      - addressable_lambda:
          name: "Waiting for Command"
          update_interval: 100ms
          lambda: |-
            auto light_color = id(rgb_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255, light_color.get_blue() * 255);
            static uint8_t index = 0;
            if (initial_run) { index = 0; }
            for (uint8_t i = 0; i < 13; i++) {
              if (i == index % 13) {
                it[i] = color;
              } else if (i == (index + 12) % 13) {
                it[i] = color * 192;
              } else if (i == (index + 11) % 13) {
                it[i] = color * 128;
              } else if (i == (index + 6) % 13) {
                it[i] = color;
              } else if (i == (index + 5) % 13) {
                it[i] = color * 192;
              } else if (i == (index + 4) % 13) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            index = (index + 1) % 13;
      - addressable_lambda:
          name: "Listening For Command"
          update_interval: 50ms
          lambda: |-
            auto light_color = id(rgb_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255, light_color.get_blue() * 255);
            static uint8_t index = 0;
            if (initial_run) { index = 0; }
            for (uint8_t i = 0; i < 13; i++) {
              if (i == index % 13) {
                it[i] = color;
              } else if (i == (index + 12) % 13) {
                it[i] = color * 192;
              } else if (i == (index + 11) % 13) {
                it[i] = color * 128;
              } else if (i == (index + 6) % 13) {
                it[i] = color;
              } else if (i == (index + 5) % 13) {
                it[i] = color * 192;
              } else if (i == (index + 4) % 13) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            index = (index + 1) % 13;
      - addressable_lambda:
          name: "Thinking"
          update_interval: 20ms
          lambda: |-
            static uint8_t index = 0;
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            const uint8_t brightness_step_number = 10;
            if (initial_run) {
              index = 0;
              brightness_step = 0;
              brightness_decreasing = true;
            }
            auto light_color = id(rgb_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255, light_color.get_blue() * 255);
            const uint8_t level = 255 / brightness_step_number * (brightness_step_number - brightness_step);
            for (uint8_t i = 0; i < 13; i++) {
              if (i == index % 13 || i == (index + 6) % 13) {
                it[i] = color * level;
              } else {
                it[i] = Color::BLACK;
              }
            }
            if (brightness_decreasing) { brightness_step++; } else { brightness_step--; }
            if (brightness_step == 0 || brightness_step == brightness_step_number) { brightness_decreasing = !brightness_decreasing; }
            index = (index + 1) % 13;
      - addressable_lambda:
          name: "Replying"
          update_interval: 50ms
          lambda: |-
            auto light_color = id(rgb_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255, light_color.get_blue() * 255);
            static uint8_t index = 0;
            if (initial_run) { index = 0; }
            index = (13 + index - 1) % 13;
            for (uint8_t i = 0; i < 13; i++) {
              if (i == index % 13) {
                it[i] = color;
              } else if (i == (index + 1) % 13) {
                it[i] = color * 192;
              } else if (i == (index + 2) % 13) {
                it[i] = color * 128;
              } else if (i == (index + 6) % 13) {
                it[i] = color;
              } else if (i == (index + 7) % 13) {
                it[i] = color * 192;
              } else if (i == (index + 8) % 13) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }

touchscreen:
  - platform: cst816
    id: my_touchscreen
    interrupt_pin: GPIO7
    reset_pin: GPIO8
    display: main_display
    i2c_id: touchscreen_bus
    on_touch:
      then:
        - script.execute: standby_screen_activity
        - lambda: |-
            id(touch_active) = true;
            id(touch_start_x) = touch.x;
            id(touch_start_y) = touch.y;
            id(touch_last_x) = touch.x;
            id(touch_last_y) = touch.y;
            id(touch_start_ms) = millis();
            id(touch_swipe_detected) = false;
    on_update:
      then:
        - lambda: |-
            if (!id(touch_active)) return;
            for (auto &touch : touches) {
              if (touch.state >= 1 && touch.state <= 2) {
                id(touch_last_x) = touch.x;
                id(touch_last_y) = touch.y;
                const int min_dim = std::min(id(main_display).get_width(), id(main_display).get_height());
                const int swipe_min_dist = std::max(16, min_dim / 8);
                if (std::abs(id(touch_last_x) - id(touch_start_x)) >= swipe_min_dist ||
                    std::abs(id(touch_last_y) - id(touch_start_y)) >= swipe_min_dist) {
                  id(touch_swipe_detected) = true;
                  lv_obj_remove_state(id(controls_mute_button), LV_STATE_PRESSED);
                  lv_obj_remove_state(id(controls_repeat_button), LV_STATE_PRESSED);
                  lv_obj_remove_state(id(controls_toggle_button), LV_STATE_PRESSED);
                  lv_obj_remove_state(id(controls_shuffle_button), LV_STATE_PRESSED);
                  lv_obj_remove_state(id(controls_volume_down_button), LV_STATE_PRESSED);
                  lv_obj_remove_state(id(controls_volume_up_button), LV_STATE_PRESSED);
                }
                break;
              }
            }
    on_release:
      then:
        - lambda: |-
            if (!id(touch_active)) return;
            id(touch_active) = false;

            const int dx = id(touch_last_x) - id(touch_start_x);
            const int dy = id(touch_last_y) - id(touch_start_y);
            const int abs_x = std::abs(dx);
            const int abs_y = std::abs(dy);
            const uint32_t elapsed = millis() - id(touch_start_ms);
            const int min_dim = std::min(id(main_display).get_width(), id(main_display).get_height());
            const int swipe_min_dist = std::max(16, min_dim / 8);
            const int tap_max_dist = std::max(14, min_dim / 12);

            if (id(va_phase) != ${va_phase_idle}) {
              id(stop_active_va)->execute();
              return;
            }

            if (elapsed <= 1500 && (abs_x >= swipe_min_dist || abs_y >= swipe_min_dist)) {
              if (id(ui_phase) == ${ui_phase_now_playing}) {
                if (abs_x >= abs_y) {
                  if (dx < 0) {
                    id(now_playing_swipe_left)->execute();
                  } else {
                    id(now_playing_swipe_right)->execute();
                  }
                } else if (dy < 0) {
                  id(start_manual_va)->execute();
                } else {
                  id(open_playlist_menu)->execute();
                }
              } else if (id(ui_phase) == ${ui_phase_player_controls}) {
                if (abs_x >= abs_y) {
                  if (dx < 0) {
                    id(player_controls_swipe_next)->execute();
                  } else {
                    id(player_controls_swipe_previous)->execute();
                  }
                } else if (dy < 0) {
                  id(start_manual_va)->execute();
                } else {
                  id(open_playlist_menu)->execute();
                }
              } else if (id(ui_phase) == ${ui_phase_playlist_menu}) {
                if (abs_x >= abs_y) {
                  if (dx < 0) {
                    id(player_controls_swipe_next)->execute();
                  } else {
                    id(player_controls_swipe_previous)->execute();
                  }
                } else if (dy < 0) {
                  id(close_playlist_menu)->execute();
                }
              }
              return;
            }

            if (elapsed <= 700 && abs_x <= tap_max_dist && abs_y <= tap_max_dist) {
              id(set_ui_phase)->execute(${ui_phase_player_controls});
            }

display:
  - platform: mipi_spi
    id: main_display
    model: ${display_model}
    cs_pin: GPIO12
    reset_pin: GPIO17
    auto_clear_enabled: false
    update_interval: never
    dimensions:
        height: ${screenheight}
        width: ${screenwidth}

globals:
  - id: haptic_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

switch:
  - platform: gpio
    name: Speaker Enable
    icon: "mdi:speaker"
    entity_category: config
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: rotary_haptic_feedback_enabled
    name: Rotary haptic feedback
    icon: "mdi:vibrate"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: led_ring_enabled
    name: LED ring
    icon: "mdi:led-strip-variant"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: led_ring_apply_state
    on_turn_off:
      - light.turn_off: rgb_ring

script:
  - id: haptic_click
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rotary_haptic_feedback_enabled
          then:
            - lambda: |-
                const uint32_t now = millis();
                if (now - id(haptic_last_ms) < 45) return;
                id(haptic_last_ms) = now;
            - drv2605.play_effect:
                id: haptic_driver
                effect: 7

  - id: led_ring_apply_state
    mode: restart
    then:
      - if:
          condition:
            switch.is_off: led_ring_enabled
          then:
            - light.turn_off: rgb_ring
          else:
            - if:
                condition:
                  lambda: |-
                    return id(va_phase) == ${va_phase_timer_ringing};
                then:
                  - light.turn_on:
                      id: rgb_ring
                      brightness: 75%
                      red: 100%
                      green: 35%
                      blue: 0%
                      effect: "none"
                else:
                  - if:
                      condition:
                        lambda: |-
                          return id(va_phase) == ${va_phase_waiting_for_command};
                      then:
                        - light.turn_on:
                            id: rgb_ring
                            brightness: 75%
                            red: 0%
                            green: 40%
                            blue: 100%
                            effect: "Waiting for Command"
                      else:
                        - if:
                            condition:
                              lambda: |-
                                return id(va_phase) == ${va_phase_listening};
                            then:
                              - light.turn_on:
                                  id: rgb_ring
                                  brightness: 90%
                                  red: 0%
                                  green: 75%
                                  blue: 100%
                                  effect: "Listening For Command"
                            else:
                              - if:
                                  condition:
                                    lambda: |-
                                      return id(va_phase) == ${va_phase_thinking};
                                  then:
                                    - light.turn_on:
                                        id: rgb_ring
                                        brightness: 80%
                                        red: 100%
                                        green: 100%
                                        blue: 0%
                                        effect: "Thinking"
                                  else:
                                    - if:
                                        condition:
                                          lambda: |-
                                            return id(va_phase) == ${va_phase_replying};
                                        then:
                                          - light.turn_on:
                                              id: rgb_ring
                                              brightness: 80%
                                              red: 0%
                                              green: 100%
                                              blue: 100%
                                              effect: "Replying"
                                        else:
                                          - if:
                                              condition:
                                                lambda: |-
                                                  return id(va_phase) == ${va_phase_error};
                                              then:
                                                - light.turn_on:
                                                    id: rgb_ring
                                                    brightness: 80%
                                                    red: 100%
                                                    green: 0%
                                                    blue: 100%
                                                    effect: "none"
                                              else:
                                                - if:
                                                    condition:
                                                      media_player.is_playing: external_media_player
                                                    then:
                                                      - light.turn_on:
                                                          id: rgb_ring
                                                          brightness: 45%
                                                          red: 0%
                                                          green: 100%
                                                          blue: 0%
                                                          effect: "none"
                                                    else:
                                                      - light.turn_on:
                                                          id: rgb_ring
                                                          brightness: 28%
                                                          red: 100%
                                                          green: 0%
                                                          blue: 0%
                                                          effect: "none"


